# authentik blueprint: coder's OIDC application and provider.
#
# WHY THIS EXISTS INSTEAD OF A UI CLICK
# authentik ships no CRDs - verified on this cluster (`kubectl get crd | grep -i authentik` returns
# nothing) and the chart we pin, authentik-2026.8.3, has no crds/ directory and no operator
# templates, so "declare it as a Kubernetes object" was never on the table. Blueprints are
# authentik's own infrastructure-as-code format: YAML the worker applies against its own API, and
# the chart mounts them from a Secret (values.yaml:220, `blueprints.secrets`). That is the
# first-party declarative path, and it means a rebuilt authentik gets coder's client back from git.
#
# HOW THIS FILE BECOMES A SECRET
# Nothing here is applied directly. scripts/setup-coder-secrets.sh substitutes the two `${...}`
# placeholders below and writes the result, sops-encrypted, to
# apply/10-secrets/authentik-coder-blueprint.yaml. `make oidc-check` then proves the rendered
# Secret still agrees with this file and with coder's own copy of the same two values - which is
# what stops this file and the applied artifact from drifting apart.
#
# BLAST RADIUS
# Every entry is identified by name/slug `coder`. It cannot touch another application's provider,
# and `state: present` makes it idempotent.
#
# WHAT IS NOT PROVEN
# The flow slugs below were probed against the live instance and are real:
#   default-authentication-flow                      200
#   default-invalidation-flow                        200
#   default-provider-authorization-implicit-consent  200
#   default-authorization-flow                       404  <- the obvious name, and it does not exist
# That 404 is why the slugs were probed instead of written from memory.
# `property_mappings` and the flow references were answered from source, not guessed, after the first
# apply failed validation. See the attrs block below for the exact rule and where it lives.
version: 1
metadata:
  name: coder
entries:
  - model: authentik_providers_oauth2.oauth2provider
    # Named so the application entry below can point at it with !KeyOf instead of hunting the
    # database for an object this blueprint creates itself.
    id: coder-provider
    identifiers:
      name: coder
    state: present
    attrs:
      name: coder
      client_type: confidential
      client_id: "${CODER_OIDC_CLIENT_ID}"
      client_secret: "${CODER_OIDC_CLIENT_SECRET}"
      # Must match coder's callback exactly, and it is not a guess: coderd registers the OIDC
      # callback at /api/v2/users/oidc/callback (coderd/coderd.go, r.Route("/oidc/callback") under
      # the /users group). strict matching, because a prefix match here is a redirect-URI bypass.
      redirect_uris:
        - url: https://coder.titan.arrieta.eu/api/v2/users/oidc/callback
          matching_mode: strict
      grant_types:
        - authorization_code
        - refresh_token
      # Related fields must be primary keys, not lookup dicts. The importer only rewrites a value if
      # it is a key in its own pk_map (v1/importer.py:175-197, populated at :441 from entries inside
      # this blueprint); everything else reaches the serializer verbatim, and these are
      # PrimaryKeyRelatedFields. Writing `slug: default-...` therefore fails with
      #   "{'slug': 'default-provider-authorization-implicit-consent'}" is not a valid UUID
      # which is precisely what the first apply reported. `!Find` is the tag built for this job: it
      # runs apps.get_model(...).objects.filter(...).first() and resolves to instance.pk
      # (v1/common.py:369-413). Model names are the app_label from each app's apps.py plus the lower-
      # cased class - `default-scopes` is a ScopeMapping, which inherits PropertyMapping but lives in
      # the oauth2 app, so it is authentik_providers_oauth2.scopemapping and not a policies model.
      # The scope mapping is not optional in practice: it is what puts email and username into the
      # token, and coder reads both.
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [name, default-scopes]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
      # implicit-consent, not explicit: this IdP serves one operator and the consent would add a click
      # and no security. Switch to default-provider-authorization-explicit-consent if coder ever asks
      # for scopes beyond openid profile email.
      issuer_mode: per_provider
      sub_mode: hashed_user_id

  - model: authentik_core.application
    identifiers:
      name: coder
    state: present
    attrs:
      name: coder
      # The slug is what makes the issuer URL, and coder is configured with
      # https://auth.titan.arrieta.eu/application/o/coder/ - so this slug is load-bearing, not
      # cosmetic. Changing it invalidates coder's OIDC issuer and every session token under it.
      slug: coder
      # !KeyOf, not !Find: the provider is created by this same blueprint, one entry above, and
      # validate() runs the entire import inside a rolled-back transaction (v1/importer.py:453-474),
      # so the instance genuinely exists by the time this entry resolves. KeyOf raises if no entry with
      # that id has an instance yet (v1/common.py:239-253) - the loud failure I want if the entry order
      # ever changes, rather than a silently null provider that validates and then does nothing.
      provider: !KeyOf coder-provider

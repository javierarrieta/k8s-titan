---
# Workspaces only. Coder's provisioner RBAC is scoped to this namespace and to nothing else,
# which is what makes it safe to hand a workload pod-creation rights at all.
apiVersion: v1
kind: Namespace
metadata:
  name: coder-workspaces
  labels:
    name: coder-workspaces
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
  annotations:
    kubernetes.io/description: "Coder workspace pods, injected by coder itself"
---
# The namespace for the identity k8s-casa's Prometheus scrapes titan with, and for
# kube-state-metrics. Declared here rather than inside the monitoring manifests for
# the same reason as every other namespace in this file: the stage order has to be
# able to depend on it, and a namespace created by the thing that lives in it is a
# race the kustomize-controller would rather not lose.
#
# `monitoring` is also a namespace name casa already uses, which is exactly why
# every series this cluster emits is stamped cluster=titan -- see
# docs/titan-metrics-scrape.md before changing any label here.
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    name: monitoring
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
  annotations:
    kubernetes.io/description: "The identity k8s-casa scrapes titan with, and kube-state-metrics"
---
# Open WebUI. Its own namespace because it fails the admission test in
# docs/superpowers/specs/2026-10-19-titan-app-scale-out-design.md §3.1 on three axes — own Secret
# set, own database, own public hostname — and coder is the precedent for what that means here:
# own namespace, shared `apps` stage (spec D6 of the open-webui spec).
#
# NO pod-security label, deliberately. coder and monitoring carry
# `pod-security.kubernetes.io/warn: restricted`; open-webui cannot satisfy it — the image's own
# Dockerfile is `ARG UID=0`, so the container runs as root. A warn-only label on a workload that
# can never meet it is a signal that reads better than it is. If a non-root build is ever wanted,
# the label goes on in that change, not this one.
apiVersion: v1
kind: Namespace
metadata:
  name: open-webui
  labels:
    name: open-webui
  annotations:
    kubernetes.io/description: "Open WebUI - OIDC sign-in through authentik, data in the shared CNPG cluster"
---
# Grafana, and nothing else. It fails the admission test in
# docs/superpowers/specs/2026-10-19-titan-app-scale-out-design.md §3.1 on own public hostname and
# own Secret set, so it gets a namespace; it stays in the shared `apps` stage, per coder and
# open-webui (see the §3.1/§3.2 amendment of 2026-10-21 — §3.1 buys a namespace, not a stage).
#
# Unlike open-webui, this one CAN carry the restricted warn label: the official grafana image runs
# as uid 472 gid 0 by design, and the Deployment sets runAsNonRoot. A warn label on a workload that
# can never meet it is noise (open-webui's note above); on this one it is a real signal.
apiVersion: v1
kind: Namespace
metadata:
  name: observability
  labels:
    name: observability
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
  annotations:
    kubernetes.io/metadata.name: observability
    kubernetes.io/description: "Grafana, reading casa's Prometheus and Loki over the mesh"
---
# OpenCloud (the Infinite Scale fork) and its Collabora editor. It fails the admission test in
# docs/superpowers/specs/2026-10-19-titan-app-scale-out-design.md §3.1 on three counts at once - own
# public hostname, own Secret set, and a store of its own - so it gets a namespace, and it stays in
# the shared `apps` stage per §3.2.
#
# The name is `files`, not the product's name, because the namespace is the domain rather than the
# app: the WOPI collaboration service, the editor and the object-store client config all live here.
# That turned out to be worth more than a tidy name - the product underneath this namespace has now
# changed once, from PHP Nextcloud to Infinite Scale and from Infinite Scale to OpenCloud, and the
# namespace, the certificate reflection and the hostname all survived the swap untouched.
#
# No pod-security warn label. The opencloud and collabora/code images run as uids and with capabilities
# (collabora needs MKNOD) that restricted would only warn about, and a warn that fires on every pod in
# the namespace is noise that trains everyone to ignore the label.
apiVersion: v1
kind: Namespace
metadata:
  name: files
  labels:
    name: files
  annotations:
    kubernetes.io/metadata.name: files
    kubernetes.io/description: "Infinite Scale file sync and share, with Collabora as the editor"
---
# Mealie, the recipe manager. Fails the admission test in
# docs/superpowers/specs/2026-10-19-titan-app-scale-out-design.md §3.1 on three counts at once — own
# public hostname, own Secret set, and a database of its own — so it gets a namespace, and it stays in
# the shared `apps` stage per §3.2: two hand-written manifests, no bulk authored here, so freezing its
# neighbours on a malformed field is the accepted cost rather than a new one.
apiVersion: v1
kind: Namespace
metadata:
  name: mealie
  labels:
    name: mealie
  annotations:
    kubernetes.io/metadata.name: mealie
    kubernetes.io/description: "Mealie recipe manager, authenticated by authentik, data in the shared CNPG cluster"
---
# Sure (personal-finance tracker, trialling as a Firefly III replacement). Fails §3.1 of the
# 2026-10-19 scale-out design on four counts — four pods, its own database, its own public hostname,
# its own Secret set — so it gets a namespace, and it stays in the shared `apps` stage per §3.2
# because its bulk is a HelmRelease, which fails on its own rather than freezing coder and authentik.
apiVersion: v1
kind: Namespace
metadata:
  name: sure
  labels:
    name: sure
  annotations:
    kubernetes.io/metadata.name: sure
    kubernetes.io/description: "Sure personal-finance tracker, authenticated by authentik, data in the shared CNPG cluster"

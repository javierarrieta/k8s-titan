apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespaces.yaml
  - stage-secrets.yaml
  - stage-infra.yaml
  # One numbered directory under apply/ per stage, one Flux Kustomization per stage - that is
  # the repo's layout convention and the split keeps it rather than nesting stages. The numbers
  # are build order and reading order; what actually orders reconciles is the dependsOn graph
  # inside these files: infra -> databases -> certificates -> {apps, tesla}.
  - stage-databases.yaml
  - stage-certificates.yaml
  - stage-apps.yaml
  - stage-tesla.yaml
  # The backup stage is 70-backup, not the 30-backup the spec proposed: apply/30-databases
  # already owns that number, and one numbered directory is one stage, so the spec's name would
  # have put two stages in the same slot. The number is reading order only -- dependsOn is what
  # orders reconciles -- but a duplicate number is exactly the kind of thing a later reader
  # spends an hour on.
  - stage-backup.yaml
  - flux-system

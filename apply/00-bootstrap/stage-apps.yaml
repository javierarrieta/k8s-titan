apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  dependsOn:
    - name: certificates
    - name: databases
  interval: 10m0s
  path: ./apply/50-apps
  # Back on, in its own commit, after the inventory proof. The hazard it was off for was real:
  # this is the SAME Kustomization object as before the split, so its status.inventory still
  # held all 43 entries while the path only built 14 — with prune on at that moment, the other
  # 29 were stale by inventory.Diff and Flux would have deleted the CNPG Cluster and
  # helm-uninstalled authentik and coder via their finalizers.
  #
  # Proof it is now safe, taken on main@5d3a1c6 after the split had reconciled:
  #   apps inventory 14 == git build 14, stale = 0
  #   databases inventory 2 == build 2, tesla inventory 27 == build 27, stale = 0
  #   14 + 2 + 27 = 43 total, 43 unique, 0 objects claimed by two stages
  # Prune deletes exactly inventory.Diff(old, new), so an empty diff means the first reconcile
  # with this on is a no-op. Note what prune does NOT do: it never touches objects it never
  # owned, so out-of-band creations are not at risk from this flag — only from a later commit
  # that stops building something it already owns.
  #
  # If this ever needs to go off again, do it in its own commit and say why. Flipping it as
  # part of a larger change is how a stage ends up garbage-collecting a database.
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system

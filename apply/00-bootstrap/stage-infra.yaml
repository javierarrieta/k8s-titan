apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra
  namespace: flux-system
spec:
  dependsOn:
    - name: secrets
  interval: 10m0s
  path: ./apply/20-infra
  # Back to true after #221/#222. The duplicate Namespace/traefik-system was removed from this stage
  # behind a temporary `prune: false`, because two stages owning one object leaves the prune right
  # with whichever stage applied last, and losing that coin flip cascades the ingress namespace.
  # Verified before restoring: `infra`'s inventory no longer listed _traefik-system__Namespace, and
  # the HelmRelease and its pod were untouched. Do not re-declare that Namespace here -- it is
  # declared once, in namespaces.yaml, and traefik.yaml's header says why.
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # Real, not nominal: HelmRelease reports Ready, so this makes `certificates`
  # wait for cert-manager to actually be installed rather than merely applied.
  # Without it the first Certificate sits in "issuer not found" on a fresh
  # cluster, which reads as breakage. Cost: if cert-manager never goes Ready,
  # certificates and apps stay blocked and fail loudly.
  timeout: 10m0s
  wait: true

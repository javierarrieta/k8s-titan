# www.techdelivery.es — the first certificate outside arrieta.eu on this cluster.
#
# WHY A NEW CERTIFICATE AT ALL: `*.titan.arrieta.eu` cannot sign a name in another domain, and
# DNS-01 via the OVH webhook (le-prod-titan) is already the issuance path here, so this costs one
# ACME order and nothing new in solvers. ASSUMPTION, UNVERIFIED FROM GIT: the OVH account behind
# the webhook's credentials holds DNS for techdelivery.es (records_techdelivery.tf in
# ../public-dns-tf says the zone lives on OVH). If the webhook's OVH application is scoped to
# arrieta.eu only, issuance will fail at the challenge and the fix is a credential scope change,
# not a manifest change.
#
# SANs: www AND the apex. The apex A was moved to titan in November 2026 and the apex router here
# is a pure 301 to www — but a valid certificate is still required on the apex TLS handshake, or
# the browser shows its wall BEFORE the redirect can run. Signing both names on one Certificate
# keeps one renewal cycle for one host pair. (The apex stays OUT of HSTS scope: the site's
# Strict-Transport-Security is set only on www responses, so mail-era services on the apex are
# never bound by it.)
#
# The allow-list is `site` alone, in BOTH annotations — the pair is what tls-reflection-check
# demands, and `site` is the only consumer (its Ingress is the sole reader of this Secret).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: techdelivery-es
  namespace: certificates
spec:
  secretName: techdelivery-es-tls
  issuerRef:
    kind: ClusterIssuer
    name: le-prod-titan
  commonName: www.techdelivery.es
  dnsNames:
    - www.techdelivery.es
    - techdelivery.es
  secretTemplate:
    annotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "site"
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
      reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "site"

# Grafana, the way TeslaMate ships it.
#
# The image is teslamate/grafana, not grafana/grafana: it carries the TeslaMate dashboards and
# provisions them on every boot. Its Dockerfile (read at v4.3.0) is what the env below is written
# against, and two things in it are load-bearing:
#
#   1. It sets DATABASE_SSL_MODE=disable and DATABASE_PORT=5432, and reads DATABASE_USER / _PASS /
#      _NAME / _HOST for its datasource — the same four keys TeslaMate already has, so it can share
#      teslamate-secrets rather than keeping a second copy of the password that would drift.
#   2. It sets GF_SECURITY_ADMIN_USER=admin and GF_SECURITY_ADMIN_PASSWORD=admin in image ENV, with
#      GF_AUTH_ANONYMOUS_ENABLED=false and GF_AUTH_BASIC_ENABLED=false. That is fine on localhost
#      behind TeslaMate and unacceptable on a public hostname: admin/admin would be the only way in.
#      Both are overridden from tesla-grafana-admin, which is why that Secret exists.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tesla-grafana
  namespace: apps
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tesla-grafana
  namespace: apps
spec:
  replicas: 1
  # RWO PVC: a RollingUpdate would schedule pod 2 while pod 1 still holds the volume, and the new
  # pod would sit Pending on a volume conflict forever. Recreate costs a few seconds of dashboards.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tesla-grafana
  template:
    metadata:
      labels:
        app: tesla-grafana
    spec:
      securityContext:
        runAsNonRoot: true
        # The image's own USER is `grafana`, and /etc/passwd in the image says grafana:x:472:0 —
        # uid 472, gid 0. Grafana's official images deliberately keep gid 0 so a mounted PVC can be
        # group-writable; putting the pod in group 0 is the supported way to run it unprivileged.
        runAsUser: 472
        runAsGroup: 0
        fsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: grafana
        image: teslamate/grafana:4.3.0@sha256:7f5a119ad06c212c4122e12c957a6848b5718d9618826b5ce70a1ec12d84fed5
        ports:
        - containerPort: 3000
          name: http
        envFrom:
        # DATABASE_* for the datasource, and GF_SECURITY_ADMIN_* to replace the image's admin/admin.
        - secretRef:
            name: teslamate-secrets
        - secretRef:
            name: tesla-grafana-admin
        env:
        # GF_SERVER_ROOT_URL is what Grafana puts in the links it generates itself, so it has to be the
        # hostname users actually reach — not the Service name, and not the old cluster's host.
        #
        # Renamed 2026-10-19 from grafana.titan.arrieta.eu to tesla-boards.titan.arrieta.eu, because a
        # second Grafana is coming and `grafana.` would otherwise be ambiguous. Three places move
        # together: this value, the Ingress host, and the tls hosts list below.
        #
        # THE PART THAT IS NOT IN THIS REPO: tesla-boards needs an A record in public-dns-tf in the SAME
        # change. The DNS-01 challenge node shadows the *.titan wildcard and silently takes a host out of
        # DNS while the Certificate still reports Ready — runbook §6. A wildcard certificate that cannot
        # be renewed because the challenge host vanished is a worse failure than a rename that 404s.
        - name: GF_SERVER_ROOT_URL
          value: https://tesla-boards.titan.arrieta.eu/
        - name: GF_SERVER_SERVE_FROM_SUB_PATH
          value: "false"
        - name: TZ
          value: UTC
        # Grafana's own health endpoint; it answers as soon as the web server is up, which is what
        # readiness means here. The sqlite DB opening happens lazily and would only slow startup.
        livenessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: data
          mountPath: /var/lib/grafana
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: tesla-grafana
---
apiVersion: v1
kind: Service
metadata:
  name: tesla-grafana
  namespace: apps
spec:
  selector:
    app: tesla-grafana
  ports:
  - name: http
    port: 80
    targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tesla-grafana
  namespace: apps
  # Forward-auth to the embedded authentik outpost — the same middleware the teslamate Ingress uses.
  # This was missing when the host was grafana.titan.arrieta.eu: the outpost spec lists this host as
  # gated and the manifest never said so, leaving Grafana reachable by anyone who learned the hostname
  # with only Grafana's own login in front.
  #
  # Why this is safe to gate, and what would make it not:
  #   - The proxy provider is forward_domain over titan.arrieta.eu, so no provider change is needed for
  #     a new hostname and the existing session cookie already covers it.
  #   - TeslaMate does NOT embed Grafana. Its Dashboards menu is a dropdown of ordinary links opened
  #     with target="_blank" (teslamate-4.3.0 elixir/teslamate_web/templates/layout/root.html.heex:99),
  #     and `grep -i iframe` over lib/ and assets/ returns nothing. An earlier version of this comment
  #     claimed the dashboards were framed and reasoned about same-site cookies on that basis; that was
  #     inherited from a stale note in apply/50-apps/auth/tesla-outpost-blueprint.yaml instead of
  #     checked against the app, and it is deleted here rather than left as folklore. There is no frame,
  #     so authentik's `X-Frame-Options: DENY` and any SameSite question are irrelevant to this host.
  #   - The car's telemetry path is a different router entirely (IngressRouteTCP on HostSNI) and
  #     /.well-known is a separate Ingress with no middleware, so neither can be locked out by this.
  #
  # Gating this host costs one extra login per browser, not a broken embed: forward-auth decides whether
  # the host may be reached at all, and Grafana still requires its own session afterwards, because a
  # proxy provider never tells the upstream who you are. Delegating Grafana's own login to authentik
  # would mean registering it as an OIDC application — deliberately not done here, since nothing today
  # needs per-user Grafana roles and the rollout has its own lock-out risk (keep GF_AUTH_BASIC_ENABLED
  # true through it if that changes).
  #
  # Rollback is one line: delete this annotation and re-apply. Grafana's own login still gates it, so a
  # revert returns to a working-but-public state rather than to something broken.
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: apps-teslamate-auth@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
  - host: tesla-boards.titan.arrieta.eu
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: tesla-grafana
            port:
              number: 80
  tls:
  - hosts:
    - tesla-boards.titan.arrieta.eu
    secretName: titan-tls

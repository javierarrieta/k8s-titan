# Grafana, the way TeslaMate ships it.
#
# The image is teslamate/grafana, not grafana/grafana: it carries the TeslaMate dashboards and
# provisions them on every boot. Its Dockerfile (re-read at the pinned 4.4.0, whose base image is
# grafana/grafana:13.2.4) is what the env below is written against, and two things in it are
# load-bearing:
#
#   1. It sets DATABASE_SSL_MODE=disable and DATABASE_PORT=5432, and reads DATABASE_USER / _PASS /
#      _NAME / _HOST for its datasource — the same four keys TeslaMate already has, so it can share
#      teslamate-secrets rather than keeping a second copy of the password that would drift.
#   2. It sets GF_SECURITY_ADMIN_USER=admin and GF_SECURITY_ADMIN_PASSWORD=admin in image ENV, with
#      GF_AUTH_ANONYMOUS_ENABLED=false, GF_USERS_ALLOW_SIGN_UP=false and GF_AUTH_BASIC_ENABLED=false.
#      That is fine on localhost behind TeslaMate and unacceptable on a public hostname: admin/admin
#      would be the only way in. The admin pair is overridden from tesla-grafana-admin, which is why
#      that Secret exists, and the three auth flags are re-pinned below rather than inherited.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tesla-grafana
  namespace: apps
  # Deliberately NOT annotated, so apply/70-backup/ leaves this volume alone. Same reasoning as
  # observability/grafana and checked the same way: the TeslaMate dashboards ship inside the
  # teslamate/grafana image, the datasource is built from DATABASE_* in teslamate-secrets at
  # boot, and the admin credentials are in tesla-grafana-admin.yaml. Nothing here is unique to
  # the volume except what someone made by hand in the UI.
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tesla-grafana
  namespace: apps
spec:
  replicas: 1
  # RWO PVC: a RollingUpdate would schedule pod 2 while pod 1 still holds the volume, and the new
  # pod would sit Pending on a volume conflict forever. Recreate costs a few seconds of dashboards.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tesla-grafana
  template:
    metadata:
      labels:
        app: tesla-grafana
    spec:
      securityContext:
        runAsNonRoot: true
        # The image's own USER is `grafana`, and /etc/passwd in the image says grafana:x:472:0 —
        # uid 472, gid 0. Grafana's official images deliberately keep gid 0 so a mounted PVC can be
        # group-writable; putting the pod in group 0 is the supported way to run it unprivileged.
        runAsUser: 472
        runAsGroup: 0
        fsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: grafana
        image: teslamate/grafana:4.4.0@sha256:2dd1fae85cd891e1d851350d13b547abf000efd602c8d0e5734eda6d43e22e01
        ports:
        - containerPort: 3000
          name: http
        envFrom:
        # DATABASE_* for the datasource, and GF_SECURITY_ADMIN_* to replace the image's admin/admin.
        - secretRef:
            name: teslamate-secrets
        - secretRef:
            name: tesla-grafana-admin
        # Grafana's copy of the OIDC client. The keys are already the config key names Grafana reads,
        # so envFrom needs no aliasing and there is no typo'd mapping between Secret and Deployment.
        - secretRef:
            name: tesla-grafana-oidc
        env:
        # GF_SERVER_ROOT_URL is what Grafana puts in the links it generates itself, so it has to be the
        # hostname users actually reach — not the Service name, and not the old cluster's host.
        #
        # Renamed 2026-10-19 from grafana.titan.arrieta.eu to tesla-boards.titan.arrieta.eu, because a
        # second Grafana is coming and `grafana.` would otherwise be ambiguous. Three places move
        # together: this value, the Ingress host, and the tls hosts list below.
        #
        # THE PART THAT IS NOT IN THIS REPO: tesla-boards needs an A record in public-dns-tf in the SAME
        # change. The DNS-01 challenge node shadows the *.titan wildcard and silently takes a host out of
        # DNS while the Certificate still reports Ready — runbook §6. A wildcard certificate that cannot
        # be renewed because the challenge host vanished is a worse failure than a rename that 404s.
        - name: GF_SERVER_ROOT_URL
          value: https://tesla-boards.titan.arrieta.eu/
        - name: GF_SERVER_SERVE_FROM_SUB_PATH
          value: "false"
        - name: TZ
          value: UTC
        # Pinned explicitly because nothing stands in front of this host any more. The image already
        # sets both false (teslamate/grafana 4.4.0, grafana/Dockerfile), and the sibling Grafana pins
        # them for the same reason (apply/50-apps/grafana/grafana.yaml). Inherited-from-the-image is
        # the wrong place for either to live on a public host: a base-image bump that flipped one
        # would open anonymous read of the car's dashboards, or a self-service signup form, with no
        # proxy in front to notice and no gate in this repo able to see it.
        - name: GF_AUTH_ANONYMOUS_ENABLED
          value: "false"
        - name: GF_USERS_ALLOW_SIGN_UP
          value: "false"
        # --- single sign-on: Grafana delegates identity to authentik over OIDC ------------------
        # This is now the ONLY thing deciding who gets in, and it does both jobs at once: it supplies
        # the identity and the role, and since the forward-auth annotation below was removed 2026-11-05
        # it also decides admission. Before that the two answered different questions — the proxy
        # provider decided whether the host could be reached at all and never told Grafana who you were,
        # which is why every visit used to ask for a second password, a shared admin account out of
        # tesla-grafana-admin. See the Ingress header for why the edge gate went and what that costs.
        # authentik's half of the client pair is
        # apply/10-secrets/authentik-grafana-blueprint.yaml, and `make grafana-oidc-check` proves the
        # two copies, the mount, and the redirect host all agree.
        #
        # The endpoints come from authentik's live discovery document, not from documentation:
        #   GET /application/o/coder/.well-known/openid-configuration
        # authorize, token and userinfo are GLOBAL paths with no slug in them; only issuer and jwks
        # carry the slug. Composing `.../o/tesla-boards/authorize/` looks obvious and returns 404 —
        # measured against this instance, not assumed.
        - name: GF_AUTH_GENERIC_OAUTH_ENABLED
          value: "true"
        - name: GF_AUTH_GENERIC_OAUTH_NAME
          value: authentik
        - name: GF_AUTH_GENERIC_OAUTH_AUTH_URL
          value: https://auth.titan.arrieta.eu/application/o/authorize/
        - name: GF_AUTH_GENERIC_OAUTH_TOKEN_URL
          value: https://auth.titan.arrieta.eu/application/o/token/
        - name: GF_AUTH_GENERIC_OAUTH_API_URL
          value: https://auth.titan.arrieta.eu/application/o/userinfo/
        # Signature validation. Without it Grafana trusts an unverified id_token, which is a real
        # weakening rather than a formality now that nothing stands in front of this host: the token is
        # the whole proof of who is looking. It is not free — with validate_id_token true and a wrong or
        # missing jwk_set_url, authentication fails outright.
        - name: GF_AUTH_GENERIC_OAUTH_VALIDATE_ID_TOKEN
          value: "true"
        - name: GF_AUTH_GENERIC_OAUTH_JWK_SET_URL
          value: https://auth.titan.arrieta.eu/application/o/tesla-boards/jwks/
        # profile is load-bearing, not decoration: the `groups` claim exists only because authentik's
        # default profile scope mapping emits it (blueprints/system/providers-oauth2.yaml:44 at the
        # pinned 2026.8.5). Drop
        # it and the role expression below evaluates against a missing claim and everyone silently
        # lands as Viewer — a permissions bug that presents as working.
        - name: GF_AUTH_GENERIC_OAUTH_SCOPES
          value: openid email profile offline_access
        - name: GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH
          value: email
        - name: GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH
          value: preferred_username
        - name: GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH
          value: name
        # titan-tesla-grafana-admins -> Grafana Org Admin, everyone else Viewer.
        # SWITCHED OFF `authentik Admins` on 2026-10-29, and the order was the point: the group was
        # seeded from `authentik Admins` FIRST (scripts/seed-authentik-group.sh, break-glass excluded)
        # and only then was this line changed. `&& 'Admin' || 'Viewer'` makes a missing or empty group
        # a SILENT Viewer downgrade - login still works, panels still render, nobody with admin to
        # notice. Same reasoning and same order as apply/50-apps/grafana/grafana.yaml.
        # GrafanaAdmin (server admin) is deliberately not granted; if a setting ever needs it, that is
        # allow_assign_grafana_admin, and it should be its own decision.
        #
        # WHO REACHES THIS AT ALL is no longer decided here. The application is bound to `titan-family`
        # or `titan-tesla-grafana-admins` in authentik/blueprints-grafana.yaml, so the refusal happens
        # at the IdP before a token exists; this expression only decides the role of someone who got
        # through. It reads the claim baked into the token AT LOGIN, so an already-signed-in admin
        # keeps their old groups until they re-authenticate, and group parentage does not count -
        # authentik's `groups` claim is the plain M2M.
        - name: GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH
          value: contains(groups[*], 'titan-tesla-grafana-admins') && 'Admin' || 'Viewer'
        - name: GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP
          value: "true"
        # KEPT true deliberately when the forwardAuth Middleware was removed 2026-11-05, and for a
        # different reason than the one written here before. This is now what turns an expired Grafana
        # session into a working page: a top-level navigation redirects silently through authentik and
        # comes back authenticated, which is what a browser tab left open for an hour needs. It is not
        # the thing deciding WHO gets in — the two group bindings on the `tesla-boards` application
        # are, and they answer before Grafana ever sees a token. With this false, an open tab stops
        # refreshing quietly and someone has to click a sign-in button to revive it.
        - name: GF_AUTH_GENERIC_OAUTH_AUTO_LOGIN
          value: "true"
        - name: GF_AUTH_GENERIC_OAUTH_USE_REFRESH_TOKEN
          value: "true"
        # THE ESCAPE HATCH — keep this true. If the OIDC config is ever wrong (rotated secret, wrong
        # JWKS, a scope dropped) and basic auth is off, the only way back into Grafana is editing the
        # admin Secret and restarting the Pod. The local admin from tesla-grafana-admin is also the
        # only account that can fix Grafana when the identity provider is the thing that is broken.
        - name: GF_AUTH_BASIC_ENABLED
          value: "true"
        # Grafana's own health endpoint; it answers as soon as the web server is up, which is what
        # readiness means here. The sqlite DB opening happens lazily and would only slow startup.
        livenessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: data
          mountPath: /var/lib/grafana
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: tesla-grafana
---
apiVersion: v1
kind: Service
metadata:
  name: tesla-grafana
  namespace: apps
spec:
  selector:
    app: tesla-grafana
  ports:
  - name: http
    port: 80
    targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tesla-grafana
  namespace: apps
  # NO PROXY-SIDE GATE HERE, AND THAT IS DELIBERATE — do not "restore" it.
  #
  # This Ingress carried `traefik.ingress.kubernetes.io/router.middlewares:
  # apps-teslamate-auth@kubernetescrd` until 2026-11-05, when it was removed for the same reason, and
  # in the same shape, as grafana.titan.arrieta.eu in #242. authentik refreshes its outpost cookie only
  # on a TOP-LEVEL NAVIGATION. A dashboard does not navigate — it polls /api/ds/query by XHR every 30s,
  # and an XHR cannot complete a cross-origin redirect to mint a cookie. Once the cookie aged out,
  # Traefik answered every poll with a 302 to auth.titan.arrieta.eu, the panel got HTML instead of
  # JSON, and the board read "No data" while the page looked perfectly healthy. This host is the same
  # Grafana on the same timer; the measured gaps (588s, 364s, 987s) and the two readings that turned
  # out to be logging artifacts are recorded in docs/grafana-runbook.md §10. Tuning the outpost cookie
  # lifetime was rejected there and still is: an XHR can never refresh that cookie however long it
  # lives, so a longer lifetime only moves the timer.
  #
  # WHAT GATES THE HOST NOW: GF_AUTH_GENERIC_OAUTH_* on the Deployment above, plus the two group
  # bindings on the `tesla-boards` authentik application (titan-family | titan-tesla-grafana-admins,
  # policy_engine_mode: any), which refuse anyone outside them at the IdP before a token exists. That
  # is the posture coder, open-webui, mealie, opencloud and grafana.titan already run. Those bindings
  # are the whole gate, so `make grafana-oidc-check` fails if they are absent, changed, or not
  # `any`-mode, and `make ingress-auth` fails both if this omission is silently reverted and if the
  # allow-list entry is left behind after a revert.
  #
  # WHAT THIS COSTS. The set admitted to a DASHBOARD is unchanged: the outpost has exactly one provider
  # (forward_domain over titan.arrieta.eu), it resolved this host to the `tesla` application, and that
  # application's three bindings are a superset of these two, so the intersection was already these
  # two. That is NOT the same as "nothing widened". The outpost sat in front of EVERY path, including
  # the two Grafana serves without a session:
  #
  #   - `/login` is now reachable from the internet, and GF_AUTH_BASIC_ENABLED is true above, so the
  #     local `admin` account out of tesla-grafana-admin is now a password an anonymous stranger can
  #     try. AUTO_LOGIN hides the form behind a redirect, but `?disableAutoLogin=true` puts it back —
  #     measured on the already-ungated grafana.titan, where `/login?disableAutoLogin=true` answers
  #     200. The lever is GF_AUTH_DISABLE_LOGIN_FORM=true, which removes the form and leaves the
  #     escape hatch usable over the API. Not set here: it changes live behaviour on the only way in
  #     when authentik is the thing that is broken, and it is the same decision as its twin on
  #     grafana.titan, which has run with the form up since #242.
  #   - `/api/health` needs no session in Grafana and now answers publicly with the exact build. On
  #     grafana.titan it returns {"database":"ok","version":"12.4.14","commit":"500a5450…"} — which
  #     tells anyone scanning the apex precisely which Grafana to aim at.
  #
  # What genuinely changed is that a mistake in these two bindings now has nothing upstream of it. They
  # live in authentik/blueprints-grafana.yaml, rendered into the sops Secret
  # apply/10-secrets/authentik-grafana-blueprint.yaml — not in this manifest.
  #
  # The websecure pin became load-bearing when the middleware went. A Traefik middleware attaches to
  # every router its Ingress produces and an unpinned Ingress produces one per entrypoint, so the old
  # forwardAuth covered cleartext :80 as a side effect. Traefik here runs no HTTP->HTTPS redirect (the
  # ports.web.http.redirections.entryPoint note in apply/20-infra/traefik/traefik.yaml) and port 80 is
  # published, so without this pin the car's dashboards would be served in the clear. Same posture as
  # grafana.titan, llm and investing-agent. `make ingress-auth` now fails if this line is dropped —
  # the allow-list row that lets this host have no proxy-side gate is only a true statement with it,
  # and a gate whose justification is prose is a gate that gets deleted in a later refactor.
  #
  # apps-teslamate-auth itself is NOT deleted: tesla.titan.arrieta.eu and
  # investing-agent.titan.arrieta.eu still reference it, and each is a separate decision (issue #243).
  # The Middleware becomes deletable only when the last reference goes.
  #
  # Rollback is one annotation line, but it re-breaks the boards on the cookie timer instead of fixing
  # anything — read docs/grafana-runbook.md §10 before reaching for it.
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  rules:
  - host: tesla-boards.titan.arrieta.eu
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: tesla-grafana
            port:
              number: 80
  tls:
  - hosts:
    - tesla-boards.titan.arrieta.eu
    secretName: titan-tls

# Grafana, the way TeslaMate ships it.
#
# The image is teslamate/grafana, not grafana/grafana: it carries the TeslaMate dashboards and
# provisions them on every boot. Its Dockerfile (read at v4.3.0) is what the env below is written
# against, and two things in it are load-bearing:
#
#   1. It sets DATABASE_SSL_MODE=disable and DATABASE_PORT=5432, and reads DATABASE_USER / _PASS /
#      _NAME / _HOST for its datasource — the same four keys TeslaMate already has, so it can share
#      teslamate-secrets rather than keeping a second copy of the password that would drift.
#   2. It sets GF_SECURITY_ADMIN_USER=admin and GF_SECURITY_ADMIN_PASSWORD=admin in image ENV, with
#      GF_AUTH_ANONYMOUS_ENABLED=false and GF_AUTH_BASIC_ENABLED=false. That is fine on localhost
#      behind TeslaMate and unacceptable on a public hostname: admin/admin would be the only way in.
#      Both are overridden from tesla-grafana-admin, which is why that Secret exists.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tesla-grafana
  namespace: apps
  # Deliberately NOT annotated, so apply/70-backup/ leaves this volume alone. Same reasoning as
  # observability/grafana and checked the same way: the TeslaMate dashboards ship inside the
  # teslamate/grafana image, the datasource is built from DATABASE_* in teslamate-secrets at
  # boot, and the admin credentials are in tesla-grafana-admin.yaml. Nothing here is unique to
  # the volume except what someone made by hand in the UI.
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tesla-grafana
  namespace: apps
spec:
  replicas: 1
  # RWO PVC: a RollingUpdate would schedule pod 2 while pod 1 still holds the volume, and the new
  # pod would sit Pending on a volume conflict forever. Recreate costs a few seconds of dashboards.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tesla-grafana
  template:
    metadata:
      labels:
        app: tesla-grafana
    spec:
      securityContext:
        runAsNonRoot: true
        # The image's own USER is `grafana`, and /etc/passwd in the image says grafana:x:472:0 —
        # uid 472, gid 0. Grafana's official images deliberately keep gid 0 so a mounted PVC can be
        # group-writable; putting the pod in group 0 is the supported way to run it unprivileged.
        runAsUser: 472
        runAsGroup: 0
        fsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: grafana
        image: teslamate/grafana:4.4.0@sha256:2dd1fae85cd891e1d851350d13b547abf000efd602c8d0e5734eda6d43e22e01
        ports:
        - containerPort: 3000
          name: http
        envFrom:
        # DATABASE_* for the datasource, and GF_SECURITY_ADMIN_* to replace the image's admin/admin.
        - secretRef:
            name: teslamate-secrets
        - secretRef:
            name: tesla-grafana-admin
        # Grafana's copy of the OIDC client. The keys are already the config key names Grafana reads,
        # so envFrom needs no aliasing and there is no typo'd mapping between Secret and Deployment.
        - secretRef:
            name: tesla-grafana-oidc
        env:
        # GF_SERVER_ROOT_URL is what Grafana puts in the links it generates itself, so it has to be the
        # hostname users actually reach — not the Service name, and not the old cluster's host.
        #
        # Renamed 2026-10-19 from grafana.titan.arrieta.eu to tesla-boards.titan.arrieta.eu, because a
        # second Grafana is coming and `grafana.` would otherwise be ambiguous. Three places move
        # together: this value, the Ingress host, and the tls hosts list below.
        #
        # THE PART THAT IS NOT IN THIS REPO: tesla-boards needs an A record in public-dns-tf in the SAME
        # change. The DNS-01 challenge node shadows the *.titan wildcard and silently takes a host out of
        # DNS while the Certificate still reports Ready — runbook §6. A wildcard certificate that cannot
        # be renewed because the challenge host vanished is a worse failure than a rename that 404s.
        - name: GF_SERVER_ROOT_URL
          value: https://tesla-boards.titan.arrieta.eu/
        - name: GF_SERVER_SERVE_FROM_SUB_PATH
          value: "false"
        - name: TZ
          value: UTC
        # --- single sign-on: Grafana delegates identity to authentik over OIDC ------------------
        # Why this sits beside the forward-auth annotation on the Ingress below instead of replacing
        # it: they answer different questions. The proxy provider decides whether the host may be
        # reached at all and never tells Grafana who you are, so before this change every visit asked
        # for a second password — a shared admin account out of tesla-grafana-admin. OIDC supplies
        # the identity and the role; the edge gate stays so a Grafana-side misconfiguration cannot
        # make the host public again. authentik's half of the client pair is
        # apply/10-secrets/authentik-grafana-blueprint.yaml, and `make grafana-oidc-check` proves the
        # two copies, the mount, and the redirect host all agree.
        #
        # The endpoints come from authentik's live discovery document, not from documentation:
        #   GET /application/o/coder/.well-known/openid-configuration
        # authorize, token and userinfo are GLOBAL paths with no slug in them; only issuer and jwks
        # carry the slug. Composing `.../o/tesla-boards/authorize/` looks obvious and returns 404 —
        # measured against this instance, not assumed.
        - name: GF_AUTH_GENERIC_OAUTH_ENABLED
          value: "true"
        - name: GF_AUTH_GENERIC_OAUTH_NAME
          value: authentik
        - name: GF_AUTH_GENERIC_OAUTH_AUTH_URL
          value: https://auth.titan.arrieta.eu/application/o/authorize/
        - name: GF_AUTH_GENERIC_OAUTH_TOKEN_URL
          value: https://auth.titan.arrieta.eu/application/o/token/
        - name: GF_AUTH_GENERIC_OAUTH_API_URL
          value: https://auth.titan.arrieta.eu/application/o/userinfo/
        # Signature validation. Without it Grafana trusts an unverified id_token, which is a real
        # weakening rather than a formality even behind the edge gate. It is not free: with
        # validate_id_token true and a wrong or missing jwk_set_url, authentication fails outright.
        - name: GF_AUTH_GENERIC_OAUTH_VALIDATE_ID_TOKEN
          value: "true"
        - name: GF_AUTH_GENERIC_OAUTH_JWK_SET_URL
          value: https://auth.titan.arrieta.eu/application/o/tesla-boards/jwks/
        # profile is load-bearing, not decoration: the `groups` claim exists only because authentik's
        # default profile scope mapping emits it (blueprints/system/providers-oauth2.yaml:45). Drop
        # it and the role expression below evaluates against a missing claim and everyone silently
        # lands as Viewer — a permissions bug that presents as working.
        - name: GF_AUTH_GENERIC_OAUTH_SCOPES
          value: openid email profile offline_access
        - name: GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH
          value: email
        - name: GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH
          value: preferred_username
        - name: GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH
          value: name
        # authentik Admins -> Grafana Org Admin, everyone else Viewer. The group is authentik's own
        # default (blueprints/system/bootstrap.yaml:11, `group_name: authentik Admins`), so
        # membership stays managed where it already is instead of becoming a fourth copy of a list.
        # GrafanaAdmin (server admin) is deliberately not granted; if a setting ever needs it, that is
        # allow_assign_grafana_admin, and it should be its own decision.
        #
        # Anyone authentik lets through the edge gate gets a Grafana account here, as Viewer: the
        # proxy provider has no access_group, so "can log into authentik" is the current bar. That is
        # a deliberate standing choice, not an oversight of this change.
        - name: GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH
          value: contains(groups[*], 'authentik Admins') && 'Admin' || 'Viewer'
        - name: GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP
          value: "true"
        # Skips Grafana's own login page for an unauthenticated browser. Safe specifically because the
        # edge gate means authentik already holds a session by the time Grafana is reached, so this is
        # a silent redirect rather than a second prompt. If the forward-auth annotation is ever
        # removed, revisit this: it would then be the thing deciding who gets in.
        - name: GF_AUTH_GENERIC_OAUTH_AUTO_LOGIN
          value: "true"
        - name: GF_AUTH_GENERIC_OAUTH_USE_REFRESH_TOKEN
          value: "true"
        # THE ESCAPE HATCH — keep this true. If the OIDC config is ever wrong (rotated secret, wrong
        # JWKS, a scope dropped) and basic auth is off, the only way back into Grafana is editing the
        # admin Secret and restarting the Pod. The local admin from tesla-grafana-admin is also the
        # only account that can fix Grafana when the identity provider is the thing that is broken.
        - name: GF_AUTH_BASIC_ENABLED
          value: "true"
        # Grafana's own health endpoint; it answers as soon as the web server is up, which is what
        # readiness means here. The sqlite DB opening happens lazily and would only slow startup.
        livenessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: data
          mountPath: /var/lib/grafana
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: tesla-grafana
---
apiVersion: v1
kind: Service
metadata:
  name: tesla-grafana
  namespace: apps
spec:
  selector:
    app: tesla-grafana
  ports:
  - name: http
    port: 80
    targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tesla-grafana
  namespace: apps
  # Forward-auth to the embedded authentik outpost — the same middleware the teslamate Ingress uses.
  # This was missing when the host was grafana.titan.arrieta.eu: the outpost spec lists this host as
  # gated and the manifest never said so, leaving Grafana reachable by anyone who learned the hostname
  # with only Grafana's own login in front.
  #
  # Why this is safe to gate, and what would make it not:
  #   - The proxy provider is forward_domain over titan.arrieta.eu, so no provider change is needed for
  #     a new hostname and the existing session cookie already covers it.
  #   - TeslaMate does NOT embed Grafana. Its Dashboards menu is a dropdown of ordinary links opened
  #     with target="_blank" (teslamate-4.3.0 elixir/teslamate_web/templates/layout/root.html.heex:99),
  #     and `grep -i iframe` over lib/ and assets/ returns nothing. An earlier version of this comment
  #     claimed the dashboards were framed and reasoned about same-site cookies on that basis; that was
  #     inherited from a stale note in apply/50-apps/auth/tesla-outpost-blueprint.yaml instead of
  #     checked against the app, and it is deleted here rather than left as folklore. There is no frame,
  #     so authentik's `X-Frame-Options: DENY` and any SameSite question are irrelevant to this host.
  #   - The car's telemetry path is a different router entirely (IngressRouteTCP on HostSNI) and
  #     /.well-known is a separate Ingress with no middleware, so neither can be locked out by this.
  #
  # Gating this host and logging into Grafana are still two separate things, and that is deliberate:
  # forward-auth decides whether the host may be reached at all, and never tells the upstream who you
  # are. Grafana gets the identity from OIDC (see GF_AUTH_GENERIC_OAUTH_* on the Deployment above),
  # not from this annotation, so the edge gate survives Grafana config drift instead of replacing it.
  # If this annotation is ever removed, revisit GF_AUTH_GENERIC_OAUTH_AUTO_LOGIN — that combination is
  # what decides who may in.
  #
  # Rollback is one line: delete this annotation and re-apply. Grafana's own login still gates it, so a
  # revert returns to a working-but-public state rather than to something broken.
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: apps-teslamate-auth@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
  - host: tesla-boards.titan.arrieta.eu
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: tesla-grafana
            port:
              number: 80
  tls:
  - hosts:
    - tesla-boards.titan.arrieta.eu
    secretName: titan-tls

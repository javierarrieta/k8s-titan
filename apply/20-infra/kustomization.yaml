apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - cert-manager/cert-manager.yaml
  - cert-manager/ovh-webhook.yaml
  - k8s-reader/namespace.yaml
  - k8s-reader/serviceaccount.yaml
  - k8s-reader/clusterrole.yaml
  - k8s-reader/clusterrolebinding.yaml
  - k8s-reader/serviceaccount-token.yaml
  # Identity before token: the ServiceAccount token controller can only fill the
  # Secret once the ServiceAccount it names exists, and file order here is the
  # order Flux applies in.
  - monitoring/scrape-identity.yaml
  - monitoring/scrape-token.yaml
  # After the identity it is scraped by: KSM is the thing the proxy grant exists for.
  - monitoring/kube-state-metrics.yaml
  # The other half of titan's observability leaving the cluster: metrics are PULLED by
  # casa over the mesh, logs are PUSHED by this to casa's Loki. Different direction,
  # same single-node constraint - nothing here runs a Prometheus or a Loki of its own.
  - monitoring/promtail.yaml
  - reflector/reflector.yaml
  - reloader/reloader.yaml
  - cnpg/operator.yaml
  # Titan's ingress path, Flux-owned. Phase A installs a second Traefik that receives no
  # traffic; the k3s-bundled one is still the live path. See the file's header for why this
  # lives in 20-infra and why a not-Ready release here blocks every later stage.
  - traefik/traefik.yaml
  - storage-retain.yaml

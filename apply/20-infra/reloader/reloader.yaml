# Reloader restarts workloads when the Secrets they consume arrive too late to matter.
#
# A container's environment is fixed at creation. A Secret consumed through `secretKeyRef` or `envFrom`
# is read once, at start, and never re-read — so rotating it changes the Secret and nothing else. When
# coder's OIDC client secret was rotated on 2026-10-07 the merge applied cleanly and changed nothing
# observable: coder went on authenticating with a credential that no longer existed, every condition
# green. Volume-mounted Secrets behave the opposite way — kubelet rewrites the file in place — which is
# exactly why authentik's blueprint converged on its own while coder never moved.
#
# Design, and the Flux-specific reasoning that decides most of the values below:
# docs/superpowers/specs/2026-10-07-titan-reloader-design.md
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: stakater
  namespace: apps
spec:
  interval: 1h
  url: https://stakater.github.io/stakater-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
  namespace: apps
spec:
  releaseName: reloader
  chart:
    spec:
      chart: reloader
      # Pinned, as everything else here. 3.0.0-beta.2 exists and was not used: betas are not what this
      # cluster pins, and there is nothing in 3.x this needs.
      version: "2.2.18"
      sourceRef:
        kind: HelmRepository
        name: stakater
  interval: 30m
  driftDetection:
    mode: enabled
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    reloader:
      # LOAD-BEARING — do not "tidy" this back to the default.
      #
      # The default strategy (`env-vars`) makes Reloader inject a STAKATER_* environment variable into
      # the pod template to force the restart. Every HelmRelease here runs `driftDetection: mode:
      # enabled`, so Flux sees a field it owns disagreeing with Git, reverts it, and the rollout is
      # cancelled before a new pod ever reads the new Secret — replacing one silent failure with another.
      #
      # `annotations` instead writes `reloader.stakater.com/last-reloaded-from` through Reloader's own
      # server-side-apply field manager. Flux never declared that field, so under SSA it does not own it
      # and does not remove it. This rests on kustomize-controller applying with server-side apply, which
      # it does — the same fact `make dry-run` had to be rebuilt around after client-side apply produced
      # false positives.
      #
      # Note the chart's `restart` rollout-strategy is *not* an alternative: it is Argo Rollouts only and
      # is ignored for plain Deployments.
      reloadStrategy: annotations
      # Scoped, not the chart default of cluster-wide. Reflector's own file already records that a
      # cluster-wide `secrets: *` grant is held to one purpose by review alone — and Reloader is
      # purpose-built to read every Secret in whatever it watches. The chart refuses to render
      # `namespaces` while `watchGlobally` is true (templates/role.yaml:1-2), so these two settings are
      # one decision rather than two: no ClusterRole is created at all.
      watchGlobally: false
      # Exactly the namespaces holding annotated workloads, and nothing more. The release namespace
      # (`apps`) is added by the chart itself.
      #
      # `auth` was added when authentik's server and worker were annotated (spec R5, fulfilled 2026-10-11):
      # authentik takes its environment through `envFrom`, so it carried the same defect coder did, and
      # the blueprint Secrets needed it for a subtler reason - they are volume-mounted and kubelet rewrites
      # them in place, but authentik's worker only *discovers* mounted blueprints hourly plus at startup.
      # A blueprint edit therefore sat unread for up to an hour after a merge, which is what made PR #42's
      # fix look like it had not landed.
      namespaces:
        - coder
        - auth
        # Added 2026-10-18 for the promtail DaemonSet, which carries
        # `reloader.stakater.com/auto: "true"` and lives here. Until this line that annotation was
        # inert: Reloader does not look at a namespace outside this list, so editing promtail-config
        # rolled nothing and the pod kept running whatever it read at start. That made a DaemonSet
        # appear to ignore its own ConfigMap, which is most of what made one afternoon expensive;
        # docs/titan-logs-loki.md records how to tell "the edit did not land" from "the edit landed
        # and the pod never restarted".
        - monitoring
        # open-webui carries `reloader.stakater.com/auto: "true"` and reads its whole config
        # through envFrom, so a rotated WEBUI_SECRET_KEY or OIDC client would otherwise sit
        # unread in a running pod — the same inert-annotation defect the monitoring entry above
        # records for promtail. `watchGlobally: false` means this list is the whole scope.
        - open-webui
        # Grafana. Without this line `reloader.stakater.com/auto: "true"` on the Deployment is inert
        # and a dashboard or OIDC Secret edit never restarts the pod — Grafana keeps serving whatever
        # it read at start and reports healthy the whole time. This is the third time this list has
        # bitten (promtail, then open-webui, both recorded above), which is why the comment is here
        # rather than in a commit message nobody will read.
        - observability
        # Mealie. Fourth time this list has bitten. Mealie reads OIDC_CLIENT_SECRET and
        # POSTGRES_PASSWORD through envFrom, so without this line a rotated client secret or database
        # password sits unread in a running pod: authentik answers invalid_client and the pod reports
        # Ready the whole time. `watchGlobally: false` means this list is the whole scope.
        - mealie
        # llm.titan.arrieta.eu. Fifth time this list has bitten, and the fifth time it would have
        # been silent: the bearer-auth nginx in `llm` renders its nginx config from $BEARER_TOKEN at
        # container start and reads the token from a Secret env var, so without this line a rotated
        # token sits unread in a running pod — Traefik keeps asking a forwardAuth server that is
        # still matching the OLD token, and every route stays up and keeps answering 200 or 401 with
        # the stale credential. `watchGlobally: false` means this list is the whole scope.

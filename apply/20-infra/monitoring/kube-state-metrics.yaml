# kube-state-metrics on titan, so that casa's shipped kubernetes-apps and
# kubernetes-resources rule groups mean something here instead of matching zero
# series. Without it there is no pod-, deployment- or PVC-level signal at all:
# KubePodCrashLooping, replica shortfalls and KubePersistentVolumeFillingUp all
# read kube_* families that only KSM emits.
#
# It is ClusterIP-only and nothing exposes it. Its metrics leave the cluster
# through the kube-apiserver service proxy on the already-open :6443, which is
# why there is no NodePort and no firewall change here: a NodePort would have put
# an UNAUTHENTICATED full cluster inventory -- pod names, images, env var names,
# secret names, ingress hosts -- on a port that publicHost.meshTCPPortExtraSources
# opens to the whole home LAN. See spec D2.
#
# fullnameOverride is load-bearing, not cosmetic: casa scrapes this Service by
# name through the apiserver proxy
# (/api/v1/namespaces/monitoring/services/http:kube-state-metrics:http/proxy/metrics),
# and the default name is prefixed with the release name. A release rename would
# change the Service name and silently drop the target to a 404. Verified against
# the rendered chart on 2026-10-13: name `kube-state-metrics`, port named `http`,
# port 8080.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
  namespace: monitoring
spec:
  interval: 1h
  type: oci
  url: oci://ghcr.io/prometheus-community/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-state-metrics
  namespace: monitoring
spec:
  releaseName: ksm
  chart:
    spec:
      chart: kube-state-metrics
      # 8.6.0 ships kube-state-metrics 2.20.0 via the chart's appVersion; the
      # image tag is deliberately not pinned a second time.
      version: "8.6.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  interval: 30m
  driftDetection:
    mode: enabled
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    fullnameOverride: kube-state-metrics
    # Restart KSM when the customResourceState ConfigMap changes, because nothing else
    # will and the failure is silent.
    #
    # #235 merged and the ConfigMap updated -- verified live, it holds three resources now
    # (Kustomization, DatabaseRole, Database) -- and the pod did not move: still the
    # 2026-10-13 object. Two independent facts add up to that:
    #
    #   * KSM reads --custom-resource-state-config-file exactly once at startup
    #     (pkg/app/server.go:201, a plain `os.ReadFile`; there is no watcher anywhere in
    #     the binary). Editing the ConfigMap is inert until the process restarts.
    #   * The chart renders no checksum/config annotation for this ConfigMap -- it arrives
    #     through extraVolumes, which the chart has no checksum hook for -- and the live
    #     pod template carries no annotations at all (measured). Helm's three-way patch
    #     sees an unchanged Deployment, so there is no rollout.
    #
    # Left alone, the exporter half of #231 ships a metric that never appears, and casa's
    # TitanCnpgAppliedStateMissing fires and stays fired pointing at RBAC, which is fine.
    #
    # Reloader is already the mechanism here for exactly this problem -- coder.yaml and
    # authentik.yaml name their ConfigMaps/Secrets explicitly for the same reason
    # coder.yaml records for rejecting `auto: "true"`. Read from the live
    # reloader-reloader Deployment: `--namespaces` includes `monitoring` and
    # `--reload-strategy=annotations` is set, so this annotation is acted on.
    #
    # Naming the one ConfigMap rather than `reloader.stakater.com/auto: "true"` is
    # deliberate: auto would discover every ConfigMap this pod can see and restart KSM for
    # unrelated edits too.
    #
    # This line is also what makes #235 take effect at all. The annotation changes the pod
    # template, so the next Helm upgrade rolls the pod and it reads the three-resource
    # config on the way up.
    podAnnotations:
      configmap.reloader.stakater.com/reload: kube-state-metrics-customresourcestate-config
    # One node. Autosharding on a single-node cluster shards work that does not
    # exist and adds a StatefulSet to reason about.
    replicas: 1
    autosharding:
      enabled: false
    # No prometheus-operator CRDs exist in titan, and casa is the scraper. Leaving
    # this on advertises a scrape that nothing here acts on.
    prometheusScrape: false
    # Drop the secrets collector, and with it the ClusterRole grant.
    #
    # The chart's default collector list includes `secrets`, which makes the
    # rendered ClusterRole grant cluster-wide get/list/watch on Secrets. KSM itself
    # only emits metadata (name, labels, size -- never the data), but the grant is
    # not metadata-scoped: anything that compromises this pod could read every
    # Secret in titan, which is AUTHENTIK_SECRET_KEY, the coder and CNPG passwords,
    # the OVH DNS credential and the S3 backup key. That is a straight escalation
    # path bought for metrics nothing consumes.
    #
    # Verified before excluding, not after: zero references to kube_secret_* across
    # all 45 PrometheusRule objects in casa's monitoring namespace and zero in
    # k8s-casa/apply. And the exclusion removes BOTH the --resources entry and the
    # RBAC rule -- re-rendered 2026-10-13, 26 collectors remain and the rendered
    # ClusterRole mentions neither secrets nor configmaps.
    #
    # configmaps goes for the same reason, added on review rather than originally:
    # it is the identical grant shape -- cluster-wide get/list/watch so the collector
    # can emit metadata -- and kube_configmap_* has zero consumers in casa too.
    # Leaving it in would have been an inconsistency dressed as a decision.
    collectorsExclude:
      - secrets
      - configmaps
    rbac:
      create: true
      # Needed by the customResourceState block below and nothing else. list/watch
      # on kustomizations only -- not the whole fluxcd API surface, because this
      # ClusterRole is already cluster-wide and the same reasoning that dropped the
      # secrets collector applies to over-granting here.
      extraRules:
        - apiGroups: ["kustomize.toolkit.fluxcd.io"]
          resources: ["kustomizations"]
          verbs: ["list", "watch"]
        # Needed by the cnpg customResourceState block below and nothing else. Same scope
        # discipline as the kustomizations grant: list/watch on the two kinds whose applied
        # state is worth an alert, not the whole cnpg API surface. The subject is
        # system:serviceaccount:monitoring:kube-state-metrics (verified live; the release is
        # named `ksm` but fullnameOverride pins the SA name). What this PR cannot verify
        # before merge is the grant itself -- the honest check is after Flux syncs, when
        # `cnpg_database_role_info` either appears in casa or does not; silence here means
        # the grant did not take, not that nothing is wrong.
        - apiGroups: ["postgresql.cnpg.io"]
          resources: ["databaseroles", "databases"]
          verbs: ["list", "watch"]
    # Emits `gotk_resource_info`, one Info series per Kustomization, carrying the
    # Ready condition. This is how titan gets Flux alerting: titan runs no
    # Prometheus, k8s-casa scrapes this Service through the apiserver proxy
    # (see the header of this file), and the rules live in
    # k8s-casa/apply/50-apps/monitoring/flux-alerts.yaml with cluster=titan.
    #
    # WHY NOT FLUX'S OWN METRICS: kustomize-controller v1.9.6 exposes no per-object
    # state. Measured against titan's live controller on 2026-10-13 -- `:8080/metrics`
    # has `gotk_reconcile_duration_seconds` and the controller-runtime set and
    # nothing else Flux-specific. There is no `flux_kustomization_*` family and no
    # `gotk_reconcile_condition` (removed in v1.8.0).
    #
    # NOT `--custom-resource-state-only=true`, which the upstream flux example sets:
    # it would turn off every `kube_*` collector, and casa's titan-k8s-guards.yaml
    # and the pod-level Flux rules depend on them.
    #
    # Cost: 5 Kustomizations on titan as measured 2026-10-13, so ~5 series at
    # casa's 60s scrape. The scrape's sampleLimit is 150000 and the current
    # payload is nowhere near it.
    customResourceState:
      enabled: true
      config:
        spec:
          resources:
            - groupVersionKind:
                group: kustomize.toolkit.fluxcd.io
                version: v1
                kind: Kustomization
              metricNamePrefix: gotk
              metrics:
                - name: "resource_info"
                  help: "The current state of a Flux Kustomization resource."
                  each:
                    type: Info
                    info:
                      labelsFromPath:
                        name: [metadata, name]
                  labelsFromPath:
                    # `exported_namespace`, not `namespace`: a CR-state series gets
                    # no `namespace` label from KSM, and casa's Alertmanager inhibit
                    # rules key on [namespace, cluster]. The rules there copy it
                    # into `namespace`; do not "fix" that here by renaming it, or
                    # every Flux alert from titan lands in the empty-namespace
                    # inhibit group.
                    exported_namespace: [metadata, namespace]
                    ready: [status, conditions, "[type=Ready]", status]
                    # Absent unless spec.suspend is set, so consumers filter
                    # suspended!="true", never suspended="false".
                    suspended: [spec, suspend]
                    revision: [status, lastAppliedRevision]
                    source_name: [spec, sourceRef, name]
    # CNPG `DatabaseRole` and `Database`, the same trick one API group over, because
    # `status.applied` is the only field that says the Postgres role or database was actually
    # created, and nothing anywhere checked it. #154 was the mirror-image problem -- a stale
    # `status.message` that meant nothing; the gap then, and the subject of #231, is that a
    # role which genuinely fails to apply is invisible. Every offline gate in k8s-titan is
    # tree-only by contract, so `applied` cannot be checked by `make check-ci`; this is the
    # half that asks the live cluster.
    #
    # Cost, measured 2026-11-03: 7 DatabaseRole + 6 Database on titan = 13 Info series at
    # casa's 60s scrape. The Flux block above carries 5. Nowhere near the scrape's 150000
    # sampleLimit.
    #
    # `applied` IS TRI-STATE AND THE RULES MUST MATCH IT. Upstream sets true (SetAsReady),
    # false (SetAsFailed) and NULL (SetAsUnknown) -- so a rule written `applied="false"`
    # silently misses the never-evaluated case. Write `applied!="true"`, which matches
    # false and absent-or-null alike, and say why in casa's rule.
    #
    # `pg_cluster`, NOT `cluster`. casa's scrape already stamps every series with
    # `cluster="titan"`; emitting a label of that name from the object would collide with it,
    # and a duplicate label on an ingested sample makes the sample invalid -- dropped, not
    # renamed. A dropped alert series is indistinguishable from an absent one, so this is a
    # silent-failure trap, and it is the same class as the `exported_namespace` note below.
    #
    # `status.message` is deliberately NOT exported. #154 exists because that field can be a
    # historical artifact; a label copied from it would produce alerts that mean nothing.
    # Alert on `applied`, then read `message` with kubectl for diagnosis.
    #
    # NOT COVERED, stated so it is not mistaken for coverage: `applied: true` means CNPG
    # created the role. It does not mean the app can connect -- wrong database name, wrong
    # search_path, a pg_hba surprise are all still invisible here. And `Cluster` health is not
    # exported either; that is casa's postgres-titan-guards.yaml and the CNPG operator's own
    # metrics, not this block.
    #
    # RBAC for this lives in rbac.extraRules above. If the grant is removed the failure mode
    # is silence, not an error: KSM logs the forbidden watch and emits no series.
    #
    # These two entries are APPENDED to the `resources` list above, they are not a second
    # `customResourceState:` key. A second key at this level would not add to the list -- YAML
    # mapping keys are last-one-wins, so it would silently delete the Flux block and every
    # Flux alert from titan while this file still read correctly. Verified after the merge,
    # not before: the rendered values carry three resources under one list.
            - groupVersionKind:
                group: postgresql.cnpg.io
                version: v1
                kind: DatabaseRole
              metricNamePrefix: cnpg
              metrics:
                - name: "database_role_info"
                  help: "The applied state of a CloudNativePG DatabaseRole."
                  each:
                    type: Info
                    info:
                      labelsFromPath:
                        name: [metadata, name]
                  labelsFromPath:
                    exported_namespace: [metadata, namespace]
                    applied: [status, applied]
                    pg_cluster: [spec, cluster]
                    reclaim_policy: [spec, databaseRoleReclaimPolicy]
            - groupVersionKind:
                group: postgresql.cnpg.io
                version: v1
                kind: Database
              metricNamePrefix: cnpg
              metrics:
                - name: "database_info"
                  help: "The applied state of a CloudNativePG Database."
                  each:
                    type: Info
                    info:
                      labelsFromPath:
                        name: [metadata, name]
                  labelsFromPath:
                    exported_namespace: [metadata, namespace]
                    applied: [status, applied]
                    pg_cluster: [spec, cluster]
    # 23 pods on titan as measured 2026-10-13. KSM's baseline RSS for a cluster
    # this size is well under the limit; the limit exists so a leak is contained
    # on a host whose root filesystem is 150 G and whose etcd is on it.
    resources:
      requests:
        memory: 64Mi
        cpu: 20m
      limits:
        memory: 256Mi

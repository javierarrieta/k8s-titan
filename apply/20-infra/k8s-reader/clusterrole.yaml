apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-reader-role
rules:
  # Read-only inventory for investigation work. Modelled on k8s-casa's k8s-reader
  # role, widened for what titan actually runs.
  #
  # The resource list is ENUMERATED on purpose. `resources: ["*"]` would be shorter
  # and would silently include Secrets, which makes this identity write-equivalent:
  # registry credentials, the OVH DNS credential in cert-manager, and every
  # token in the cluster. If a new API group is added to the cluster and this role
  # cannot see it, that is the failure mode you want -- add the line deliberately.
  #
  # Deliberately absent, and do not add them without thinking:
  #   secrets                        read == write capability, see above
  #   nodes/proxy                    reaches the kubelet API, which exposes running
  #                                  pod data and is a real escalation path that
  #                                  "read-only" roles often miss
  #   pods/exec, /attach, /portforward, /proxy   not read operations at all
  #   serviceaccounts/token          mints a credential for another identity
  #   anything with create/update/patch/delete   verbs are get/list/watch only
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - pods/status
      - services
      - configmaps
      - endpoints
      - persistentvolumes
      - persistentvolumeclaims
      - nodes
      - nodes/metrics
      - namespaces
      - events
      - resourcequotas
      - limitranges
      - serviceaccounts
      - replicationcontrollers
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets", "statefulsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "ingressclasses", "networkpolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  # RBAC and admission objects. Reading these is how you answer "why is that apply
  # being rejected" or "who is allowed to read that secret" without guessing.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings", "roles", "rolebindings"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["mutatingwebhookconfigurations", "validatingwebhookconfigurations"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "volumeattachments"]
    verbs: ["get", "list", "watch"]
  # The aggregated-API and lease objects. titan's cert-manager OVH webhook is an
  # APIService, so `apiservices` is the object that tells you whether the webhook
  # is actually reachable, and `leases` is how you tell whether a control-plane
  # component is alive or wedged.
  - apiGroups: ["apiregistration.k8s.io"]
    resources: ["apiservices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
  # cert-manager
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates", "certificaterequests", "issuers", "clusterissuers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["acme.cert-manager.io"]
    resources: ["orders", "challenges"]
    verbs: ["get", "list", "watch"]
  # Flux. Orders and challenges land in the Certificate's own namespace, not
  # cert-manager's, so an investigator needs them wherever the Certificate is.
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["gitrepositories", "ocirepositories", "helmrepositories", "buckets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases", "helmcharts"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["get", "list", "watch"]
  # Traefik's own CRDs. This is the group that explains a router which exists but
  # will not serve: Traefik builds its configuration out of these objects, so an
  # agent that can read the Ingress and the Traefik pod log but not the Middleware
  # named in the log's error can describe a failure it cannot inspect. Learned the
  # hard way on 2026-10-18, when a forward-auth reference took every path on one
  # host down and the object the error named was unreadable.
  #
  # Not credential-free, unlike `services`: a Middleware can carry a `basicAuth`
  # users hash or forward-auth request headers, so treat a read of this group the
  # way you treat reading a ConfigMap that holds config, not the way you treat
  # reading a Service. It is still nowhere near Secrets.
  - apiGroups: ["traefik.io"]
    # All ten, taken from `kubectl api-resources --api-group=traefik.io` rather than
    # from the subset tonight's incident happened to need. An enumerated list that is
    # incomplete is just a slower version of the same blind spot.
    resources:
      - ingressroutes
      - ingressroutetcps
      - ingressrouteudps
      - middlewares
      - middlewaretcps
      - serverstransports
      - serverstransporttcps
      - tlsoptions
      - tlsstores
      - traefikservices
    verbs: ["get", "list", "watch"]
  # k3s owns its bundled add-ons (Traefik, ServiceLB) through its own HelmChart
  # CRDs. Without these an agent can see the Traefik pod but not the chart that
  # declares it, which is the half that explains why a hand-patched add-on gets
  # reverted on the next restart.
  - apiGroups: ["helm.cattle.io"]
    resources: ["helmcharts", "helmconfigs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["k3s.cattle.io"]
    resources: ["etcdsnapshotfiles"]
    verbs: ["get", "list", "watch"]
  # CNPG, added 2026-10-19 at the operator's request. Before this, `get cluster` needed an
  # admin context, which made routine database health checks impossible for an agent and left
  # docs/authentik-runbook.md §5 proving health by effect instead.
  #
  # What this discloses: topology and state. Which instance is primary, whether replicas are
  # streaming, backup and WAL archiving status, database and role names.
  #
  # What it does NOT disclose, and the reason this was judged safe: CNPG CRs reference Secrets
  # by NAME only — `superuserSecret`, `replicationSecret`, `barmanObjectStore.s3Credentials`,
  # `DatabaseRole.spec.passwordSecret` are all object references. The values live in Secrets,
  # and Secrets remain absent from this role. Reading a `Cluster` tells you the name of the
  # secret holding the replication password; it does not tell you the password.
  #
  # Enumerated, not `"*"`, per the note above: `publications`, `subscriptions`,
  # `failoverquorums`, `imagecatalogs` and `clusterimagecatalogs` are deliberately absent
  # because nothing here uses them. If one is introduced and a check goes Forbidden, that is
  # the intended failure mode — add the line.
  - apiGroups: ["postgresql.cnpg.io"]
    resources:
      - clusters
      - databases
      - databaseroles
      - backups
      - scheduledbackups
      - poolers
    verbs: ["get", "list", "watch"]

# Long-lived API credential for the k8s-reader ServiceAccount.
#
# This Secret carries NO data in git. It is a token *request*: the
# ServiceAccount token controller populates it in-cluster. That is the only
# reason it is allowed to live outside apply/10-secrets, and `make
# secrets-placement` enforces exactly that -- it exempts a Secret only while it
# is typed kubernetes.io/service-account-token AND has no data/stringData, so
# pasting a real token into this file fails the gate.
#
# Read the token out with an admin context:
#   kubectl -n k8s-reader get secret k8s-reader-kubeconfig-token \
#     -o jsonpath='{.data.token}' | base64 -d
#
# Rotate by deleting it and letting the controller recreate it:
#   kubectl -n k8s-reader delete secret k8s-reader-kubeconfig-token
#
# This token does not expire. If an agent only needs access for one investigation,
# prefer a short-lived token instead and leave this one alone:
#   kubectl -n k8s-reader create token k8s-reader --duration=8h
apiVersion: v1
kind: Secret
metadata:
  name: k8s-reader-kubeconfig-token
  namespace: k8s-reader
  annotations:
    kubernetes.io/service-account.name: k8s-reader
type: kubernetes.io/service-account-token

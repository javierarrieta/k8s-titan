apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: cert-manager-webhook-ovh
  namespace: cert-manager
spec:
  interval: 1h0s
  url: https://aureq.github.io/cert-manager-webhook-ovh/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager-webhook-ovh
  namespace: cert-manager
spec:
  chart:
    spec:
      chart: cert-manager-webhook-ovh
      sourceRef:
        kind: HelmRepository
        name: cert-manager-webhook-ovh
      version: "0.9.19"
  interval: 1h0s
  releaseName: cert-manager-webhook-ovh
  # The webhook chart templates cert-manager.io kinds (its serving Certificate and
  # self-signed Issuer), so it needs cert-manager's CRDs already installed. Both
  # HelmReleases land in the same `infra` reconcile, and without this the webhook's
  # first install attempt races cert-manager's CRD install - the same class of problem
  # the stage graph solves one level up with wait: true.
  dependsOn:
    - name: cert-manager
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    # The chart creates a cluster-scoped APIService named
    # v1alpha1.<groupName>. Reusing another cluster's groupName in one cluster
    # is a hard conflict, so this value is titan's own.
    groupName: acme.titan.arrieta.eu
    certManager:
      namespace: cert-manager
      serviceAccountName: cert-manager
    # Chart 0.7.0 rewrote the values layout (top-level securityContext/replicas/
    # environment/port/resources/nodeSelector moved under `pod.`, image.repository
    # split into image.registry + image.repository) and added a values.schema.json
    # with additionalProperties: false on every object. Two things this file has to
    # carry as a result: `ovhAuthenticationMethod` is required per issuer, and the
    # consumer key is `applicationConsumerKeyRef`, not `consumerKeyRef`. Helm checks
    # values against that schema before it renders anything, so either one wrong is a
    # red release with nothing applied. `make chart-values-check` renders this release
    # against the pinned chart to catch exactly that; docs/cert-manager-webhook-ovh.md.
    issuers:
      - name: le-prod-titan
        create: true
        kind: ClusterIssuer
        cnameStrategy: None
        acmeServerUrl: https://acme-v02.api.letsencrypt.org/directory
        email: javier@techdelivery.es
        ovhEndpointName: ovh-eu
        ovhAuthenticationMethod: application
        ovhAuthenticationRef:
          applicationKeyRef:
            name: ovh-domain-secrets
            key: OVH_APPLICATION_KEY
          applicationSecretRef:
            name: ovh-domain-secrets
            key: OVH_APPLICATION_SECRET
          applicationConsumerKeyRef:
            name: ovh-domain-secrets
            key: OVH_CONSUMER_KEY
      - name: le-staging-titan
        create: true
        kind: ClusterIssuer
        cnameStrategy: None
        acmeServerUrl: https://acme-staging-v02.api.letsencrypt.org/directory
        email: javier@techdelivery.es
        ovhEndpointName: ovh-eu
        ovhAuthenticationMethod: application
        ovhAuthenticationRef:
          applicationKeyRef:
            name: ovh-domain-secrets
            key: OVH_APPLICATION_KEY
          applicationSecretRef:
            name: ovh-domain-secrets
            key: OVH_APPLICATION_SECRET
          applicationConsumerKeyRef:
            name: ovh-domain-secrets
            key: OVH_CONSUMER_KEY

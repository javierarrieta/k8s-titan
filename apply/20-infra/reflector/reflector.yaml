# Reflector replicates TLS material across namespaces, plus exactly one credential and one
# ConfigMap: the restic backup Secret and the backup scripts, both declared in `apps` and mirrored
# to the six namespaces that run backup jobs (apply/70-backup/). The database credential is still
# authored instead (spec 4 A4).
#
# That is a reversal of this file's original rule - "TLS material and nothing else" - made in the
# restic backup spec section 7b, and the reason is arithmetic rather than preference: six
# namespaces times a credential and a 150-line script is either twelve copies in git that can
# drift or one copy mirrored. Both mirror lists are explicit namespace lists, never "all
# namespaces", and `make backup-coverage` fails when the two disagree with each other or with the
# set of namespaces that has a runner.
#
# That scope is a convention, not a boundary. The chart's ClusterRole (rbac.enabled
# defaults to true) grants `configmaps` and `secrets` with verbs ["*"], cluster-wide,
# so the blast radius of a compromised Reflector is every Secret in the cluster, not
# just the TLS ones, and still is. What decides what gets mirrored is review and the set of
# objects we choose to annotate - never RBAC.
#
# This is bootstrap spec 9's deferred item, promoted on its own stated trigger ("a second
# namespace needs titan-tls"), and promoted whole: the Certificate moves to `certificates`
# in the same slice (spec 5.3), so `apps` stops being the cluster's certificate source.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: emberstack
  namespace: apps
spec:
  interval: 1h
  url: https://emberstack.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reflector
  namespace: apps
spec:
  releaseName: reflector
  chart:
    spec:
      chart: reflector
      version: "10.0.46"
      sourceRef:
        kind: HelmRepository
        name: emberstack
  interval: 30m
  driftDetection:
    mode: enabled
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m

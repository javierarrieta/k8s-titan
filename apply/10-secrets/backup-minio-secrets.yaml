apiVersion: v1
kind: Secret
metadata:
    name: backup-minio-secrets
    namespace: apps
    labels:
        app: backup
        app.kubernetes.io/part-of: pv-backup
    annotations:
        # Reflector mirrors this credential into every namespace that runs a backup job, so the
        # value exists in git exactly once and rotation is one edit. The list is explicit, not
        # "all namespaces", and must match apply/70-backup/rbac.yaml -- a namespace in one and
        # not the other is what `make backup-coverage` fails on. coder-workspaces and
        # observability are NOT here: coder volumes are out because a workspace should be
        # reproducible from its image and from git, and grafana's volume because git already
        # holds it (spec 7c).
        reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
        reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: mealie,open-webui,sure
        reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
        reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: mealie,open-webui,sure
type: Opaque
# stringData, not data: the repo convention with a gate behind it. kustomize-controller strips
# the sops envelope and submits the values as-is, and the API server base64-decodes data.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Telegram credentials used by titan's independent Gatus monitor.
  - gatus-telegram.yaml
  - ovh-domain-secrets.yaml
  # Referenced by the Cluster's s3Credentials, not by a HelmRelease, so `make
  # release-secrets` cannot vouch for it - see the gate's own comment in Makefile.
  - s3-backup-secrets.yaml
  # CNPG role credential for the read-only metrics exporter.
  - postgres-exporter-secrets.yaml
  # Two Secrets in one file, one value shared between them: DatabaseRole needs the password
  # to ALTER ROLE, authentik needs it to connect, and Reflector is deliberately scoped to
  # TLS only (spec 5.3) so it cannot carry a credential across namespaces. Duplicating one
  # value inside one sops file is cheaper than widening Reflector. If they ever drift,
  # authentik gets "password authentication failed" and the HelmRelease goes red - loud,
  # not silent.
  #
  # authentik-db-credentials is referenced by a DatabaseRole, not a HelmRelease, so
  # `make release-secrets` cannot vouch for that name the way it does for the others.
  - authentik-secrets.yaml
  # coder's three. Unlike authentik's, these are three files rather than one, and that is the
  # difference between the two apps rather than an inconsistency: authentik's duplicated password
  # lives twice INSIDE one sops file, where a single edit moves both halves and they cannot drift
  # apart. coder's DB password and OIDC client each have to appear in two different namespaces, so
  # no single-file trick reaches them - which is exactly why `make db-url-check` and
  # `make oidc-check` exist to compare across files.
  #
  # None of these three is referenced by a HelmRelease's valuesFrom, so `make release-secrets`
  # cannot vouch for any of them: coder takes its config as env/secretKeyRef inside spec.values and
  # the blueprint is mounted by a chart-specific key. The two named gates above are what cover them,
  # and an unlisted file here would build green and be silently never applied - `make
  # secrets-placement` is the guard against that specific lie.
  - coder-secrets.yaml
  - coder-db-credentials.yaml
  - authentik-coder-blueprint.yaml
  # Google social login, allowlist mode. Carries the Google OAuth client secret, so it is a Secret
  # for the same reason as coder's blueprint, and it is rendered by scripts/setup-google-blueprint.sh
  # from authentik/blueprints-google.yaml.
  - authentik-google-blueprint.yaml
  # Grafana's OIDC client, written to two files that have to agree: authentik's copy (the rendered
  # blueprint, namespace auth) and Grafana's own copy (namespace apps). One credential in two places
  # is one rotation away from a silent split, which is exactly what make grafana-oidc-check exists to
  # catch — the same shape of problem make oidc-check covers for coder.
  - authentik-grafana-blueprint.yaml
  - tesla-grafana-oidc.yaml
  # TeslaMate. Two files rather than one because the same password has to reach two namespaces: the
  # app reads DATABASE_PASS from `apps`, and CNPG's DatabaseRole needs a `kubernetes.io/basic-auth`
  # Secret in `databases` carrying the identical value. That split is what the script's own
  # cross-check compares, for the same reason make db-url-check exists for coder.
  - teslamate-secrets.yaml
  - teslamate-db-credentials.yaml
  - tesla-grafana-admin.yaml
  # The Tesla application's PUBLIC key and its OAuth client id, both written by
  # scripts/setup-tesla-secrets.sh once the application existed at developer.tesla.com. Neither is a
  # credential: the public half is meant to be published at /.well-known/appspecific/ and Tesla
  # re-fetches it forever, and the client id appears in every consent URL. They are Secrets because
  # a committed ConfigMap placeholder for a value that did not exist yet would build green, review
  # green, and break sign-in quietly, whereas a missing Secret leaves the pod Pending with an event
  # that names it.
  #
  # tesla-wellknown is served by the nginx Pod at tesla.titan.arrieta.eu/.well-known/..., which is
  # the URL pairing depends on. tesla-oauth is read by TeslaMate as TESLA_AUTH_CLIENT_ID, and it must
  # be the SAME client id that minted TeslaMate's token pair: refresh.ex sends client_id, and Tesla
  # answers a mismatch with invalid_client (TeslaMate issue #4091).
  - tesla-wellknown.yaml
  - tesla-oauth.yaml
  # The Loki push endpoint for apply/20-infra/monitoring/promtail.yaml. Encrypted for
  # the same reason as every other file here — this directory is the only place a Secret
  # may live — and NOT because the value is secret: it is `https://loki.local.arrieta.eu`,
  # published in public DNS and reachable only from the mesh/LAN because it resolves to
  # an RFC1918 address. Loki runs auth_enabled: false, so there is no token here today.
  # It is a Secret so that when an auth header or tenant ID is ever added it lands here
  # rather than forcing the endpoint out of 20-infra. See docs/titan-logs-loki.md.
  - promtail-secrets.yaml
  # open-webui. Three files, four values, all minted by scripts/setup-open-webui-secrets.sh in one
  # process so the duplicated halves cannot be authored apart: the DB password appears in CNPG's
  # basic-auth Secret (namespace databases) and inside open-webui's DATABASE_URL (namespace
  # open-webui), and the OIDC client appears in authentik's blueprint (namespace auth) and in
  # open-webui's own env. make db-url-check and make open-webui-oidc-check are what prove the pairs
  # agree; an unlisted file here would build green and be silently never applied, which is the lie
  # `make secrets-placement` exists to catch.
  - authentik-open-webui-blueprint.yaml
  - open-webui-db-credentials.yaml
  - open-webui-secrets.yaml
  # Grafana on titan. Minted together by scripts/setup-observability-grafana.sh so the duplicated
  # half cannot be authored apart: the OIDC client exists in authentik's blueprint (namespace auth)
  # and in Grafana's own env (namespace observability), and `make observability-oidc-check` is what
  # proves they agree. The admin Secret is the escape hatch that keeps GF_AUTH_BASIC_ENABLED=true
  # meaningful. An unlisted file here builds green and is silently never applied.
  - authentik-observability-blueprint.yaml
  - observability-grafana-oidc.yaml
  - observability-grafana-admin.yaml
  # Mealie. Three files, three values, all minted by scripts/setup-mealie-secrets.sh in one process so
  # the duplicated halves cannot be authored apart: the DB password exists in CNPG's DatabaseRole
  # (namespace databases) and in Mealie's env (namespace mealie), and the OIDC client exists in
  # authentik's blueprint (namespace auth) and in Mealie's env. `make mealie-check` is what proves the
  # pairs agree — and it has to, because Mealie takes POSTGRES_* rather than a DATABASE_URL, so the
  # generic `make db-url-check` never looks at this app. An unlisted file here builds green and is
  # silently never applied, which is the lie `make secrets-placement` exists to catch.
  - authentik-mealie-blueprint.yaml
  - mealie-db-credentials.yaml
  - mealie-secrets.yaml
  # OpenCloud's own Secret. Namespace `files` is the namespace OpenCloud takes over from oCIS rather
  # than a new one, because the hostname and the reflected certificate moved with it.
  - opencloud-secrets.yaml
  # The bearer token llm.titan.arrieta.eu checks every request against, read by the forwardAuth nginx
  # in namespace `llm` (apply/50-apps/llm/llm.yaml). One value, one place, nothing duplicated — which
  # is why there is no `*-check` gate for it, unlike coder's or Mealie's credentials: there is no
  # second copy here to drift from.
  #
  # The copy that CAN drift is in another repo: ../k8s-techdelivery apply/10-secrets/bearer-auth-token
  # .yaml holds the identical token for llm.v.arrieta.eu, and the two clusters are both live with it
  # by decision. Rotating means editing both repos, and nothing in either tree detects the halves
  # disagreeing — the spec for this endpoint names that as an accepted cost, not an oversight.
  #
  # Referenced by a Deployment's secretKeyRef, not by a HelmRelease, so `make release-secrets` cannot
  # vouch for this name the way it does for the chart-consumed ones. An unlisted file here would build
  # green and be silently never applied, which is the lie `make secrets-placement` exists to catch.
  - llm-bearer-token.yaml

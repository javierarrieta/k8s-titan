# MinIO credentials for OpenCloud's decomposeds3 blob store.
#
# Namespace `files` is deliberate, not inherited: OpenCloud takes over files.titan.arrieta.eu
# from oCIS rather than running beside it, so it reuses the namespace oCIS vacates. The two do
# not coexist, which is also why the blob bucket is separate - the old one stays readable while
# the new one fills.
#
# Only the two S3 keys live here. The rest of the OpenCloud Secret (jwt secret, WOPI secret,
# machine-auth key, transfer secret, IDM passwords) is created with the manifests, because
# those values do not exist yet.
#
# docs/opencloud-minio.md is the runbook: what the key is allowed to do and why.

---
# Infinite Scale (oCIS) on titan: the app server and the WOPI collaboration service.
#
# WHY TWO CONTAINERS IN ONE POD
# `ocis server` supervises every microservice in one process, which is the right shape for a
# single-node cluster. The collaboration service is deliberately NOT part of that set: upstream
# documents that it "won't start by default when using `ocis server` (supervised mode). You must
# start it manually with the `ocis collaboration server` command", because it is only useful with an
# external document server. So it is a second container in the same pod, reaching the supervised
# services' embedded NATS registry on loopback.
#
# WHY THE BLOBS ARE NOT IN THIS POD
# STORAGE_USERS_DRIVER=s3ng puts file contents in an S3 bucket and keeps only the metadata tree on
# the PVC mounted here. That split is the whole reason this app fits on titan at all: the VPS has no
# room for the data, so only the index lives locally. See §HONEST LIMITS at the bottom.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ocis-data
  namespace: files
  labels:
    app: ocis
spec:
  accessModes:
    - ReadWriteOnce
  # Retain, not the default `local-path`: this PVC holds the metadata tree and the SQLite databases
  # that describe every file in the bucket. Delete-reclaim on it means deleting the app's knowledge
  # of its own contents.
  storageClassName: local-path-retain
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ocis-csp
  namespace: files
data:
  # The proxy's CSP is a built-in default with no way to append a directive through env; the only
  # supported override is a whole file (PROXY_CSP_CONFIG_FILE_LOCATION). This is
  # services/proxy/pkg/config/csp.yaml from the v8.2.2 tag with two origins added, marked below.
  # Keep it in step with the upstream file when the image moves.
  csp.yaml: |
    directives:
      child-src:
        - '''self'''
      connect-src:
        - '''self'''
        - 'blob:'
        - 'https://raw.githubusercontent.com/owncloud/awesome-ocis/'
        # ADDED. authentik: the SPA fetches the OIDC discovery document from the IdP origin. Without
        # this the browser refuses the request before it reaches the network, so nothing appears in a
        # HAR and the UI only says "We're having trouble connecting to the login service".
        - 'https://auth.titan.arrieta.eu/'
      default-src:
        - '''none'''
      font-src:
        - '''self'''
        - 'data:'
      frame-ancestors:
        - '''self'''
      frame-src:
        - '''self'''
        - 'blob:'
        - 'https://embed.diagrams.net/'
        # ADDED. Collabora's editor loads in an iframe from its own host.
        - 'https://collabora.titan.arrieta.eu/'
      img-src:
        - '''self'''
        - 'data:'
        - 'blob:'
        - 'https://raw.githubusercontent.com/owncloud/awesome-ocis/'
      manifest-src:
        - '''self'''
      media-src:
        - '''self'''
      object-src:
        - '''self'''
        - 'blob:'
      script-src:
        - '''self'''
        - '''unsafe-inline'''
      style-src:
        - '''self'''
        - '''unsafe-inline'''
---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: ocis
  namespace: files
spec:
  replicas: 1
  strategy:
    # RWO PVC; a rolling update would schedule a second pod that can never attach it.
    type: Recreate
  selector:
    matchLabels:
      app: ocis
  template:
    metadata:
      labels:
        app: ocis
    spec:
      # Upstream warns that a hard stop (SIGKILL) leaves the decomposedfs metadata inconsistent -
      # "it is possible and likely that not all data from the decomposedfs (metadata) has been
      # written to the storage" - and that SIGTERM plus STORAGE_USERS_GRACEFUL_SHUTDOWN_TIMEOUT is
      # the mitigation. Kubernetes' 30s default grace period is not a graceful shutdown for a
      # process with open write requests, and until the PVC has a restore point an inconsistent tree
      # is unrecoverable rather than merely annoying. Revisit alongside the restic work.
      terminationGracePeriodSeconds: 120
      containers:
        - name: ocis
          # Pinned to the newest stable 8.2 line at the time of writing (owncloud/ocis on Docker Hub
          # also publishes `8`, `8.2` and dated rolling tags; none of those are acceptable here).
          image: owncloud/ocis:8.2.2
          env:
            - name: OCIS_URL
              value: https://files.titan.arrieta.eu
            # TLS terminates at traefik, so the mesh should speak plain http internally.
            #
            # OCIS_INSECURE is NOT the switch for that, which is what cost a cycle. It is not a bound
            # global field at all - it only ever appears as the FIRST name in per-service chains like
            # PROXY_OIDC_INSECURE (services/proxy/pkg/config/config.go:118). Setting it influences
            # those chains; on its own it disables nothing. The listener TLS is a different field:
            # shared.HTTPServiceTLS, bound to OCIS_HTTP_TLS_ENABLED (ocis-pkg/shared/shared_types.go:68).
            # With that left at its default the proxy served TLS on 9200, the kubelet's plain-http
            # readiness probe got a 400, and the log filled with
            #   http: TLS handshake error from 10.62.0.1: client sent an HTTP request to an HTTPS server
            # Traefik terminates at the edge and talks http to the pod, so http is what we want here.
            - name: OCIS_INSECURE
              value: "true"
            - name: OCIS_HTTP_TLS_ENABLED
              value: "false"
            - name: PROXY_HTTP_ADDR
              value: "0.0.0.0:9200"
            # The proxy's own listener flag, and NOT OCIS_HTTP_TLS_ENABLED (which governs the shared
            # http service and turned out not to be the proxy's switch). Default is true
            # (services/proxy/pkg/config/defaults/defaultconfig.go:37), and with no cert on disk the
            # proxy generates a self-signed one at startup, so 9200 answered TLS and every plain-http
            # probe came back 400. Traefik terminates TLS at the edge.
            - name: PROXY_TLS
              value: "false"
            # /healthz and /readyz live on the debug server, not on 9200 - and it binds 127.0.0.1 by
            # default (proxy defaults: Addr "127.0.0.1:9205"), which kubelet cannot reach through the
            # pod IP. Bind it publicly inside the pod so the probes have a real endpoint. Cluster-
            # internal only: the Service exposes 9200 and 9300, never this port.
            - name: PROXY_DEBUG_ADDR
              value: "0.0.0.0:9205"
            # Point the proxy at the CSP file above. See the ConfigMap for why the IdP origin has to
            # be listed there.
            - name: PROXY_CSP_CONFIG_FILE_LOCATION
              value: /etc/ocis/csp/csp.yaml
            - name: OCIS_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: ocis-secrets
                  key: admin-user
            - name: OCIS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ocis-secrets
                  key: admin-password
            - name: OCIS_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ocis-secrets
                  key: jwt-secret
            - name: OCIS_MACHINE_AUTH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ocis-secrets
                  key: machine-auth-api-key
            # Three values oCIS refuses to start without, each checked by a different service's
            # Validate(): JWT secret, transfer secret and system-user API key
            # (ocis-pkg/config/parser/parse.go:134, services/storage-system/pkg/config/parser/parse.go:41).
            # The first reconcile crash-looped on exactly this - the container died with
            # "The transfer_secret has not been set properly" before any of the interesting subsystems
            # got a turn, which is why STORAGE_* was still untested afterwards.
            - name: OCIS_TRANSFER_SECRET
              valueFrom:
                secretKeyRef:
                  name: ocis-secrets
                  key: transfer-secret
            # Note the name has no OCIS_ prefix (ocis-pkg/shared/shared_types.go:104). Sharing,
            # settings and storage-system all check it.
            - name: SYSTEM_USER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ocis-secrets
                  key: system-user-api-key
            # Same value, second name - the third instance of this trap (gateway's mount ID, the
            # LDAP bind pair, now this). settings and storage-system declare the key as
            # env:"OCIS_SYSTEM_USER_API_KEY" with NO alternative in the chain, so the unprefixed
            # SYSTEM_USER_API_KEY above - which is real, it is the reva shared section in
            # ocis-pkg/shared/shared_types.go:104 - never reaches them. Fifth reconcile died on
            # "The SystemUser API key has not been configured for settings".
            #
            # Swept every service config for SYSTEM_USER / ADMIN_USER / SERVICE_ACCOUNT while in
            # here: those are the only two variables with no OCIS_ alternative. Everything else
            # chains OCIS_X;SERVICE_X, so the globals set above cover all of them.
            - name: OCIS_SYSTEM_USER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ocis-secrets
                  key: system-user-api-key
            # --- stable instance identifiers ----------------------------------------------
            # Not credentials. These are identifiers that must simply be non-empty and never change
            # once data exists, so they live in git where a rotation shows up as a diff rather than
            # hiding in a Secret. Each one is a startup check that fails the pod if it is empty:
            #   OCIS_SYSTEM_USER_ID      - proven by the live crash-loop; sharing + storage-system
            #                              + the supervisor (ocis-pkg/config/parser/parse.go)
            #   STORAGE_USERS_MOUNT_ID   - storage-users refuses to start without it
            #                              (services/storage-users/pkg/config/parser/parse.go:43), and
            #                              gateway needs the SAME mount under a DIFFERENT name - see
            #                              the next entry. That asymmetry is the trap.
            #   OCIS_ADMIN_USER_ID       - idm and settings check it
            #   GRAPH_APPLICATION_ID     - graph checks it; app roles are tied to this ID
            # Changing the mount ID after files exist orphans the storage tree. Do not rotate these.
            - name: OCIS_SYSTEM_USER_ID
              value: "a0f1a4d7-45a2-440e-8892-76c2523427b6"
            - name: STORAGE_USERS_MOUNT_ID
              value: "d8378cd3-e815-4441-9cd2-87222a555c27"
            # Same mount, different variable name. storage-users declares the mount under
            # STORAGE_USERS_MOUNT_ID; gateway resolves it under GATEWAY_STORAGE_USERS_MOUNT_ID
            # (services/gateway/pkg/config/config.go:86). Setting only the first produced
            # "The storage users mount ID has not been configured for gateway" on the third
            # reconcile - the value was present in the pod and still did not reach the service that
            # needed it. These two must always hold the identical UUID; a divergence means gateway
            # cannot route to the users storage at all. Other per-service mount variables exist
            # (STORAGE_SHARES_MOUNT_ID, STORAGE_PUBLICLINK_STORAGE_PROVIDER_MOUNT_ID) but those
            # services do not gate startup on them.
            - name: GATEWAY_STORAGE_USERS_MOUNT_ID
              value: "d8378cd3-e815-4441-9cd2-87222a555c27"
            - name: OCIS_ADMIN_USER_ID
              value: "0189c60d-d9fb-451b-9e5b-bd34f433df58"
            - name: GRAPH_APPLICATION_ID
              value: "d584291e-791e-4a9f-95ec-ef46e52e89ff"
            # --- the LDAP layer ocis init normally wires --------------------------------------
            # auth-basic's only supported auth manager is 'ldap'
            # (services/auth-basic/pkg/config/config.go:23, default "ldap"), and it, users, groups,
            # graph and idp all bind against the embedded idm LDAP. Nothing in the env-var docs makes
            # this discoverable; it surfaced as "The ldap bind_password has not been set properly in
            # your config for auth-basic" on the fourth reconcile.
            #
            # The bind DN defaults to uid=reva,ou=sysusers,o=libregraph-idm for auth-basic, users and
            # groups, so OCIS_LDAP_BIND_PASSWORD MUST equal IDM_REVASVC_PASSWORD - idm provisions that
            # LDAP user from the second one and the others authenticate with the first. They are two
            # keys in the Secret holding one value on purpose: rotating one without the other produces
            # an InvalidCredentials failure that looks like a bad password rather than a mismatch.
            - name: IDM_SVC_PASSWORD
              valueFrom: { secretKeyRef: { name: ocis-secrets, key: idm-svc-password } }
            - name: IDM_REVASVC_PASSWORD
              valueFrom: { secretKeyRef: { name: ocis-secrets, key: idm-reva-password } }
            - name: IDM_IDPSVC_PASSWORD
              valueFrom: { secretKeyRef: { name: ocis-secrets, key: idp-svc-password } }
            - name: IDM_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: ocis-secrets, key: idm-admin-password } }
            - name: OCIS_LDAP_BIND_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ocis-secrets
                  key: ldap-bind-password
            # The global above is NOT one bind password for the whole mesh. idm creates three
            # distinct LDAP users under ou=sysusers and each service binds as a different one, so
            # each needs its own password; the global only covers the reva user that auth-basic,
            # users and groups use. services/idm/pkg/command/configsync.go:22-36 is the authority -
            # it maps each service user to the config keys that must hold its secret:
            #
            #   reva        -> idm.service_user_passwords.reva_password  (covered by the global)
            #   libregraph  -> idm.service_user_passwords.idm_password
            #   idp         -> idm.service_user_passwords.idp_password
            #
            # Both chains are OCIS_LDAP_BIND_PASSWORD;<SERVICE>_LDAP_BIND_PASSWORD and envdecode
            # takes the LAST set name, so without the per-service override graph and idp silently
            # bound as uid=libregraph / uid=idp using the reva password. That surfaced as
            # `LDAP Result Code 49 "Invalid Credentials"` from graph during first login, which the
            # proxy reported only as "Autoprovisioning user failed / 500" and the UI flattened to
            # "your account is either inactive or not yet authorized". No new secrets: these are
            # keys the Secret already had.
            - name: GRAPH_LDAP_BIND_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ocis-secrets
                  key: idm-svc-password
            - name: IDP_LDAP_BIND_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ocis-secrets
                  key: idp-svc-password
            # Graph's service account - a machine identity idm creates in LDAP. The ID is an
            # identifier, so it sits with the other stable IDs above rather than in the Secret.
            - name: OCIS_SERVICE_ACCOUNT_ID
              value: "b7c1f0e2-9d34-4a6f-8c21-5e0b7a4d9c33"
            - name: OCIS_SERVICE_ACCOUNT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ocis-secrets
                  key: service-account-secret
            # Distinct from OCIS_TRANSFER_SECRET despite the similar name (THUMBNAILS_TRANSFER_TOKEN,
            # services/thumbnails/pkg/config/config.go).
            - name: THUMBNAILS_TRANSFER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ocis-secrets
                  key: thumbnails-transfer-token

            # --- authentik as the identity provider -------------------------------------------
            # The IdP's TLS verification chains off the global OCIS_INSECURE above
            # (env:"OCIS_INSECURE;PROXY_OIDC_INSECURE"), and envdecode takes the LAST variable in the
            # chain that is set, not the first (ocis-pkg/config/envdecode/envdecode.go:153-158). So
            # OCIS_INSECURE=true, which is correct for the loopback mesh and wrong for a public
            # IdP, would silently disable certificate checking on the connection to authentik.
            # Pinning the local name is the only thing keeping that verification on.
            - name: PROXY_OIDC_INSECURE
              value: "false"
            # per_provider issuer for the `ocis` client declared in
            # apply/50-apps/auth/ocis-blueprint.yaml. This one var moves both halves off the built-in
            # idp: the proxy reads OCIS_URL;OCIS_OIDC_ISSUER;PROXY_OIDC_ISSUER
            # (services/proxy/pkg/config/config.go:117) and the web front-end reads
            # OCIS_URL;OCIS_OIDC_ISSUER;WEB_OIDC_AUTHORITY (services/web/pkg/config/config.go:72).
            # Set neither and login silently stays local, because OCIS_URL wins the chain.
            - name: OCIS_OIDC_ISSUER
              value: https://auth.titan.arrieta.eu/application/o/ocis/
            - name: OCIS_OIDC_CLIENT_ID
              value: ocis
            # WEB_OIDC_SCOPE defaults to "openid profile email"
            # (services/web/pkg/config/defaults/defaultconfig.go:99) - no refresh token in sight, so
            # the browser gets logged out on every access-token expiry and it looks like the session
            # is broken. offline_access is matched by the scope mapping in the blueprint.
            - name: WEB_OIDC_SCOPE
              value: openid profile email offline_access
            # Users arrive in oCIS on their first successful authentik login instead of being created
            # by hand. PROXY_AUTOPROVISION_CLAIM_* default to preferred_username / email / name, which
            # is what authentik's email + profile scope mappings emit.
            - name: PROXY_AUTOPROVISION_ACCOUNTS
              value: "true"
            - name: PROXY_AUTOPROVISION_CLAIM_GROUPS
              value: groups
            # Desktop/Android/iOS discover the IdP through /.well-known; without this they are
            # pointed at oCIS's own built-in issuer, which no longer has their credentials.
            - name: PROXY_OIDC_REWRITE_WELLKNOWN
              value: "true"
            # Upstream's own external-IdP reference sets exactly this pair
            # (deployments/examples/ocis_keycloak/docker-compose.yml) and they are the compiled
            # defaults (services/proxy/pkg/config/defaults/defaultconfig.go:86-87). Spelled out so
            # the identity key is visible in git. Cost: renaming someone in authentik makes oCIS see
            # a new account and the old one keeps its files - see the blueprint header.
            - name: PROXY_USER_OIDC_CLAIM
              value: preferred_username
            - name: PROXY_USER_CS3_CLAIM
              value: username
            # authentik mints JWT access tokens and the proxy verifies them by default
            # (services/proxy/pkg/config/defaults/defaultconfig.go:45). Pinning the audience means a
            # token issued to coder or Grafana on this same authentik cannot unlock oCIS. Exists from
            # 8.2.0; the image here is 8.2.2.
            - name: PROXY_OIDC_ACCESS_TOKEN_VERIFY_AUD
              value: ocis
            # --- S3 as primary storage -------------------------------------------------
            - name: STORAGE_USERS_DRIVER
              value: s3ng
            - name: STORAGE_SYSTEM_DRIVER
              value: ocis
            # Metadata tree only. Everything under here is index and node metadata; the bytes are
            # in the bucket.
            - name: STORAGE_USERS_S3NG_ROOT
              value: /var/lib/ocis/shares
            - name: STORAGE_USERS_S3NG_ENDPOINT
              # Casa's MinIO, reached over the WireGuard mesh. Deliberately http, not https: the
              # listener at 192.168.0.6:9000 serves plain HTTP (verified: /minio/health/live -> 200,
              # Server: MinIO), and the transport is already encrypted by WireGuard. Do not "fix"
              # this to https without checking the listener first.
              value: http://192.168.0.6:9000
            - name: STORAGE_USERS_S3NG_REGION
              # Matches what the server reports in X-Amz-Bucket-Region.
              value: eu-west-1
            - name: STORAGE_USERS_S3NG_BUCKET
              value: ocis-blobs
            - name: STORAGE_USERS_S3NG_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: ocis-secrets
                  key: s3-access-key
            - name: STORAGE_USERS_S3NG_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: ocis-secrets
                  key: s3-secret-key
            # --- WOPI / Collabora ------------------------------------------------------
            # Makes Collabora the default handler for office documents in the web UI.
            - name: FRONTEND_APP_HANDLER_SECURE_VIEW_APP_ADDR
              value: com.owncloud.api.collaboration.CollaboraOnline
            - name: GRAPH_AVAILABLE_ROLES
              value: "b1e2218d-eef8-4d4c-b82d-0f1a1b48f3b5,a8d5fe5e-96e3-418d-825b-534dbdf22b99,fb6c3e19-e378-47e5-b277-9732f9de6e21,58c63c02-1d89-4572-916a-870abc5a1b7d,2d00ce52-1fc2-4dbc-8b95-a73b73395f5a,1c996275-f1c9-4e71-abdf-a42f6495e960,312c0871-5ef7-4b3a-85b6-0e4074c64049,aa97fe03-7980-45ac-9e50-b325749fd7e6"
          ports:
            - name: proxy
              containerPort: 9200
            - name: proxy-debug
              containerPort: 9205
          # /readyz on the debug server. Probing 9200 was wrong twice over: the path does not exist
          # there, and the listener was TLS.
          readinessProbe:
            httpGet:
              path: /readyz
              port: 9205
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 10
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/ocis
            - name: csp
              mountPath: /etc/ocis/csp
              readOnly: true
        - name: collaboration
          image: owncloud/ocis:8.2.2
          # The image entrypoint is the `ocis` binary, so these args produce
          # `ocis collaboration server`.
          args:
            - collaboration
            - server
          env:
            # The collaboration service validates exactly three things: JWT secret, WOPI secret and
            # WOPI src (services/collaboration/pkg/config/parser/parse.go:40-48). The first reconcile
            # died on the missing secret.
            - name: COLLABORATION_WOPI_SECRET
              valueFrom:
                secretKeyRef:
                  name: ocis-secrets
                  key: wopi-secret
            - name: COLLABORATION_GRPC_ADDR
              value: "127.0.0.1:9301"
            - name: COLLABORATION_HTTP_ADDR
              value: "0.0.0.0:9300"
            # The supervised `ocis server` in this same pod embeds NATS and holds the registry.
            - name: MICRO_REGISTRY
              value: nats-js-kv
            - name: MICRO_REGISTRY_ADDRESS
              value: "127.0.0.1:9233"
            # WOPISrc, i.e. the URL Collabora calls back into. It stays inside the cluster: the
            # browser only ever talks to collabora.titan.arrieta.eu, and Collabora reaches this
            # service over cluster DNS. No ingress is published for it on purpose.
            - name: COLLABORATION_WOPI_SRC
              value: http://ocis-collaboration:9300
            - name: COLLABORATION_APP_NAME
              value: CollaboraOnline
            - name: COLLABORATION_APP_PRODUCT
              value: Collabora
            - name: COLLABORATION_APP_ADDR
              value: https://collabora.titan.arrieta.eu
            - name: COLLABORATION_APP_ICON
              value: https://collabora.titan.arrieta.eu/favicon.ico
            - name: COLLABORATION_APP_INSECURE
              value: "false"
            - name: COLLABORATION_CS3API_DATAGATEWAY_INSECURE
              value: "true"
            - name: COLLABORATION_LOG_LEVEL
              value: info
            - name: OCIS_URL
              value: https://files.titan.arrieta.eu
            - name: OCIS_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ocis-secrets
                  key: jwt-secret
          ports:
            - name: wopi
              containerPort: 9300
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ocis-data
        - name: csp
          configMap:
            name: ocis-csp
# HONEST LIMITS, read before trusting this file.
# 1. The blobs live in casa's MinIO, across the WireGuard link. If the mesh drops, the web UI still
#    renders from the local metadata tree and every file body fails. That is the failure mode, not a
#    crash loop, so nothing here will look unhealthy.
# 2. Nothing in this repo backs up either half. titan backs up the CNPG Postgres and nothing else -
#    the generic PV stream is still deferred - so this PVC has no restore point, and casa has no
#    MinIO runbook. Before this holds anything you care about, one of those has to change.
# 3. THERE IS NO CNPG OPTION HERE, and this was checked rather than assumed. oCIS vendors only
#    go-sql-driver/mysql and mattn/go-sqlite3 - no lib/pq, no pgx - so it cannot connect to Postgres
#    at any configuration. Verified against owncloud/ocis master and the 8.2 service env-var docs,
#    where postgres/sql/dsn appear zero times. Persistent state is instead:
#      - decomposedfs metadata + SQLite stores, on the PVC mounted here (STORAGE_USERS_S3NG_ROOT)
#      - NATS JetStream KV, embedded in `ocis server`, also on that PVC (OCIS_PERSISTENT_STORE_*)
#      - the idp keys, also on that PVC
#    Which means the backup unit is {this PVC} + {the bucket}, and they have to be taken together:
#    the metadata tree addresses blobs by UUID, so restoring a newer tree onto an older bucket (or
#    the reverse) yields a tree full of nodes whose content is gone, and the UI will render it
#    happily.
# 4. With authentik as the IdP, the local OCIS_ADMIN_USER above can no longer sign in through the web
#    UI - login redirects to authentik and authentik has no account by that name. The account still
#    exists and the CLI still works, so the first authentik user gets promoted by hand:
#      kubectl -n files exec deploy/ocis -c ocis -- ocis user role set <user-id> admin
#    Doing it declaratively from a group is possible but not via env: PROXY_ROLE_ASSIGNMENT's
#    role_mapping is config-file-only (services/proxy/pkg/config/config.go:164), so it would need a
#    mounted proxy config.yaml for one grant. Not worth a second config surface until there is a
#    second admin. A restore that is internally inconsistent is worse than no restore.
---
apiVersion: v1
kind: Service
metadata:
  name: ocis
  namespace: files
spec:
  selector:
    app: ocis
  ports:
    - name: proxy
      port: 9200
      targetPort: proxy
---
# Internal only: this is the WOPI endpoint Collabora calls. It is deliberately not exposed.
apiVersion: v1
kind: Service
metadata:
  name: ocis-collaboration
  namespace: files
spec:
  selector:
    app: ocis
  ports:
    - name: wopi
      port: 9300
      targetPort: wopi
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ocis
  namespace: files
spec:
  ingressClassName: traefik
  rules:
    - host: files.titan.arrieta.eu
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ocis
                port:
                  name: proxy
  tls:
    - hosts:
        - files.titan.arrieta.eu
      # Reflected into `files` by Reflector; the allow-list lives in
      # apply/40-certificates/titan-wildcard.yaml and has to name this namespace.
      secretName: titan-tls

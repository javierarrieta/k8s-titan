---
# Disk Free Space dashboard JSON
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-disk-dashboard
  namespace: observability
  labels:
    app: grafana
    grafana_dashboard: "true"
data:
  disk-free-space.json: |
    {
      "id": null,
      "uid": "disk-free-space",
      "title": "Disk Free Space",
      "tags": [
        "disk",
        "node-exporter"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "timepicker": {
        "refresh_intervals": [
          "30s",
          "1m",
          "5m",
          "15m",
          "30m",
          "1h",
          "6h",
          "12h",
          "24h"
        ],
        "time_options": [
          "5m",
          "15m",
          "1h",
          "6h",
          "12h",
          "24h",
          "2d",
          "7d",
          "30d"
        ]
      },
      "description": "All panels use node_filesystem_avail_bytes -- space applications can actually write, EXCLUDING the root-reserved block pool (ext4 default ~5%). This matches the DiskSpaceLow alert and the kubelet's nodefs.available eviction basis. Per-instance panels use min by (instance) so the worst filesystem surfaces instead of being averaged away; the Overview row still shows avg/min/max explicitly. /nix/store shares a device with / on every node and is a duplicate view, not extra capacity.",
      "style": "dark",
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "label": "Datasource",
            "query": "prometheus",
            "current": {
              "text": "Prometheus",
              "value": "Prometheus"
            },
            "hide": 0,
            "includeTime": false,
            "multi": false,
            "refresh": 1,
            "regex": "",
            "skipUrlSync": false,
            "typeaheadQuery": "",
            "useTags": false
          },
          {
            "name": "instance",
            "type": "query",
            "label": "Instance",
            "datasource": {
              "type": "prometheus",
              "uid": "$datasource"
            },
            "query": "label_values(node_filesystem_free_bytes, instance)",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "hide": 0,
            "includeTime": false,
            "multi": true,
            "allValue": ".*",
            "refresh": 1,
            "regex": "",
            "skipUrlSync": false
          },
          {
            "name": "mountpoint",
            "type": "query",
            "label": "Mountpoint",
            "datasource": {
              "type": "prometheus",
              "uid": "$datasource"
            },
            "query": "label_values(node_filesystem_free_bytes{fstype!~\"tmpfs|ramfs|nullfs\"}, mountpoint)",
            "current": {
              "text": "/",
              "value": "/"
            },
            "hide": 0,
            "includeTime": false,
            "multi": true,
            "allValue": ".*",
            "refresh": 1,
            "regex": "",
            "skipUrlSync": false
          }
        ]
      },
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "prometheus",
              "uid": "$datasource"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Deployments",
            "type": "dashboard"
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Overview",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "collapsed": false
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Avg Disk Available % (all mounts)",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "targets": [
            {
              "expr": "avg by (instance) (node_filesystem_avail_bytes{instance=~\"$instance\",mountpoint=~\"$mountpoint\",fstype!~\"tmpfs|ramfs|nullfs\"} / node_filesystem_size_bytes{instance=~\"$instance\",mountpoint=~\"$mountpoint\",fstype!~\"tmpfs|ramfs|nullfs\"} * 100)",
              "format": "time_series",
              "instant": true,
              "legendFormat": "{{instance}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 20
                  },
                  {
                    "color": "yellow",
                    "value": 50
                  },
                  {
                    "color": "green",
                    "value": 80
                  }
                ]
              },
              "unit": "percent",
              "displayName": "Free %"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "fields": "",
              "calcs": [
                "lastNotNull"
              ],
              "values": false
            },
            "textMode": "auto"
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Min Disk Available % (worst mount)",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "targets": [
            {
              "expr": "min by (instance) (node_filesystem_avail_bytes{instance=~\"$instance\",mountpoint=~\"$mountpoint\",fstype!~\"tmpfs|ramfs|nullfs\"} / node_filesystem_size_bytes{instance=~\"$instance\",mountpoint=~\"$mountpoint\",fstype!~\"tmpfs|ramfs|nullfs\"} * 100)",
              "format": "time_series",
              "instant": true,
              "legendFormat": "{{instance}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 20
                  },
                  {
                    "color": "yellow",
                    "value": 50
                  },
                  {
                    "color": "green",
                    "value": 80
                  }
                ]
              },
              "unit": "percent",
              "displayName": "Min Free %"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "fields": "",
              "calcs": [
                "min"
              ],
              "values": false
            },
            "textMode": "auto"
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Max Disk Available %",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "targets": [
            {
              "expr": "max by (instance) (node_filesystem_avail_bytes{instance=~\"$instance\",mountpoint=~\"$mountpoint\",fstype!~\"tmpfs|ramfs|nullfs\"} / node_filesystem_size_bytes{instance=~\"$instance\",mountpoint=~\"$mountpoint\",fstype!~\"tmpfs|ramfs|nullfs\"} * 100)",
              "format": "time_series",
              "instant": true,
              "legendFormat": "{{instance}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 20
                  },
                  {
                    "color": "yellow",
                    "value": 50
                  },
                  {
                    "color": "green",
                    "value": 80
                  }
                ]
              },
              "unit": "percent",
              "displayName": "Max Free %"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "fields": "",
              "calcs": [
                "max"
              ],
              "values": false
            },
            "textMode": "auto"
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Hosts Monitored",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "targets": [
            {
              "expr": "count(count by (instance) (node_filesystem_avail_bytes{instance=~\"$instance\",mountpoint=~\"$mountpoint\",fstype!~\"tmpfs|ramfs|nullfs\"}))",
              "format": "table",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "short",
              "displayName": "Hosts"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "fields": "",
              "calcs": [
                "lastNotNull"
              ],
              "values": false
            },
            "textMode": "auto"
          }
        },
        {
          "id": 6,
          "type": "row",
          "title": "Per-Instance Free Space",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 5
          },
          "collapsed": false
        },
        {
          "id": 7,
          "type": "bargauge",
          "title": "Disk Available % by Instance (worst filesystem per node)",
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 6
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "targets": [
            {
              "expr": "min by (instance) (node_filesystem_avail_bytes{instance=~\"$instance\",mountpoint=~\"$mountpoint\",fstype!~\"tmpfs|ramfs|nullfs\"} / node_filesystem_size_bytes{instance=~\"$instance\",mountpoint=~\"$mountpoint\",fstype!~\"tmpfs|ramfs|nullfs\"} * 100)",
              "format": "time_series",
              "instant": true,
              "legendFormat": "{{instance}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 20
                  },
                  {
                    "color": "yellow",
                    "value": 50
                  },
                  {
                    "color": "green",
                    "value": 80
                  }
                ]
              },
              "unit": "percent"
            },
            "overrides": []
          },
          "options": {
            "displayMode": "gradient",
            "orientation": "horizontal",
            "reduceOptions": {
              "fields": "",
              "calcs": [
                "lastNotNull"
              ],
              "values": false
            },
            "text": {}
          }
        },
        {
          "id": 8,
          "type": "table",
          "title": "Disk Available % Details (per mountpoint)",
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 6
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "targets": [
            {
              "expr": "node_filesystem_avail_bytes{instance=~\"$instance\",mountpoint=~\"$mountpoint\",fstype!~\"tmpfs|ramfs|nullfs\"} / node_filesystem_size_bytes{instance=~\"$instance\",mountpoint=~\"$mountpoint\",fstype!~\"tmpfs|ramfs|nullfs\"} * 100",
              "format": "table",
              "instant": true,
              "legendFormat": "{{instance}} - {{mountpoint}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "inspect": false
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 20
                  },
                  {
                    "color": "yellow",
                    "value": 50
                  },
                  {
                    "color": "green",
                    "value": 80
                  }
                ]
              },
              "unit": "percent",
              "displayName": "Free %"
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "instance"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Instance"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "mountpoint"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Mountpoint"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "fstype"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "FS Type"
                  }
                ]
              }
            ]
          },
          "options": {
            "showHeader": true,
            "sortBy": [
              {
                "desc": true,
                "displayName": "Free %"
              }
            ]
          }
        },
        {
          "id": 11,
          "type": "table",
          "title": "Disk Available % Summary (worst filesystem per node)",
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 6
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "targets": [
            {
              "expr": "min by (instance) (node_filesystem_avail_bytes{instance=~\"$instance\",mountpoint=~\"$mountpoint\",fstype!~\"tmpfs|ramfs|nullfs\"} / node_filesystem_size_bytes{instance=~\"$instance\",mountpoint=~\"$mountpoint\",fstype!~\"tmpfs|ramfs|nullfs\"} * 100)",
              "format": "table",
              "instant": true
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "includeByName": {},
                "indexByName": {},
                "renameByName": {
                  "Value": "Free %"
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "color-background"
                },
                "inspect": false
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 30
                  },
                  {
                    "color": "yellow",
                    "value": 50
                  },
                  {
                    "color": "green",
                    "value": 80
                  }
                ]
              },
              "unit": "percent"
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "instance"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Instance"
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "auto"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "showHeader": true,
            "sortBy": [
              {
                "desc": false,
                "displayName": "Free %"
              }
            ]
          }
        },
        {
          "id": 9,
          "type": "row",
          "title": "Disk Free Space Over Time",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 14
          },
          "collapsed": false
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Disk Available % Over Time (worst filesystem per node)",
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 15
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "targets": [
            {
              "expr": "min by (instance) (node_filesystem_avail_bytes{instance=~\"$instance\",mountpoint=~\"$mountpoint\",fstype!~\"tmpfs|ramfs|nullfs\"} / node_filesystem_size_bytes{instance=~\"$instance\",mountpoint=~\"$mountpoint\",fstype!~\"tmpfs|ramfs|nullfs\"} * 100)",
              "format": "time_series",
              "legendFormat": "{{instance}} - {{mountpoint}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 20
                  },
                  {
                    "color": "yellow",
                    "value": 50
                  },
                  {
                    "color": "green",
                    "value": 80
                  }
                ]
              },
              "unit": "percent"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "calcs": [
                "lastNotNull",
                "min",
                "max",
                "mean"
              ],
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            },
            "drawStyle": "line",
            "lineInterpolation": "linear",
            "barWidth": 0,
            "fillOpacity": 20,
            "gradientMode": "none",
            "pointSize": 5,
            "scaleDistribution": {
              "type": "linear"
            },
            "hideFrom": {
              "tooltip": false,
              "viz": false,
              "legend": false
            },
            "stacking": {
              "group": "A",
              "mode": "none"
            }
          }
        }
      ]
    }

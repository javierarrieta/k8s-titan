# Comin dashboard JSON
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-comin-dashboard
  namespace: observability
  labels:
    app: grafana
    grafana_dashboard: "true"
data:
  comin-overview.json: |
    {
      "id": null,
      "uid": "comin-overview",
      "title": "Comin Overview",
      "tags": ["comin", "nixos", "gitops"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 11,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "timepicker": {
        "refresh_intervals": ["30s", "1m", "5m", "15m", "30m", "1h", "6h", "12h", "24h"],
        "time_options": ["5m", "15m", "1h", "6h", "12h", "24h", "2d", "7d", "30d"]
      },
      "description": "Dashboard for monitoring comin (NixOS GitOps) deployment agents. Action Required leads with fleet-wide stats (deployment/build/eval failed, suspended, need reboot), then two bands of per-host tables: deploy-pipeline failures (deployment, build, eval) and host/operator state (needs-reboot, suspended, deployer-suspended, pending reboot-confirmation). Instance Status shows the full status matrix per host; Active Deployment, Fetch Status, and Build cover the deployment pipeline.",
      "style": "dark",
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "label": "Datasource",
            "query": "prometheus",
            "current": {
              "text": "Prometheus",
              "value": "Prometheus"
            },
            "hide": 0,
            "includeTime": false,
            "multi": false,
            "refresh": 1,
            "regex": "",
            "skipUrlSync": false,
            "typeaheadQuery": "",
             "useTags": false
           }
         ]
      },
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "prometheus",
              "uid": "$datasource"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Deployments",
            "type": "dashboard"
          }
        ]
      },
      "panels": [
        {
          "id": 23,
          "type": "row",
          "title": "Action Required",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "collapsed": false
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Last Deployment Failed",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "targets": [
            {
              "expr": "max(comin_last_deployment_failed)",
              "format": "table",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "OK"
                    },
                    "1": {
                      "text": "Failed"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "fields": "",
              "calcs": ["lastNotNull"],
              "values": false
            },
            "textMode": "auto"
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Last Build Failed",
          "gridPos": {
            "h": 4,

        {
          "id": 32,
          "type": "table",
          "title": "Eval Failed",
          "description": "Instances where comin_last_eval_failed == 1. The Nix evaluation of the new configuration failed, so there is nothing to build or activate and the host stays pinned to its last good generation. This fails one stage earlier than Build Failed and is usually a config/flake error rather than a host problem. Alert: CominEvalFailed (warning, for: 5m). Empty table = every agent evaluated its latest config successfully. Per-host detail: journalctl -u comin -b on the host.",
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 16,
            "y": 5

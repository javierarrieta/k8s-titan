        {
          "id": 33,
          "type": "table",
          "title": "Deployer Suspended",
          "description": "Instances where comin_deployer_suspended == 1 — the deployer-level suspend the health gate raises when a post-deploy check fails. Unlike a failed build this does NOT self-heal; the deployer stays down until a human clears it. Distinct from comin_is_suspended (manager-level), which is the separate Suspended panel. Alert: CominDeployerSuspended (critical, for: 10m). SOURCE: this metric comes from the node_exporter textfile probe (/var/lib/node-exporter/textfiles/comin.prom), NOT from comin's own :4243 exporter -- so it appears on each host's node_exporter target and on no comin.devices target. All 13 comin hosts report it: the 12 LAN hosts plus titan (192.168.133.1:9100, job casa.hosts). An earlier note here said only 8 of 12 reported it and that the Pis and .29 emitted no series; that predates comin-health-gate.nix shipping the probe fleet-wide and is stale. Value 2 means the probe itself could not read comin status (CominProbeBroken, warning) and is excluded by the == 1 filter.",
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 12,
            "y": 11
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "targets": [
            {
              "expr": "label_replace(comin_deployer_suspended == 1, 'instance', '$1', 'instance', '(.+):[0-9]+')",
              "format": "table",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "Active",
                      "color": "green"
                    },
                    "1": {
                      "text": "Suspended",
                      "color": "red"
                    }
                  }
                }
              ],
              "thresholds": {

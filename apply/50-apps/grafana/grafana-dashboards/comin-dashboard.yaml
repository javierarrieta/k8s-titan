              }
            ]
          },
          "options": {
            "showHeader": true,
            "sortBy": [
              {
                "desc": false,
                "displayName": "instance"
              }
            ]
          }
        },
        {
          "id": 27,
          "type": "table",
          "title": "Suspended",
          "description": "Instances where comin_is_suspended == 1. Comin will not fetch, build, or deploy on these hosts until it is resumed (systemctl restart comin, or clear the suspend flag). Empty table = no host is suspended.",

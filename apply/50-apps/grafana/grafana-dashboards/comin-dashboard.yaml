        {
          "id": 30,
          "type": "stat",
          "title": "Agents Online",
          "description": "Comin agents currently reporting to Prometheus. 12 targets are configured in the comin-devices ScrapeConfig (apply/50-apps/monitoring/prom-scrapes.yaml) and the green threshold encodes that expected fleet size, so update it when the fleet changes. A host that is powered off or has comin stopped shows up here as missing; see the CominHostsDownNeedingRestart alert.",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 20,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "targets": [
            {
              "expr": "count(up{job=\"comin.devices\"} == 1) or on() vector(0)",
              "format": "table",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 11
                  },
                  {
                    "color": "green",
                    "value": 12
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "fields": "",
              "calcs": [
                "lastNotNull"
              ],
              "values": false
            },
            "textMode": "value"
          }
        },
        {
          "id": 25,
          "type": "table",
          "title": "Needs Reboot",
          "description": "Instances where comin_need_to_reboot == 1. Empty table = nothing needs a reboot.",
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 0,
            "y": 11
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "targets": [
            {
              "expr": "label_replace(comin_need_to_reboot == 1, 'instance', '$1', 'instance', '(.+):[0-9]+')",
              "format": "table",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "OK",
                      "color": "green"
                    },
                    "1": {
                      "text": "Reboot required",
                      "color": "red"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "__name__"
                },
                "properties": [
                  {
                    "id": "custom.hidden",
                    "value": true
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "job"
                },
                "properties": [
                  {
                    "id": "custom.hidden",
                    "value": true
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "instance"
                },
                "properties": [

        {
          "id": 31,
          "type": "table",
          "title": "Build Failed",
          "description": "Instances where comin_last_build_failed == 1. The agent could not build the new configuration, so nothing new was activated on that host — it keeps running the previous generation while comin reports the last attempt as failed. Alert: CominBuildFailed (warning, for: 5m). Empty table = every agent built its latest config successfully. Per-host detail: journalctl -u comin -b on the host.",
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 8,
            "y": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "targets": [
            {
              "expr": "label_replace(comin_last_build_failed == 1, 'instance', '$1', 'instance', '(.+):[0-9]+')",
              "format": "table",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "OK",
                      "color": "green"
                    },
                    "1": {
                      "text": "Failed",
                      "color": "red"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",

# Alerts Overview dashboard JSON
#
# Reads the ALERTS / ALERTS_FOR_STATE series Prometheus already emits, so the
# "Right now" and "Trend and churn" halves work with no other change. The
# Alertmanager row needs the scrape added in
# apply/10-infra/monitoring/prometheus.yaml by the same PR -- it reads 0 until
# that lands.
#
# Wired the same way as every other dashboard here: this ConfigMap is mounted as
# a directory in apply/50-apps/casa/grafana.yaml and picked up by the provider
# entry in grafana-dashboard-provisioning.yaml. There is no Grafana sidecar, so
# all three have to agree; adding this file alone would show nothing.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerts-dashboard
  namespace: observability
  labels:
    app: grafana
    grafana_dashboard: "true"
data:
  alerts-overview.json: |
    {
      "id": null,
      "uid": "alerts-overview",
      "title": "Alerts Overview",
      "tags": [
        "alerts",
        "alertmanager",
        "prometheus"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "1m",
      "editable": true,
      "graphTooltip": 1,
      "style": "dark",
      "time": {
        "from": "now-7d",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "label": "Datasource",
            "query": "prometheus",
            "current": {
              "text": "Prometheus",
              "value": "Prometheus"
            },
            "hide": 0,
            "includeTime": false,
            "multi": false,
            "refresh": 1,
            "regex": "",
            "skipUrlSync": false,
            "typeaheadQuery": "",
            "useTags": false
          }
        ]
      },
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "prometheus",
              "uid": "$datasource"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Right now",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Critical firing",
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "refId": "A",
              "expr": "count(ALERTS{alertstate=\"firing\",severity=\"critical\"}) or vector(0)"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "description": "severity=\"critical\". Everything else on this dashboard is informational."
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Warning firing",
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "refId": "A",
              "expr": "count(ALERTS{alertstate=\"firing\",severity=\"warning\"}) or vector(0)"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Info firing",
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 8,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "refId": "A",
              "expr": "count(ALERTS{alertstate=\"firing\",severity=\"info\"}) or vector(0)"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Distinct alerts",
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 12,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "refId": "A",
              "expr": "count(count by (alertname) (ALERTS{alertstate=\"firing\"})) or vector(0)"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "description": "Distinct alertnames vs total series. A gap between the two is one alert firing many times -- that is what Alertmanager groups, and what repeats to Discord."
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Active silences",
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 16,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "refId": "A",
              "expr": "sum(alertmanager_silences{state=\"active\"}) or vector(0)"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "description": "Needs the Alertmanager scrape (added in the same PR as this dashboard). Reads 0 until it lands."
        },
        {
          "id": 7,
          "type": "stat",
          "title": "Pending",
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 20,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "refId": "A",
              "expr": "count(ALERTS{alertstate=\"pending\"}) or vector(0)"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 8,
          "type": "row",
          "title": "What is firing, and for how long",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 5
          },
          "panels": []
        },
        {
          "id": 9,
          "type": "table",
          "title": "Every firing alert, longest first",
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "gridPos": {
            "h": 10,
            "w": 24,
            "x": 0,
            "y": 6
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "refId": "A",
              "expr": "sort_desc(time() - ALERTS_FOR_STATE)",
              "instant": true,
              "format": "table"
            }
          ],
          "description": "Duration is time() - ALERTS_FOR_STATE, i.e. how long the alert has actually been in its current state -- not how long it has been on your dashboard.",
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "filterable": true
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Value #A"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Firing for"
                  },
                  {
                    "id": "unit",
                    "value": "s"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "alertname"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Alert"
                  }
                ]
              }
            ]
          },
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "__name__": true
                },
                "indexByName": {},
                "renameByName": {
                  "alertname": "Alert",
                  "severity": "Severity",
                  "namespace": "Namespace",
                  "pod": "Pod",
                  "node": "Node",
                  "instance": "Instance",
                  "job": "Job",
                  "pvc": "PVC",
                  "receiver": "Receiver"
                }
              }
            }
          ]
        },
        {
          "id": 10,
          "type": "bargauge",
          "title": "Top 10 by time in state",
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 16
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "refId": "A",
              "expr": "topk(10, time() - ALERTS_FOR_STATE)"
            }
          ],
          "displayMode": "gradient",
          "orientation": "horizontal",
          "reduceOptions": {
            "calcs": [
              "lastNotNull"
            ],
            "fields": "",
            "values": false
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 11,
          "type": "row",
          "title": "Trend and churn",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 24
          },
          "panels": []
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "Total firing over time",
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 25
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "refId": "A",
              "expr": "count(ALERTS{alertstate=\"firing\"})"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 10
              }
            },
            "overrides": []
          }
        },
        {
          "id": 13,
          "type": "timeseries",
          "title": "By severity",
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 25
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "refId": "A",
              "expr": "count by (severity) (ALERTS{alertstate=\"firing\"})"
            }
          ],
          "legend": {
            "displayMode": "table",
            "placement": "right",
            "calcs": [
              "lastNotNull",
              "max"
            ]
          }
        },
        {
          "id": 14,
          "type": "timeseries",
          "title": "Top 10 alertnames",
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 33
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "refId": "A",
              "expr": "topk(10, count by (alertname) (ALERTS{alertstate=\"firing\"}))"
            }
          ],
          "legend": {
            "displayMode": "table",
            "placement": "right",
            "calcs": [
              "lastNotNull",
              "max"
            ]
          }
        },
        {
          "id": 15,
          "type": "timeseries",
          "title": "New alerts entering per hour",
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 33
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "refId": "A",
              "expr": "count(time() - ALERTS_FOR_STATE < 3600) or vector(0)"
            }
          ],
          "description": "Series whose current state began in the last hour. This is the churn metric: a chronically-firing alert sits at 0 here no matter how many notifications it generates, while a flapping one spikes.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "bars",
                "lineWidth": 1,
                "fillOpacity": 60
              }
            },
            "overrides": []
          }
        },
        {
          "id": 16,
          "type": "row",
          "title": "Alertmanager -- what it actually sent",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 41
          },
          "panels": []
        },
        {
          "id": 17,
          "type": "text",
          "title": "",
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "gridPos": {
            "h": 2,
            "w": 24,
            "x": 0,
            "y": 42
          },
          "targets": [],
          "options": {
            "mode": "markdown",
            "content": "These panels need Alertmanager's own metrics, which were **not being scraped at all** before this dashboard (the chart's ServiceMonitor lacked the `prometheus: prometheus-k8s` label this Prometheus selects on). If they are empty, that scrape has not landed yet."
          }
        },
        {
          "id": 18,
          "type": "stat",
          "title": "Notifications, 24h",
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 44
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "refId": "A",
              "expr": "sum(increase(alertmanager_notifications_total[24h])) or vector(0)"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "description": "The number the whole noise-reduction exercise was about. Before the scrape existed this had to be estimated from ALERTS history."
        },
        {
          "id": 19,
          "type": "stat",
          "title": "Failed sends, 24h",
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 44
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "refId": "A",
              "expr": "sum(increase(alertmanager_notifications_failed_total[24h])) or vector(0)"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 20,
          "type": "stat",
          "title": "Aggregation groups",
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 44
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "refId": "A",
              "expr": "max(alertmanager_dispatcher_aggregation_groups) or vector(0)"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "description": "How many groups Alertmanager is currently dispatching. Rising with nothing else firing means group_by is too wide."
        },
        {
          "id": 21,
          "type": "stat",
          "title": "Invalid alerts, 24h",
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 44
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "refId": "A",
              "expr": "sum(increase(alertmanager_alerts_invalid_total[24h])) or vector(0)"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "description": "Alerts Alertmanager rejected as malformed. Anything here is a producer bug you are not being told about."
        },
        {
          "id": 22,
          "type": "timeseries",
          "title": "Notifications by integration",
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 48
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "refId": "A",
              "expr": "sum by (integration) (rate(alertmanager_notifications_total[30m]))"
            }
          ],
          "description": "Labelled by integration (discord, webhook, ...), NOT by receiver name -- receiver_name only appears with --enable-feature=receiver-names-in-metrics. With one real receiver in this config that distinction does not matter.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 10
              }
            },
            "overrides": []
          }
        },
        {
          "id": 23,
          "type": "timeseries",
          "title": "Notifications suppressed, by reason",
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 48
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "refId": "A",
              "expr": "sum by (reason) (increase(alertmanager_notifications_suppressed_total[1h]))"

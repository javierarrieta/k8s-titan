---
# AMD GPU dashboard JSON
#
# Copied from ../k8s-casa apply/50-apps/casa/grafana-dashboards/amdgpu-dashboard.yaml and then
# diverged: this copy adds an "Inference" row (requests deferred/processing, KV cache tokens).
#
# THE "Daily tokens" PANEL SHOWS THE SAME NUMBERS AS CASA'S BOARD, BY CONSTRUCTION. Titan runs no
# Prometheus of its own -- apply/50-apps/grafana/grafana-datasources.yaml points Grafana at
# https://prometheus.local.arrieta.eu, casa's, over the OPNsense WireGuard peer. The panel queries
# job="halogen", which is the one engine at 192.168.0.29:8731 (llm01) that both clusters front:
# casa directly, titan through the llm.titan.arrieta.eu Endpoints in
# apply/50-apps/llm/llm.yaml. So this panel is a second view of one backend, not titan's own usage.
# Per-caller attribution is not available from metrics either way: these series carry no
# per-request labels.
#
# The counter split is easy to get backwards, so the proof is here rather than only in the panel
# description:
#
#   llamacpp:prompt_tokens_total          prompt tokens the engine actually processed
#   halogen:prompt_tokens_cached_total    prompt tokens the prompt cache covered
#   llamacpp:tokens_predicted_total       output tokens
#
# Total input is the sum of the first two. Measured 2026-11-07 against job="halogen": lifetime
# counter values 20.5 M processed against 622 M cached, from one process with one reset point, so
# prompt_tokens_total cannot include cached tokens -- it would have to be the larger of the two.
# halogen also exports halogen:cache_prompt_tokens_saved_total, a near-duplicate of
# prompt_tokens_cached_total (0.25% apart over 24h); this panel uses prompt_tokens_cached_total and
# should not be changed to mix the two.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-amdgpu-dashboard
  namespace: observability
  labels:
    app: grafana
    grafana_dashboard: "true"
data:
  amdgpu-dashboard.json: |

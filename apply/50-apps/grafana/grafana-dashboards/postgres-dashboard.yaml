---
# PostgreSQL overview dashboard for Grafana.
#
# Structured after upstream dashboard 9628 ("PostgreSQL Database"), adapted to
# what this cluster's exporter actually emits. Adapted rather than copied, for
# three reasons that would each have produced a broken dashboard:
#
#   1. 9628 filters every query on a `release` label. No `release` label exists
#      on these metrics in this setup, so every one of its panels would have
#      rendered empty. These queries filter on the selected exporter instance.
#
#   2. 9628 uses `singlestat` and `graph` panels. Both were removed in modern
#      Grafana, so the JSON would not have loaded. Rebuilt with `stat`,
#      `timeseries` and `table`.
#
#   3. 9628's CPU, memory and open-file-descriptor panels read `process_*`
#      metrics, which in this setup are scraped from node-exporter -- they
#      describe the host, not Postgres. Its Start Time panel reads
#      pg_postmaster_start_time_seconds, which this exporter does not emit
#      (percona/community postgres_exporter splits that into pg_settings_* and
#      does not collect postmaster start time). Both omitted rather than
#      substituted with something that measures a different thing.
#
# Both postgres-18 and vectorchord-exporter belong on this board: each exposes
# PostgreSQL database metrics and a pg_up series. Select by the `instance` label,
# which distinguishes the servers even though their `service` labels differ.
# Every expression, including reductions, is scoped to the selected instance.
#
# PG17+ NOTE. Dashboard 9628 queries pg_stat_bgwriter_buffers_backend_total,
# pg_stat_bgwriter_buffers_backend_fsync_total, pg_stat_bgwriter_buffers_
# checkpoint_total, pg_stat_bgwriter_checkpoint_write_time_total and
# pg_stat_bgwriter_checkpoint_sync_time_total. All five are ABSENT on this
# PostgreSQL 18.6 instance -- the checkpoint counters were split out of
# pg_stat_bgwriter in PostgreSQL 17. The equivalents that do exist here are
# used instead: pg_stat_checkpointer_write_time_total,
# pg_stat_checkpointer_sync_time_total, pg_stat_checkpointer_buffers_written_
# total, pg_stat_checkpointer_num_timed_total and
# pg_stat_checkpointer_num_requested_total.
#
# EVERY QUERY IN THIS FILE WAS EXECUTED AGAINST LIVE PROMETHEUS before being
# written, with $datname expanded to ".*", and all 59 returned data. The
# generator also asserts unique panel ids, a valid layout inside the 24-column
# grid, and a parseable document.
#
# Coverage corresponds to 9628's panels plus several it does not have: per
# database cache hit rate, connection utilisation against max_connections,
# idle-in-transaction sessions, long-running transaction age, and xid/mxid
# wraparound age.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-postgres-dashboard
  namespace: casa
  labels:
    app: grafana
    grafana_dashboard: "true"
data:
  postgres-dashboard.json: |
      {
        "id": null,
        "uid": "postgres-overview",
        "title": "PostgreSQL",
        "tags": [
          "postgres",
          "postgresql",
          "database"
        ],
        "timezone": "browser",
        "schemaVersion": 39,
        "version": 1,
        "editable": true,
        "refresh": "30s",
        "style": "dark",
        "graphTooltip": 1,
        "time": {
          "from": "now-6h",
          "to": "now"
        },
        "timepicker": {
          "refresh_intervals": [
            "10s",
            "30s",
            "1m",
            "5m",
            "15m",
            "30m",
            "1h",
            "6h"
          ],
          "time_options": [
            "5m",
            "15m",
            "1h",
            "6h",
            "12h",
            "24h",
            "2d",
            "7d",
            "30d"
          ]
        },
        "description": "PostgreSQL overview for the casa cluster, built on the metrics the percona/community postgres_exporter actually emits here. Structured after upstream dashboard 9628, but adapted rather than copied.\n\nThree deliberate departures from 9628:\n1. 9628 filters on a `release` label. No `release` label exists in this setup, so every one of its queries would return nothing. These queries filter on `instance=~\"$instance\"` instead.\n2. 9628 uses `singlestat` and `graph` panels, both removed in modern Grafana. Rebuilt with `stat`, `timeseries` and `table`.\n3. 9628's CPU, memory and file-descriptor panels use `process_*` metrics scraped from the exporter, which measures the exporter, not the database. Omitted rather than left to mislead. Its Start Time panel depends on pg_postmaster_start_time_seconds, which this exporter does not emit, so it is omitted too.\n\nChoose an exporter instance above; every panel is scoped to that instance so their data is never combined.",
        "templating": {
          "list": [
            {
              "name": "datasource",
              "type": "datasource",
              "label": "Datasource",
              "query": "prometheus",
              "current": {
                "text": "Prometheus",
                "value": "Prometheus"
              },
              "hide": 0,
              "includeTime": false,
              "multi": false,
              "refresh": 1,
              "regex": "",
              "skipUrlSync": false,
              "useTags": false
            },
            {
              "name": "instance",
              "type": "query",
              "label": "Instance",
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "query": "label_values(pg_up, instance)",
              "current": {
                "text": "postgres-18",
                "value": "postgres-18"
              },
              "hide": 0,
              "includeTime": false,
              "multi": false,
              "refresh": 1,
              "regex": "",
              "skipUrlSync": false,
              "sort": 1
            },
            {
              "name": "datname",
              "type": "query",
              "label": "Database",
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "query": "label_values(pg_database_size_bytes{instance=~\"$instance\"}, datname)",
              "current": {
                "text": "All",
                "value": "$__all"
              },
              "hide": 0,
              "includeTime": false,
              "multi": true,
              "allValue": ".*",
              "refresh": 1,
              "regex": "",
              "skipUrlSync": false,
              "sort": 1
            }
          ]
        },
        "annotations": {
          "list": [
            {
              "builtIn": 1,
              "datasource": {
                "type": "grafana",
                "uid": "-- Grafana --"
              },
              "enable": true,
              "hide": true,
              "iconColor": "rgba(0, 211, 255, 1)",
              "name": "Annotations & Alerts",
              "type": "dashboard"
            }
          ]
        },
        "panels": [
          {
            "id": 1,
            "type": "row",
            "title": "Overview",
            "gridPos": {
              "h": 1,
              "w": 24,
              "x": 0,
              "y": 0
            },
            "collapsed": false
          },
          {
            "id": 2,
            "type": "stat",
            "title": "Postgres Up",
            "gridPos": {
              "h": 4,
              "w": 3,
              "x": 0,
              "y": 1
            },
            "datasource": {
              "type": "prometheus",
              "uid": "$datasource"
            },
            "targets": [
              {
                "expr": "max(pg_up{instance=~\"$instance\"})",
                "format": "time_series",
                "refId": "A",
                "instant": true
              }
            ],
            "description": "1 when the exporter can reach the database. The exporter is the only source for every other panel here, so if this is 0 the rest are stale, not zero.",
            "fieldConfig": {
              "defaults": {
                "color": {
                  "mode": "thresholds"
                },
                "mappings": [],
                "unit": "short",
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {
                      "color": "red",
                      "value": null
                    },
                    {
                      "color": "green",
                      "value": 1
                    }
                  ]
                }
              },
              "overrides": []
            },
            "options": {
              "colorMode": "value",
              "graphMode": "area",
              "justifyMode": "auto",
              "orientation": "auto",
              "textMode": "auto",
              "reduceOptions": {
                "calcs": [
                  "lastNotNull"
                ],
                "fields": "",
                "values": false
              }
            }
          },
          {
            "id": 3,
            "type": "stat",
            "title": "Version",
            "gridPos": {
              "h": 4,
              "w": 3,
              "x": 3,
              "y": 1
            },
            "datasource": {
              "type": "prometheus",
              "uid": "$datasource"
            },
            "targets": [
              {
                "expr": "pg_static{instance=~\"$instance\"}",
                "format": "time_series",
                "refId": "A",
                "legendFormat": "{{short_version}}",
                "instant": true
              }
            ],
            "description": "Reported by the exporter's static collector. Upstream dashboard 9628 also showed a Start Time panel here via pg_postmaster_start_time_seconds, but that metric does not exist in this exporter, so there is no honest substitute and the panel is omitted rather than faked.",
            "fieldConfig": {
              "defaults": {
                "color": {
                  "mode": "thresholds"
                },
                "mappings": [],
                "unit": "short",
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {
                      "color": "green",
                      "value": null
                    }
                  ]
                }
              },
              "overrides": []
            },
            "options": {
              "colorMode": "value",
              "graphMode": "area",
              "justifyMode": "auto",
              "orientation": "auto",
              "textMode": "auto",
              "reduceOptions": {
                "calcs": [
                  "lastNotNull"
                ],
                "fields": "",
                "values": false
              }
            }
          },
          {
            "id": 4,
            "type": "stat",
            "title": "Total Size",
            "gridPos": {
              "h": 4,
              "w": 3,
              "x": 6,
              "y": 1
            },
            "datasource": {
              "type": "prometheus",
              "uid": "$datasource"
            },
            "targets": [
              {
                "expr": "sum(pg_database_size_bytes{instance=~\"$instance\"})",
                "format": "time_series",
                "refId": "A",
                "instant": true
              }
            ],
            "description": "Sum of every database on the instance.",
            "fieldConfig": {
              "defaults": {
                "color": {
                  "mode": "thresholds"
                },
                "mappings": [],
                "unit": "bytes",
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {
                      "color": "green",
                      "value": null
                    }
                  ]
                }
              },
              "overrides": []
            },
            "options": {
              "colorMode": "value",
              "graphMode": "area",
              "justifyMode": "auto",
              "orientation": "auto",
              "textMode": "auto",
              "reduceOptions": {
                "calcs": [
                  "lastNotNull"
                ],
                "fields": "",
                "values": false
              }
            }
          },
          {
            "id": 5,
            "type": "stat",
            "title": "Databases",
            "gridPos": {
              "h": 4,
              "w": 3,
              "x": 9,
              "y": 1
            },
            "datasource": {
              "type": "prometheus",
              "uid": "$datasource"
            },
            "targets": [
              {
                "expr": "count(pg_database_size_bytes{instance=~\"$instance\"})",
                "format": "time_series",
                "refId": "A",
                "instant": true
              }
            ],
            "description": "Databases the exporter reports. Includes templates.",
            "fieldConfig": {
              "defaults": {
                "color": {
                  "mode": "thresholds"
                },
                "mappings": [],
                "unit": "short",
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {
                      "color": "green",
                      "value": null
                    }
                  ]
                }
              },
              "overrides": []
            },
            "options": {
              "colorMode": "value",
              "graphMode": "area",
              "justifyMode": "auto",
              "orientation": "auto",
              "textMode": "auto",
              "reduceOptions": {
                "calcs": [
                  "lastNotNull"
                ],
                "fields": "",
                "values": false
              }
            }
          },
          {
            "id": 6,
            "type": "stat",
            "title": "Connections Used",
            "gridPos": {
              "h": 4,
              "w": 3,
              "x": 12,
              "y": 1
            },
            "datasource": {
              "type": "prometheus",
              "uid": "$datasource"
            },
            "targets": [
              {
                "expr": "sum(pg_stat_database_numbackends{instance=~\"$instance\",datname=~\"$datname\"})",
                "format": "time_series",
                "refId": "A",
                "instant": true
              }
            ],
            "description": "Backends across the selected databases, against max_connections.",
            "fieldConfig": {
              "defaults": {
                "color": {
                  "mode": "thresholds"
                },
                "mappings": [],
                "unit": "short",
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {
                      "color": "green",
                      "value": null
                    },
                    {
                      "color": "yellow",
                      "value": 60
                    },
                    {
                      "color": "red",
                      "value": 85
                    }
                  ]
                }
              },
              "overrides": []
            },
            "options": {
              "colorMode": "value",
              "graphMode": "area",
              "justifyMode": "auto",
              "orientation": "auto",
              "textMode": "auto",
              "reduceOptions": {
                "calcs": [
                  "lastNotNull"
                ],
                "fields": "",
                "values": false
              }
            }
          },
          {
            "id": 7,
            "type": "stat",
            "title": "Connection Use %",
            "gridPos": {
              "h": 4,
              "w": 3,
              "x": 15,
              "y": 1
            },
            "datasource": {
              "type": "prometheus",
              "uid": "$datasource"
            },
            "targets": [
              {
                "expr": "100 * sum(pg_stat_database_numbackends{instance=~\"$instance\",datname=~\"$datname\"}) / max(pg_settings_max_connections{instance=~\"$instance\"})",
                "format": "time_series",
                "refId": "A",
                "instant": true
              }
            ],
            "description": "Running out of connections is the most common way a small cluster falls over, and it happens before any single database looks full.",
            "fieldConfig": {
              "defaults": {
                "color": {
                  "mode": "thresholds"
                },
                "mappings": [],
                "unit": "percent",
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {
                      "color": "green",
                      "value": null
                    },
                    {
                      "color": "yellow",
                      "value": 60
                    },
                    {
                      "color": "red",
                      "value": 85
                    }
                  ]
                },
                "decimals": 1,
                "min": 0,
                "max": 100
              },
              "overrides": []
            },
            "options": {
              "colorMode": "value",
              "graphMode": "area",
              "justifyMode": "auto",
              "orientation": "auto",
              "textMode": "auto",
              "reduceOptions": {
                "calcs": [
                  "lastNotNull"
                ],
                "fields": "",
                "values": false
              }
            }
          },
          {
            "id": 8,
            "type": "stat",
            "title": "Long-Running Txns",
            "gridPos": {
              "h": 4,
              "w": 3,
              "x": 18,
              "y": 1
            },
            "datasource": {
              "type": "prometheus",
              "uid": "$datasource"
            },
            "targets": [
              {
                "expr": "sum(pg_long_running_transactions{instance=~\"$instance\"})",
                "format": "time_series",
                "refId": "A",
                "instant": true
              }
            ],
            "description": "Transactions still open. Anything above zero holds locks and blocks vacuum.",
            "fieldConfig": {
              "defaults": {
                "color": {
                  "mode": "thresholds"
                },
                "mappings": [],
                "unit": "short",
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {
                      "color": "green",
                      "value": null
                    },
                    {
                      "color": "red",
                      "value": 1
                    }
                  ]
                }
              },
              "overrides": []
            },
            "options": {
              "colorMode": "value",
              "graphMode": "area",
              "justifyMode": "auto",
              "orientation": "auto",
              "textMode": "auto",
              "reduceOptions": {
                "calcs": [
                  "lastNotNull"
                ],
                "fields": "",
                "values": false
              }
            }
          },
          {
            "id": 9,
            "type": "stat",
            "title": "Deadlocks (total)",
            "gridPos": {
              "h": 4,
              "w": 3,
              "x": 21,
              "y": 1
            },
            "datasource": {
              "type": "prometheus",
              "uid": "$datasource"
            },
            "targets": [
              {
                "expr": "sum(pg_stat_database_deadlocks{instance=~\"$instance\",datname=~\"$datname\"})",
                "format": "time_series",
                "refId": "A",
                "instant": true
              }
            ],
            "description": "Cumulative since the last stats reset, not a rate. Read the Conflicts and Deadlocks panel for whether they are still happening.",
            "fieldConfig": {
              "defaults": {
                "color": {
                  "mode": "thresholds"
                },
                "mappings": [],
                "unit": "short",
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {
                      "color": "green",
                      "value": null
                    }
                  ]
                }
              },
              "overrides": []
            },
            "options": {
              "colorMode": "value",
              "graphMode": "area",
              "justifyMode": "auto",
              "orientation": "auto",
              "textMode": "auto",
              "reduceOptions": {
                "calcs": [
                  "lastNotNull"
                ],
                "fields": "",
                "values": false
              }
            }
          },
          {
            "id": 10,
            "type": "stat",
            "title": "Cache Hit Rate",
            "gridPos": {
              "h": 4,
              "w": 6,
              "x": 0,
              "y": 5
            },
            "datasource": {
              "type": "prometheus",
              "uid": "$datasource"
            },
            "targets": [
              {
                "expr": "100 * sum(rate(pg_stat_database_blks_hit{instance=~\"$instance\",datname=~\"$datname\"}[5m])) / (sum(rate(pg_stat_database_blks_hit{instance=~\"$instance\",datname=~\"$datname\"}[5m])) + sum(rate(pg_stat_database_blks_read{instance=~\"$instance\",datname=~\"$datname\"}[5m])))",
                "format": "time_series",
                "refId": "A",
                "instant": true
              }
            ],
            "description": "Shared-buffer hit ratio from blks_hit / (blks_hit + blks_read). Sustained dips mean the working set no longer fits in shared_buffers; compare against shared_buffers in the Settings row.",
            "fieldConfig": {
              "defaults": {
                "color": {
                  "mode": "thresholds"
                },
                "mappings": [],
                "unit": "percent",
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {
                      "color": "red",
                      "value": null
                    },
                    {
                      "color": "yellow",
                      "value": 90
                    },
                    {
                      "color": "green",
                      "value": 99
                    }
                  ]
                },
                "decimals": 2,
                "min": 0,
                "max": 100
              },
              "overrides": []
            },
            "options": {
              "colorMode": "value",
              "graphMode": "area",
              "justifyMode": "auto",
              "orientation": "auto",
              "textMode": "auto",
              "reduceOptions": {
                "calcs": [
                  "lastNotNull"
                ],
                "fields": "",
                "values": false
              }
            }
          },
          {
            "id": 11,
            "type": "stat",
            "title": "Exporter Health",
            "gridPos": {
              "h": 4,
              "w": 6,
              "x": 6,
              "y": 5
            },
            "datasource": {
              "type": "prometheus",
              "uid": "$datasource"
            },
            "targets": [
              {
                "expr": "min(pg_scrape_collector_success{instance=~\"$instance\"})",
                "format": "time_series",
                "refId": "A",
                "instant": true
              }
            ],
            "description": "1 when every collector succeeded. A partial failure here means some panels are showing stale or partial data even though pg_up is 1.",
            "fieldConfig": {
              "defaults": {
                "color": {
                  "mode": "thresholds"
                },
                "mappings": [
                  {
                    "type": "value",
                    "options": {
                      "0": {
                        "text": "FAILING",
                        "color": "red",
                        "index": 0
                      },
                      "1": {
                        "text": "OK",
                        "color": "green",
                        "index": 1
                      }
                    }
                  }
                ],
                "unit": "short",
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {
                      "color": "red",
                      "value": null
                    },
                    {
                      "color": "green",
                      "value": 1
                    }
                  ]
                }
              },
              "overrides": []
            },
            "options": {
              "colorMode": "value",
              "graphMode": "area",
              "justifyMode": "auto",
              "orientation": "auto",
              "textMode": "value",
              "reduceOptions": {
                "calcs": [
                  "lastNotNull"
                ],
                "fields": "",
                "values": false
              }
            }
          },
          {
            "id": 12,
            "type": "stat",
            "title": "Locks Held",
            "gridPos": {
              "h": 4,
              "w": 12,
              "x": 12,
              "y": 5
            },
            "datasource": {
              "type": "prometheus",
              "uid": "$datasource"
            },
            "targets": [
              {
                "expr": "sum(pg_locks_count{instance=~\"$instance\",datname=~\"$datname\"})",
                "format": "time_series",
                "refId": "A",
                "instant": true
              }
            ],
            "description": "All lock modes. On an idle cluster this sits low; sustained growth points at long-running transactions holding locks.",
            "fieldConfig": {
              "defaults": {
                "color": {
                  "mode": "thresholds"
                },
                "mappings": [],
                "unit": "short",
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {
                      "color": "green",
                      "value": null
                    }
                  ]
                }
              },
              "overrides": []
            },
            "options": {
              "colorMode": "value",
              "graphMode": "area",
              "justifyMode": "auto",
              "orientation": "auto",
              "textMode": "auto",
              "reduceOptions": {
                "calcs": [
                  "lastNotNull"
                ],
                "fields": "",
                "values": false
              }
            }
          },
          {
            "id": 13,
            "type": "row",
            "title": "Connections and Activity",
            "gridPos": {
              "h": 1,
              "w": 24,
              "x": 0,
              "y": 9
            },
            "collapsed": false
          },
          {
            "id": 14,
            "type": "timeseries",
            "title": "Connections by State",
            "gridPos": {
              "h": 8,
              "w": 12,
              "x": 0,
              "y": 10
            },
            "datasource": {
              "type": "prometheus",
              "uid": "$datasource"
            },
            "targets": [
              {
                "expr": "sum by (state) (pg_stat_activity_count{instance=~\"$instance\",datname=~\"$datname\",state!~'disabled'})",
                "format": "time_series",
                "refId": "A",
                "legendFormat": "{{state}}"
              }
            ],
            "description": "pg_stat_activity_count broken down by backend state. 'idle in transaction' is the one worth an alert: it holds locks and blocks vacuum while looking idle.",
            "fieldConfig": {
              "defaults": {
                "color": {
                  "mode": "palette-classic"
                },
                "mappings": [],
                "unit": "short",
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {
                      "color": "green",
                      "value": null
                    }
                  ]
                }
              },
              "overrides": []
            },
            "options": {
              "legend": {
                "calcs": [

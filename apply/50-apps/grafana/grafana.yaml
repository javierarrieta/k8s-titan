# Grafana — the homelab's pane of glass.
#
# Design and every declined alternative: docs/superpowers/specs/2026-10-21-titan-grafana-design.md.
# The three things below are the ones that fail silently, so they are stated where the manifests are.
#
#   1. THE IMAGE IS grafana/grafana, NOT teslamate/grafana. The Tesla image (what casa and
#      tesla-boards both use) ships Tesla's dashboards and provisions a Postgres datasource from
#      DATABASE_*; neither is wanted here, and inheriting the image would inherit both.
#
#   2. OIDC IS THE ONLY GATE, AND THAT IS A DECISION, NOT AN OVERSIGHT. This host used to carry a
#      Traefik forwardAuth Middleware in front of Grafana's own OIDC. It was removed 2026-11-05
#      because the outpost cookie is only refreshed by a top-level navigation, so once it aged out
#      Traefik answered every panel poll with a 302 to authentik and the panels went "No data" while
#      the page still looked healthy — see docs/grafana-runbook.md §10. What gates the host now is
#      GF_AUTH_GENERIC_OAUTH_* plus the two authentik group bindings on the `observability`
#      application (titan-family, titan-grafana-admins), which refuse anyone outside them at the IdP
#      before a token exists. That is the same posture coder, open-webui, mealie and opencloud
#      already run, and `make ingress-auth` enforces that the omission is deliberate. The Ingress
#      pins router.entrypoints: websecure because Traefik here runs no HTTP->HTTPS redirect, so the
#      pin is what keeps cleartext :80 from serving this host now that no middleware does.
#      WHAT THIS COSTS: nothing in front of this host decides anything any more. It is not a widening —
#      the outpost resolved this host to the `tesla` application, whose three group bindings are a
#      superset of these two, so the admitted set is unchanged (runbook §10). But a mistake in these
#      two bindings now has nothing upstream of it. They live in
#      authentik/blueprints-observability.yaml (rendered into the sops Secret
#      apply/10-secrets/authentik-observability-blueprint.yaml), not in this manifest, and
#      `make observability-oidc-check` fails if they are absent, changed, or not `any`-mode.
#
#   3. THE SECRETS THIS envFrom'S ARRIVE IN TASK 3. Between the two commits the pod is Pending on a
#      missing Secret. That is a half-finished tree, not a broken one, and it resolves within the
#      same PR.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: observability
  # Deliberately NOT annotated, so apply/70-backup/ leaves this volume alone. The backup stage's
  # rule is "no annotation means git already has it", and here that is actually true, checked
  # rather than assumed: every provider in grafana-dashboard-provisioning.yaml sets
  # allowUiUpdates: false, the datasources are grafana-datasources.yaml, the local admin user and
  # password are in observability-grafana-admin.yaml, and the Admin role comes from the authentik
  # group claim in GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH. A wiped PVC therefore costs only
  # what someone built by hand in the UI -- an ad-hoc dashboard, a folder, an alert contact point,
  # an API key -- plus preferences and dashboard version history. Decided 2026-10-26: not worth a
  # nightly backup. Reversing it is one annotation line, but the observability runner was removed
  # with this decision, so it is three edits and `make backup-coverage` names the three.
spec:
  accessModes:
  - ReadWriteOnce
  # local-path-retain, the same class open-webui uses: it survives `kubectl delete pvc`, which
  # local-path does not.
  storageClassName: local-path-retain
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: observability
  annotations:
    # Does nothing until `observability` is in reloader's values.reloader.namespaces — Reloader does
    # not look at a namespace outside that list, and the annotation sitting inert is the recorded
    # promtail/open-webui defect. Both halves are in this PR; the comment is so the next person does
    # not delete the "useless" one.
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  # RWO PVC: a RollingUpdate schedules pod 2 while pod 1 still holds the volume and the new pod sits
  # Pending on a volume conflict forever. Recreate costs a few seconds of dashboards.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        # The official image's own USER is grafana at uid 472, gid 0, and Grafana's images keep gid 0
        # deliberately so a mounted PVC can be group-writable. Same reasoning tesla-boards records.
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 0
        fsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: grafana
        image: grafana/grafana:12.4.14@sha256:ae509d9ae8c1021ca32ec370a9ca975d40165eda9fccd1e1102d317ff8787cd7
        ports:
        - containerPort: 3000
          name: http
        envFrom:
        - secretRef:
            name: observability-grafana-admin
        - secretRef:
            name: observability-grafana-oidc
        env:
        # What Grafana puts in the links it generates itself, so it must be the hostname users
        # actually reach. The OIDC redirect below has to name this same host; make
        # observability-oidc-check fails if the two ever move apart.
        - name: GF_SERVER_ROOT_URL
          value: https://grafana.titan.arrieta.eu/
        - name: GF_SERVER_SERVE_FROM_SUB_PATH
          value: "false"
        - name: TZ
          value: UTC
        - name: GF_AUTH_ANONYMOUS_ENABLED
          value: "false"
        # Grafana's own signup form, separate from OIDC's allow_sign_up below. Off: accounts come
        # from authentik, not from whoever finds the form.
        - name: GF_USERS_ALLOW_SIGN_UP
          value: "false"
        - name: GF_ANALYTICS_REPORTING_ENABLED
          value: "false"
        - name: GF_ANALYTICS_CHECK_FOR_UPDATES
          value: "false"
        # --- single sign-on: Grafana delegates identity to authentik over OIDC ------------------
        # Endpoints from this instance's live discovery document, not from documentation: authorize,
        # token and userinfo are GLOBAL paths with no slug in them; only issuer and jwks carry the
        # slug. Composing `.../o/observability/authorize/` looks obvious and 404s.
        - name: GF_AUTH_GENERIC_OAUTH_ENABLED
          value: "true"
        - name: GF_AUTH_GENERIC_OAUTH_NAME
          value: authentik
        - name: GF_AUTH_GENERIC_OAUTH_AUTH_URL
          value: https://auth.titan.arrieta.eu/application/o/authorize/
        - name: GF_AUTH_GENERIC_OAUTH_TOKEN_URL
          value: https://auth.titan.arrieta.eu/application/o/token/
        - name: GF_AUTH_GENERIC_OAUTH_API_URL
          value: https://auth.titan.arrieta.eu/application/o/userinfo/
        # Without validate_id_token Grafana trusts an unverified id_token, which is a real weakening
        # now that nothing else stands in front of this host. It is not free: with it true and a wrong
        # jwk_set_url, authentication fails outright.
        - name: GF_AUTH_GENERIC_OAUTH_VALIDATE_ID_TOKEN
          value: "true"
        - name: GF_AUTH_GENERIC_OAUTH_JWK_SET_URL
          value: https://auth.titan.arrieta.eu/application/o/observability/jwks/
        # profile is load-bearing, not decoration: the `groups` claim exists only because authentik's
        # default profile scope mapping emits it. Drop it and the role expression below evaluates
        # against a missing claim and everyone silently lands as Viewer.
        - name: GF_AUTH_GENERIC_OAUTH_SCOPES
          value: openid email profile offline_access
        - name: GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH
          value: email
        - name: GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH
          value: preferred_username
        - name: GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH
          value: name
        # titan-grafana-admins -> Grafana Org Admin, everyone else Viewer. GrafanaAdmin (server
        # admin) is deliberately not granted.
        #
        # SWITCHED OFF `authentik Admins` on 2026-10-28, and the order was the point: the group was
        # seeded from `authentik Admins` FIRST (scripts/seed-authentik-group.sh, excluding the
        # break-glass account) and only then was this line changed. Switching first empties the
        # group, and this expression makes that silent - a miss is `&& 'Admin' || 'Viewer'`, so every
        # admin quietly becomes a Viewer behind a login page that still looks healthy. If a rebuilt
        # authentik ever loses the group, that is the symptom to expect, not an error.
        #
        # Two things this line cannot do: it reads the claim baked into the token AT LOGIN, so anyone
        # already signed in keeps their old groups until they re-authenticate; and it cannot see
        # group parentage - authentik's `groups` claim is the plain M2M, so a nested group does not
        # count here (see the header of apply/50-apps/auth/identity-blueprint.yaml).
        - name: GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH
          value: contains(groups[*], 'titan-grafana-admins') && 'Admin' || 'Viewer'
        - name: GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP
          value: "true"
        # KEPT true deliberately after the forwardAuth Middleware was removed 2026-11-05, and for a
        # different reason than the one written here before. This is now what turns an expired Grafana
        # session into a working page: a top-level navigation redirects silently through authentik and
        # comes back authenticated, which is what a browser tab left open for an hour needs. It is not
        # the thing deciding WHO gets in — the two group bindings on the `observability` application
        # are, and they answer before Grafana ever sees a token. With this false, an open tab stops
        # refreshing quietly and someone has to click a sign-in button to revive it.
        - name: GF_AUTH_GENERIC_OAUTH_AUTO_LOGIN
          value: "true"
        - name: GF_AUTH_GENERIC_OAUTH_USE_REFRESH_TOKEN
          value: "true"
        # THE ESCAPE HATCH — keep this true. If the OIDC config is ever wrong and basic auth is off,
        # the only way back in is editing the admin Secret and restarting the pod.
        - name: GF_AUTH_BASIC_ENABLED
          value: "true"
        volumeMounts:
        - name: data
          mountPath: /var/lib/grafana
        - name: datasources
          mountPath: /etc/grafana/provisioning/datasources
          readOnly: true
        - name: dashboard-provisioning
          mountPath: /etc/grafana/provisioning/dashboards
          readOnly: true
        - name: dashboards-node-exporter
          mountPath: /var/lib/grafana/dashboards/node-exporter
          readOnly: true
        - name: dashboards-postgres
          mountPath: /var/lib/grafana/dashboards/postgres
          readOnly: true
        - name: dashboards-comin
          mountPath: /var/lib/grafana/dashboards/comin
          readOnly: true
        - name: dashboards-disk
          mountPath: /var/lib/grafana/dashboards/disk
          readOnly: true
        - name: dashboards-alerts
          mountPath: /var/lib/grafana/dashboards/alerts
          readOnly: true
        - name: dashboards-amdgpu
          mountPath: /var/lib/grafana/dashboards/amdgpu
          readOnly: true
        - name: dashboards-security-scans
          mountPath: /var/lib/grafana/dashboards/security-scans
          readOnly: true
        livenessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: grafana-data
      - name: datasources
        configMap:
          name: grafana-datasources
      - name: dashboard-provisioning
        configMap:
          name: grafana-dashboard-provisioning
      - name: dashboards-node-exporter
        configMap:
          name: grafana-node-exporter-dashboard
      - name: dashboards-postgres
        configMap:
          name: grafana-postgres-dashboard
      - name: dashboards-comin
        configMap:
          name: grafana-comin-dashboard
      - name: dashboards-disk
        configMap:
          name: grafana-disk-dashboard
      - name: dashboards-alerts
        configMap:
          name: grafana-alerts-dashboard
      - name: dashboards-amdgpu
        configMap:
          name: grafana-amdgpu-dashboard
      - name: dashboards-security-scans
        configMap:
          name: grafana-security-scans-dashboard
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: observability
spec:
  selector:
    app: grafana
  ports:
  - name: http
    port: 80
    targetPort: http
---
# NO `router.middlewares` ON THIS INGRESS, AND THAT IS THE FIX, NOT AN OMISSION.
#
# There used to be a forwardAuth Middleware here pointing at authentik's embedded outpost. It worked
# — the host really was unreachable without an authentik session — and it also broke the dashboard on
# a timer. authentik refreshes its proxy cookie only when a browser follows a top-level navigation
# through the outpost. A dashboard does not navigate; it polls `/api/ds/query` by XHR every 30s, and
# an XHR cannot complete a cross-origin redirect to mint a cookie. So when the cookie aged out,
# Traefik answered EVERY poll with a 302 to auth.titan.arrieta.eu, the panel got HTML instead of
# JSON and rendered "No data", and only a full page reload — a real navigation — brought the data
# back. Measured in Traefik's own access log: 16 `/api/ds/query` requests answered 302 with Grafana
# logging nothing at all in that window, i.e. the pod never saw them. docs/grafana-runbook.md §10.
#
# Grafana's own OIDC below already gates this host, and authentik's two group bindings on the
# `observability` application decide who is admitted before a token exists. Keeping a second, proxy-
# side gate in front of an app that has real SSO is what produced the outage, so it is gone rather
# than tuned. Re-adding it is one annotation line — but read §10 first, because it will look like it
# fixed itself and then do this again an hour later.
#
# The absence is whitelisted in tools/ingress-auth-check.py `NOT_PROXY_GATED` with this reason, so
# `make ingress-auth` fails if the annotation ever comes back or the entry is dropped.
#
# THE PIN BELOW IS THE OTHER HALF OF REMOVING THE MIDDLEWARE. A Traefik middleware attaches to every
# router its Ingress produces, and an unpinned Ingress produces one per entrypoint — so the forwardAuth
# was also what kept this host off cleartext :80. Traefik here runs no HTTP->HTTPS redirect
# (apply/20-infra/traefik/traefik.yaml, the ports.web.http.redirections.entryPoint note, says so and
# records it as deliberate), and port 80 is published: measured before this change,
# http://grafana.titan.arrieta.eu/api/health answered. Without the pin, dropping the middleware would
# have left Grafana's unauthenticated endpoints — /api/health at minimum — readable over cleartext.
# This is the same reason llm and investing-agent pin. Cookies are not at risk either way
# (GF_AUTH_COOKIE_SECURE is Grafana's default, true), so this is about not serving anything in the
# clear, not about session theft.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: observability
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  rules:
  - host: grafana.titan.arrieta.eu
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: grafana
            port:
              number: 80
  tls:
  - hosts:
    - grafana.titan.arrieta.eu
    # Reflected from namespace `certificates` by Reflector. `observability` must be in the allow-list
    # on apply/40-certificates/titan-wildcard.yaml — step 4. Hand-copying this Secret is forbidden by
    # AGENTS.md.
    secretName: titan-tls

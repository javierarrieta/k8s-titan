# llm.titan.arrieta.eu — a second public front door for the LLM endpoint that has been
# llm.v.arrieta.eu on the techdelivery VPS since 2026-03. This is a DUPLICATE, not a migration:
# both clusters now serve the same backend with the same bearer token, and nothing here stops the
# VPS one. Design and the three accepted costs:
# docs/superpowers/specs/2026-10-24-titan-llm-endpoint-design.md.
#
# WHAT IS BEHIND IT: halogen-flash on the llm01 box, 192.168.0.29:8731 — 8731 is that service's
# own default port (halogen-flash-flake/nixos/module.nix), and the address is llm01's home-LAN
# address, not a mesh one. llm01 is deliberately NOT a member of the 192.168.133.0/24 mesh
# (nixos-configurations hosts/llm01/configuration.nix says so in its own words), so titan's only
# path to it is the OPNsense WireGuard peer, whose allowedIPs carry 192.168.0.0/24. That peer is a
# single point of failure for this hostname and is the reason the Service is an Endpoints-backed
# one rather than a mesh name: there is no second path to fall back to.
#
# VERIFIED BEFORE WRITING, not assumed: `curl http://192.168.0.29:8731/health` from this cluster
# returned 200 in 83 ms over that peer.
---
# A bare Endpoints with no selector, because the backend is a host outside the cluster. The endpoints
# controller only owns the Endpoints of a Service that HAS a selector, so nothing reconciles this one
# and nothing overwrites it; kube-proxy sits one step further downstream and only consumes the
# EndpointSlices mirrored from it.
#
# v1 Endpoints is deprecated in favour of discovery.k8s.io/v1beta1/v1 EndpointSlice and kubectl says
# so on every `get`. It is still the supported way to hand a Service a fixed address list, it is
# what the source cluster has run for 221 days, and hand-authoring an EndpointSlice (the
# `endpointslice.kubernetes.io/managed-by` label, the `kubernetes.io/service-name` link, the
# per-slice port duplication) is more machinery for the same two facts. Kept for parity with
# ../k8s-techdelivery apply/50-apps/apps/llm-chiclana.yaml, which is the file this duplicates.
apiVersion: v1
kind: Endpoints
metadata:
  name: llm01
  namespace: llm
subsets:
  - addresses:
      - ip: 192.168.0.29
    ports:
      - name: web
        port: 8731
---
# No selector, on purpose: with a selector the endpoints controller takes ownership of the Endpoints
# object and reconciles it against the pods that match, of which there are none, so it would empty the
# one above. Port 80 in, 8731 out, so the Ingress backend reads like every other Ingress in
# this tree.
apiVersion: v1
kind: Service
metadata:
  name: llm01
  namespace: llm
spec:
  ports:
    - name: web
      protocol: TCP
      port: 80
      targetPort: web
---
# The token check. Traefik has no native bearer-token matcher — basicAuth wants an htpasswd and a
# `Basic` scheme, and the clients here send `Authorization: Bearer <token>` — so the source cluster
# does it with a forwardAuth call to a throwaway nginx that answers 200 or 401. That is what this
# duplicates, because "same key" means the same `Authorization` header has to work here too.
#
# EXCEPT THE ONE COMPARISON LINE, WHICH IS NOT COPIED VERBATIM. Same header, same token, different
# operator: `~*` is a regex and the token is not a regex-safe string. Read the
# bearer-auth-nginx-config comment below before "restoring parity" with
# ../k8s-techdelivery apply/20-infra/auth/bearer-auth-middleware.yaml, which is itself broken.
#
# THE ONE LINE THAT DECIDES WHETHER THE AUTH IS ON AT ALL is the annotation on the Ingress at the
# bottom of this file. A router that references a middleware Traefik cannot resolve does not fail
# closed: it serves the route unauthenticated. Same shape as grafana's note in
# ../grafana/grafana.yaml, which calls its own middleware line the most important in its file.
#
# The token arrives as an env var from a Secret and is substituted into the nginx config at
# container start by envsubst, so BOTH halves need a pod restart to take a rotation — the env var
# because kubelet does not restart a pod when a Secret changes, and the config because it is
# rendered once at start. That is what the reloader annotation below is for, and it is inert unless
# `llm` is in apply/20-infra/reloader/reloader.yaml's namespace list. That list has bitten four
# times already (promtail, open-webui, grafana, mealie — the comments there record each one).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bearer-auth-service
  namespace: llm
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bearer-auth-service
  template:
    metadata:
      labels:
        app: bearer-auth-service
    spec:
      # Non-root, and the uid is read out of the image rather than remembered: its config carries
      # User=101, and the overlay layer owns /etc/nginx/conf.d as drwxrwxr-x 101/0 — which is exactly
      # what lets this container's own entrypoint write default.conf at start. That writability was
      # the stated reason for running the root image, and it turned out to hold for the unprivileged
      # one as well once the layers were opened instead of reasoned about. Same image and same
      # settings as apply/60-tesla/wellknown.yaml, which has been running them in this cluster.
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: bearer-auth-service
        # The image this file duplicates is nginx:1.31.6-alpine running as root, and parity was the
        # reason given for that. Parity is about the config and the comparison, not about the uid or
        # the nginx point release: the behaviour that has to match is `listen 8080` plus the token
        # check, and both are in this file's own ConfigMap.
        #
        # Pinned by digest rather than tag for the reason already recorded in this file about the
        # image it replaces — `nginxinc/nginx-unprivileged:1.31.7-alpine` has been re-published since
        # wellknown.yaml pinned it and now resolves to sha256:b5047b9b..., whose layer set is not the
        # one below. The digest pinned here is the one whose layers were actually opened:
        # /usr/bin/envsubst present, /etc/nginx/conf.d writable by uid 101, `pid /tmp/nginx.pid`, and
        # no `user` directive in the final nginx.conf. That last one is load-bearing — a `user`
        # directive is an emerg error when the master is not root, and the stock alpine nginx.conf in
        # an earlier layer does carry one, so it has to be the overlay's version that wins.
        image: nginxinc/nginx-unprivileged:1.31.7-alpine@sha256:378d0c32f6562f7fd9629170797f57d2b953aa09be983b3daaf4809bb039ca00
        ports:
        - containerPort: 8080
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        env:
        - name: BEARER_TOKEN
          valueFrom:
            secretKeyRef:
              name: llm-bearer-token
              key: TOKEN
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/templates
        - name: nginx-entrypoint
          mountPath: /docker-entrypoint.d
        # Overrides the image's own entrypoint. envsubst is given an explicit variable list so it
        # substitutes ONLY the token and leaves nginx's own $variables in the template alone —
        # unbounded envsubst would eat $http_authorization.
        command: ["/bin/sh", "/docker-entrypoint.d/entrypoint.sh"]
        # tcpSocket, not httpGet, and the reason is the entire purpose of this container: every path
        # on it answers 401 unless the header carries the token, and a probe sends no header. An
        # httpGet liveness or readiness probe therefore fails on a perfectly healthy pod and kubelet
        # crashloops its own auth server — a probe that asserts a credential is not a liveness check.
        # A TCP connect to 8080 is the only check that means "nginx is listening".
        #
        # The readiness half is what makes a token rotation safe. Reloader restarts this pod when the
        # Secret changes, and with no readiness gate the replacement is marked Ready the instant its
        # container starts, before nginx has bound 8080. Traefik then forwards an auth check into a
        # closed port, forwardAuth errors, and Traefik fails closed: every route on the hostname 502s
        # for that window with both pods looking fine. With a readiness probe the default
        # RollingUpdate policy holds the old pod until the new one is actually listening
        # (maxUnavailable rounds to 0 at replicas: 1, maxSurge to 1), so the swap is invisible.
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 5
          failureThreshold: 2
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          # The cpu limit is deliberate and stays, matching wellknown.yaml's house pattern. The
          # counter-argument is real — this container sits on the critical path of every request, so
          # CFS throttling would show up as unexplained p99 on the model rather than as a rejected
          # auth — but a forwardAuth that answers `return 200` or `return 401` without proxying is
          # cheap enough that 100m is not the binding constraint here. The memory limit is the one
          # worth keeping regardless: an OOM kill is loud, which is the property throttling lacks.
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
      volumes:
      - name: nginx-config
        configMap:
          name: bearer-auth-nginx-config
      - name: nginx-entrypoint
        configMap:
          name: bearer-auth-nginx-entrypoint
          defaultMode: 0755
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bearer-auth-nginx-entrypoint
  namespace: llm
data:
  entrypoint.sh: |
    #!/bin/sh
    envsubst '${BEARER_TOKEN}' < /etc/nginx/templates/default.conf.template > /etc/nginx/conf.d/default.conf
    exec nginx -g 'daemon off;'
---
# The comparison itself, and the one line where this file deliberately does NOT match the source it
# duplicates. The source has `~*`, a case-insensitive PCRE match with the token interpolated into the
# pattern. The token is 137 characters and contains `(`, `)` and `|`, with the `|` between the parens
# — so PCRE compiles an alternation group, the literal token is not one of the alternatives, and the
# correct credential can never match its own pattern.
#
# Measured on the live source endpoint, not reasoned about: `Authorization: Bearer <exact token>` →
# 401, while the same token with `( ) |` deleted → 200. So `llm.v.arrieta.eu` has been authenticating
# a string that is in neither repo, and the recorded token has never authenticated anything. That is
# the source's bug to fix, in its own change, once anyone knows what is holding the working string;
# it is not a reason to ship a front door here that rejects its own credential.
#
# `=` is a literal string compare, so every metacharacter in the token is inert and no rotation is
# needed to make the recorded credential the real one. That is the whole reason to change the
# operator rather than the token: the token was never the defect.
#
# `=` is case-sensitive, so the scheme word must be exactly `Bearer`. Every OpenAI-style client sends
# that. If one ever sends lowercase `bearer`, add a `map` with both spellings — legal in this file
# because conf.d is included in the http context — rather than going back to a regex over a value
# that contains regex metacharacters.
apiVersion: v1
kind: ConfigMap
metadata:
  name: bearer-auth-nginx-config
  namespace: llm
data:
  default.conf.template: |
    server {
      listen 8080;
      location / {
        if ($http_authorization = "Bearer ${BEARER_TOKEN}") {
          return 200;
        }
        return 401;
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: bearer-auth-service
  namespace: llm
spec:
  selector:
    app: bearer-auth-service
  ports:
  - port: 8080
    targetPort: 8080
---
# Deliberately in `llm`, NOT in the Traefik namespace the way the source has it in
# `traefik-system`. The source's own comment records that its cross-namespace reference
# (`traefik-system-bearer-auth@kubernetescrd`) works only because Traefik's
# `crossProviderNamespaces` is left unset, which is permissive by upstream default. On titan the
# Traefik is k3s-bundled and its configuration is not managed in this repo at all, so that
# permissiveness is not something this tree can prove — and the failure mode if it were ever
# tightened is an unauthenticated LLM endpoint that still looks healthy.
#
# Same-namespace is provable from the tree and is already what this cluster does:
# apply/50-apps/grafana/grafana.yaml references `observability-grafana-auth@kubernetescrd` from an
# Ingress in `observability`. Note that the forwardAuth ADDRESS below still crosses a namespace by
# plain URL, and grafana proves that works here too (its address is authentik's service in `auth`).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: bearer-auth
  namespace: llm
spec:
  forwardAuth:
    address: http://bearer-auth-service.llm.svc.cluster.local:8080
    trustForwardHeader: true
---
# Cleartext is refused here, not redirected, and that is a deliberate difference from the endpoint
# this file duplicates. Measured: `http://llm.v.arrieta.eu/health` answers `301` to the https URL,
# while titan has no scheme redirect at all — the traefik pod's args are `--entryPoints.web.address
# =:8000/tcp`, `--entryPoints.websecure.address=:8443/tcp` and `--entryPoints.websecure.http.tls
# =true` with no `web.redirect`, read out of the running pod in kube-system rather than from the
# record in apply/60-tesla/wellknown.yaml, which says the same. So an Ingress left on both entry
# points answers in cleartext; `http://tesla.titan.arrieta.eu/.well-known/...` returning `200` is
# that, proven. For a static public key that is harmless. Here the header being carried is a static
# bearer credential, so cleartext has to be closed on purpose.
#
# What this cannot do, and no Traefik configuration can: a client pointed at `http://` puts the token
# on the wire in plaintext before any middleware runs, because the request has to arrive before
# anything can judge it. What pinning the router to `websecure` changes is that such a request is not
# *served*. It gets `404` and someone fixes the URL, instead of working and never being fixed.
#
# Not a `redirectScheme` middleware, which is the friendlier-looking shape and worse here: clients
# that follow redirects re-send `Authorization` to the new URL, which papers over the wrong scheme
# completely — the caller succeeds and nobody ever learns the configured URL was http.
#
# The footgun is the string. A typo in the entry point name attaches this router to nothing and every
# route 404s silently, the same silent-total-failure class as a middleware reference to an object that
# does not exist. §5 of the spec catches it: both of its calls come back `404`.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: llm
  namespace: llm
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: llm-bearer-auth@kubernetescrd
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  rules:
  - host: llm.titan.arrieta.eu
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: llm01
            port:
              name: web
  tls:
  - hosts:
    - llm.titan.arrieta.eu
    # The cluster wildcard, reflected into `llm`. `*.titan.arrieta.eu` is one label deep, which is
    # exactly the depth of `llm.titan` (RFC 6125 6.4.3), so no second Certificate is needed and
    # none was added. Getting the Secret here is the reflector allow-list on
    # apply/40-certificates/titan-wildcard.yaml — never a hand-copied Secret.
    secretName: titan-tls

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# This stage is `apps` and this object lives in `databases`: the stage order is what
# puts the CNPG operator ahead of the Cluster, and a kustomize directory may span
# namespaces (there is deliberately no top-level `namespace:` field - it rewrites them
# all). The Cluster carries kustomize.toolkit.fluxcd.io/prune: disabled to survive a
# git deletion, so a reorganisation that "moves the database to a databases stage"
# deletes the manifest holding that protection - the annotation has to move in the
# same commit, or the Cluster becomes prunable on the next bad rebase.
resources:
  - databases/postgres.yaml
  - databases/postgres-backup.yaml
  # After the Cluster it depends on: a CNPG Database cannot resolve its clusterRef until
  # the Cluster exists, and file order here is the apply order Flux uses. The Database may
  # report Reconciling for a moment before the role lands - that is CNPG retrying, and it
  # must converge. Still not Synced after a minute is a real failure, not a race.
  - auth/authentik-db.yaml
  - coder/coder-db.yaml
  # coder's Database and DatabaseRole, same shape and same namespace rule as authentik's: a CNPG
  # Database must share a namespace with its Cluster, so these live in `databases` while the app
  # that owns them lives in `coder`. It was written, committed, and left out of this list - where it
  # would have built green and been silently never applied, which is the failure mode
  # `make kustomize-listing` was added to close.
  # After the Database and DatabaseRole it connects with. The HelmRelease would install and
  # authentik would crash-loop on a missing role, so ordering here is cheap insurance.
  - auth/authentik.yaml
  # Quota, limit range and the provisioner Role, all in coder-workspaces. They precede coder's
  # HelmRelease because a workspace built before the quota exists is a workspace the quota never
  # saw - and the quota is the only thing standing between a third workspace and the Postgres
  # every other app here depends on.
  - coder/workspaces.yaml

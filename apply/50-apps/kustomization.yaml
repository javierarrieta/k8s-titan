apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The shared unit: authentik, coder, and — when they arrive — the small apps that pass the D1
# admission test in docs/superpowers/specs/2026-10-19-titan-app-scale-out-design.md.
#
# `databases/` and `tesla/` were split out on 2026-10-19 into their own stage directories,
# `apply/30-databases` and `apply/60-tesla`, each with its own Flux Kustomization; see
# docs/superpowers/plans/2026-10-19-titan-apps-stage-split.md. What stayed here is here on
# purpose, not by omission: authentik and coder are `HelmRelease` objects, so a bad `values`
# block does not fail this unit at all — the CR applies cleanly and the HelmRelease fails on
# its own, separately. Only a malformed HelmRelease *manifest* propagates, and those files are
# rarely touched. Giving them their own unit would have bought nothing and cost a migration.
#
# A typo in a future small app lands in this unit and freezes coder's *updates*, not coder.
# That is the accepted residual risk, and it is why the admission test is written down.
#
# ORDERING: the notes below describe intent, not mechanism. Flux sorts by kind and applies
# concurrently, so file order decides nothing; the real safety is Kubernetes retrying a pod
# whose Database or Secret has not landed yet. Cross-unit ordering is `dependsOn`.
resources:
  # CNPG role + exporter, exposed only through the WireGuard-filtered NodePort.
  - postgres-exporter.yaml
  # After the Cluster it depends on, which now lives in the `databases` unit: a CNPG Database
  # cannot resolve its clusterRef until the Cluster exists. The Database may report Reconciling
  # for a moment before the role lands — that is CNPG retrying, and it must converge. Still not
  # Synced after a minute is a real failure, not a race.
  - auth/authentik-db.yaml
  - coder/coder-db.yaml
  # coder's Database and DatabaseRole, same shape and same namespace rule as authentik's: a CNPG
  # Database must share a namespace with its Cluster, so these live in `databases` while the app
  # that owns them lives in `coder`. It was written, committed, and left out of this list — where
  # it would have built green and been silently never applied, which is the failure mode
  # `make kustomize-listing` was added to close.
  # The server: it reads coder-secrets and coder-tls (reflected), and provisions into
  # coder-workspaces under the Role above. A HelmRelease that installs before its Secret exists
  # comes up crash-looping, which reads as a coder bug rather than a missing file.
  - coder/coder.yaml
  # authentik's blueprint for the Tesla apps, before the HelmRelease that mounts it: the chart
  # mounts this ConfigMap into the worker, and a pod whose mounted ConfigMap does not exist yet
  # sits Pending rather than converging. It is a ConfigMap and not a Secret because it carries no
  # credential — see the file's own header for why that distinction is the whole point.
  - auth/tesla-outpost-blueprint.yaml
  - auth/opencloud-blueprint.yaml
  - auth/authentik.yaml
  # Quota, limit range and the provisioner Role, all in coder-workspaces. The quota is the only
  # thing standing between a third workspace and the Postgres every other app here depends on.
  - coder/workspaces.yaml
  # open-webui's Database and DatabaseRole, in `databases` for the same reason as the two above.
  # Listed before the Deployment that connects as this role, which is intent rather than mechanism:
  # Flux sorts by kind and applies concurrently, and the pod retries until the role exists.
  - open-webui/open-webui-db.yaml
  # The app itself: PVC + Deployment + Service + Ingress in namespace `open-webui`. It reads
  # open-webui-secrets (envFrom) and titan-tls (reflected into its own namespace), and connects as the
  # role above. A pod that starts before its Secret exists sits crash-looping, which reads like an app
  # bug rather than a missing file — the ordering note at the top of this file applies.
  - open-webui/open-webui.yaml
  # Grafana. Ten files, and the listing is not ceremony: an unlisted manifest builds green and is
  # silently never applied, which is the coder-db.yaml story. The dashboards are ConfigMaps, so a
  # mis-nested field in one of them fails THIS unit atomically and freezes coder's and authentik's
  # updates until the next commit — the accepted cost recorded in the header above and in
  # docs/superpowers/specs/2026-10-21-titan-grafana-design.md §10.
  - grafana/grafana-datasources.yaml
  - grafana/grafana-dashboard-provisioning.yaml
  - grafana/grafana-dashboards/node-exporter-dashboard.yaml
  - grafana/grafana-dashboards/postgres-dashboard.yaml
  - grafana/grafana-dashboards/comin-dashboard.yaml
  - grafana/grafana-dashboards/disk-dashboard.yaml
  - grafana/grafana-dashboards/alerts-dashboard.yaml
  - grafana/grafana-dashboards/amdgpu-dashboard.yaml
  - grafana/grafana-dashboards/security-scans-dashboard.yaml
  # The workload itself: PVC + Deployment + Service + Middleware + Ingress in namespace
  # `observability`. It reads observability-grafana-admin and observability-grafana-oidc (Task 3) and
  # titan-tls, reflected in.
  - grafana/grafana.yaml
  # Gatus probes casa through public DNS from titan and sends alerts directly to Telegram.
  - gatus/gatus.yaml
  # OpenCloud, the Infinite Scale fork, replacing the PHP Nextcloud that runs in casa. Two files, and
  # the split is the failure domain: `opencloud.yaml` is the app (including its WOPI collaboration
  # service, which since 8.1.0 runs inside the same process rather than in a sidecar), `collabora.yaml`
  # is the editor. A bad field in the editor takes down document opening and nothing else; a bad field
  # in the app takes down the file service. Both freeze coder's and authentik's updates for the length
  # of the failure, which is the accepted cost recorded at the top of this file.
  #
  # Ordering here is intent, not mechanism (see the note at the top of this file): the app reads
  # opencloud-secrets from namespace `files` and titan-tls reflected into it, and a pod that starts
  # before either exists crash-loops rather than converging.
  - opencloud/opencloud.yaml
  - opencloud/collabora.yaml
  # Mealie, the recipe manager. Two files and the split is the same one open-webui has: the CNPG
  # Database and DatabaseRole live in namespace `databases` because that is where their Cluster is,
  # while the app lives in `mealie`. Listed DB-first for intent, not mechanism — Flux sorts by kind
  # and applies concurrently, and the pod retries until the role exists.
  #
  # The third Mealie artifact is not here: authentik/blueprints-mealie.yaml becomes a Secret in
  # 10-secrets and is mounted by the authentik HelmRelease below, because authentik applies blueprints
  # and Mealie does not.
  - mealie/mealie-db.yaml
  - mealie/mealie.yaml
  # llm.titan.arrieta.eu: a bearer-auth front for the halogen endpoint on the llm01 box, duplicated
  # from ../k8s-techdelivery rather than migrated — both clusters serve it now, with one token.
  # One file holding the proxy target (Endpoints + Service with no selector), the forwardAuth nginx,
  # the Middleware and the Ingress, all in namespace `llm`. It reads llm-bearer-token from
  # 10-secrets and titan-tls reflected into `llm` via the allow-list on 40-certificates/titan-wildcard.yaml.
  #
  # A bad field here freezes coder's and authentik's updates for the length of the failure, which is
  # the accepted cost recorded at the top of this file; one hand-written manifest is not bulk.
  - llm/llm.yaml
  # Sure, the personal-finance tracker trialled as a Firefly III replacement. Same two-file split as
  # mealie: the CNPG Database and DatabaseRole must live in `databases` beside their Cluster while the
  # app lives in `sure`. The third artifact is again not here — the OIDC client becomes a Secret in
  # 10-secrets and is mounted by the authentik HelmRelease. Design:
  # docs/superpowers/specs/2026-10-23-titan-sure-design.md.
  - sure/sure-db.yaml
  - sure/sure.yaml
  # Hermes, the Nous Research investing agent, migrated from ../k8s-techdelivery with its object
  # names intact. One hand-written manifest (PVC + Deployment + Service in namespace `apps`), so it
  # is the shape §3.2 of the 2026-10-19 design keeps in this stage: no bulk authored here, and a bad
  # field freezes coder's and authentik's *updates*, not coder. It passes the §3.1 admission test —
  # one pod, no database, no public hostname, credentials only from its own Secret — which is why it
  # lands in the existing `apps` namespace rather than buying a new one.
  #
  # It runs at replicas: 1 from the first merge, at the same moment ../k8s-techdelivery scales its
  # copy to 0: `local-path-retain` is WaitForFirstConsumer, so a stopped app here would leave the
  # PVC unbound and nowhere to rsync the hand-moved 10 Gi into. The file's own header is the
  # sequence, and its last step is the pod delete that makes the copied files take effect.
  - investing-agent/investing-agent.yaml

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The shared unit: authentik, coder, and — when they arrive — the small apps that pass the D1
# admission test in docs/superpowers/specs/2026-10-19-titan-app-scale-out-design.md.
#
# `databases/` and `tesla/` were split out on 2026-10-19 into their own stage directories,
# `apply/30-databases` and `apply/60-tesla`, each with its own Flux Kustomization; see
# docs/superpowers/plans/2026-10-19-titan-apps-stage-split.md. What stayed here is here on
# purpose, not by omission: authentik and coder are `HelmRelease` objects, so a bad `values`
# block does not fail this unit at all — the CR applies cleanly and the HelmRelease fails on
# its own, separately. Only a malformed HelmRelease *manifest* propagates, and those files are
# rarely touched. Giving them their own unit would have bought nothing and cost a migration.
#
# A typo in a future small app lands in this unit and freezes coder's *updates*, not coder.
# That is the accepted residual risk, and it is why the admission test is written down.
#
# ORDERING: the notes below describe intent, not mechanism. Flux sorts by kind and applies
# concurrently, so file order decides nothing; the real safety is Kubernetes retrying a pod
# whose Database or Secret has not landed yet. Cross-unit ordering is `dependsOn`.
resources:
  # After the Cluster it depends on, which now lives in the `databases` unit: a CNPG Database
  # cannot resolve its clusterRef until the Cluster exists. The Database may report Reconciling
  # for a moment before the role lands — that is CNPG retrying, and it must converge. Still not
  # Synced after a minute is a real failure, not a race.
  - auth/authentik-db.yaml
  - coder/coder-db.yaml
  # coder's Database and DatabaseRole, same shape and same namespace rule as authentik's: a CNPG
  # Database must share a namespace with its Cluster, so these live in `databases` while the app
  # that owns them lives in `coder`. It was written, committed, and left out of this list — where
  # it would have built green and been silently never applied, which is the failure mode
  # `make kustomize-listing` was added to close.
  # The server: it reads coder-secrets and coder-tls (reflected), and provisions into
  # coder-workspaces under the Role above. A HelmRelease that installs before its Secret exists
  # comes up crash-looping, which reads as a coder bug rather than a missing file.
  - coder/coder.yaml
  # authentik's blueprint for the Tesla apps, before the HelmRelease that mounts it: the chart
  # mounts this ConfigMap into the worker, and a pod whose mounted ConfigMap does not exist yet
  # sits Pending rather than converging. It is a ConfigMap and not a Secret because it carries no
  # credential — see the file's own header for why that distinction is the whole point.
  - auth/tesla-outpost-blueprint.yaml
  - auth/authentik.yaml
  # Quota, limit range and the provisioner Role, all in coder-workspaces. The quota is the only
  # thing standing between a third workspace and the Postgres every other app here depends on.
  - coder/workspaces.yaml
  # open-webui's Database and DatabaseRole, in `databases` for the same reason as the two above.
  # Listed before the Deployment that connects as this role, which is intent rather than mechanism:
  # Flux sorts by kind and applies concurrently, and the pod retries until the role exists.
  - open-webui/open-webui-db.yaml

# The daily base backup. WAL archiving is continuous and implicit the moment a
# barmanObjectStore exists, so this file is only the base-backup schedule - the WAL
# between 03:00 and the failure is already shipped (spec 7.1).
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: postgres-daily
  namespace: databases
spec:
  # robfig/cron v1.2.0, which CNPG pins, makes the leading seconds field optional, so this
  # 5-field form parses to 03:00:00 daily. CNPG's own docs describe the 6-field form; both
  # parse, and this one is what the plan specified.
  schedule: "0 3 * * *"
  method: barmanObjectStore
  # 'cluster', NOT 'self'. Owner references give cascading deletion, so the value decides
  # which git accident destroys the backup records:
  #   self    - the ScheduledBackup owns the Backups, so deleting THIS file garbage-collects
  #             every Backup it produced. That is the value to avoid, not the safe one.
  #   cluster - the Cluster owns them, and the Cluster carries
  #             kustomize.toolkit.fluxcd.io/prune: disabled, so deleting this file orphans
  #             nothing. Losing the backups then requires the deliberate
  #             `kubectl delete cluster postgres` that already deletes the database.
  #   none    - also survives, but leaves Backup CRs owned by nothing, reconciled by nobody.
  # Whether the object-store data follows a deleted Backup CR is not documented upstream -
  # cloudnative-pg#2328 asks for object-store cleanup on cluster deletion and does not get
  # it - so this choice is about not destroying the records either way, not about relying
  # on the S3 side surviving.
  backupOwnerReference: cluster
  cluster:
    name: postgres

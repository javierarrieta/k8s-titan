# The one Postgres every titan workload shares. One instance on one node is the normal
# shape, not a compromise: there is no second node to place a replica on, and any
# minSyncReplicas above zero would be unsatisfiable (spec 6.2).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: databases
  annotations:
    # THE ONE ANNOTATION THAT MATTERS. The apps stage runs with prune: true, so without
    # this, deleting postgres.yaml from git - a bad rebase, a mis-scoped revert, a git rm
    # during a reorganisation - deletes the Cluster, and CNPG deletes a Cluster's PVCs with
    # it. That is the identity database of every service that will ever point at it
    # (spec 6.3). Deleting it must require a deliberate `kubectl delete cluster postgres`.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  instances: 1
  # Pinned explicitly so a later operator bump cannot silently move the Postgres major
  # version. 18.6 verified against GHCR: manifest fetch returns 200 for 18.6 and 404 for
  # 18.5, 18.7 and 99.9. Operator 1.30.x supports Postgres 14-18.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6
  storage:
    # A label, not a limit. local-path on k3s ignores the requested size; the real ceiling
    # is the 240G vg0/pvc ext4 mount, and its reclaimPolicy is Delete (spec 6.4). Sizing
    # here documents intent and nothing more.
    size: 10Gi
    storageClass: local-path
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  # The second backup destination, and the reason spec 11.3's PV-backup override stops
  # being uncompensated. WAL archiving becomes continuous the moment a barmanObjectStore
  # exists; this block is the whole archive path (spec 7.1).
  #
  # Forward debt, stated plainly: CNPG deprecated both the native barmanObjectStore method
  # (in favour of the CNPG-I Barman Cloud Plugin) and spec.backup.retentionPolicy as of 1.26,
  # and retentionPolicy is slated for removal. Operator 1.30.1 still defaults to
  # barmanObjectStore and honours retentionPolicy, so this works today; migrating to the
  # plugin is separate work with its own operator component, not a drive-by edit here.
  #
  # The removal is now dated rather than vague: the admission webhook warns "Native support for
  # Barman Cloud backups and recovery is deprecated and will be completely removed in
  # CloudNativePG 1.31.0" - observed on a live restore on 2026-10-05, against both this block and
  # the drill's externalClusters[].barmanObjectStore. So the plugin migration gates the next
  # operator minor bump, and it must move the Cluster, the ScheduledBackup and the restore drill
  # together. See docs/authentik-runbook.md.
  backup:
    barmanObjectStore:
      destinationPath: s3://k8s-titan-pg-562256260016-eu-west-1-an
      # No endpointURL. Setting one is what you do for an S3-compatible store; against real
      # AWS it is at best redundant and at worst a second thing to get wrong.
      s3Credentials:
        accessKeyId:     {name: s3-backup-secrets, key: ACCESS_KEY_ID}
        secretAccessKey: {name: s3-backup-secrets, key: SECRET_ACCESS_KEY}
        # region is a secret-key reference, not a plain field - the CRD says "the reference
        # to the secret containing the region name". There is no EC2 instance metadata on
        # titan for barman to fall back to, so AWS_REGION is required, not optional.
        region:          {name: s3-backup-secrets, key: AWS_REGION}
    # retentionPolicy is a child of spec.backup, NOT of barmanObjectStore. The plan nested
    # it one level too deep; the API server then rejected the whole Cluster with "field not
    # declared in schema", the dry-run failed, and every manifest in the apps stage was
    # blocked behind it. Verified against the v1.30.1 CRD: spec.backup.properties is
    # barmanObjectStore, retentionPolicy, target, volumeSnapshot.
    #
    # CRD pattern is ^[1-9][0-9]*[dwm]$ - '30d', NOT '30 days'. CNPG enforces retention
    # through barman-cloud-backup-delete with these same credentials, so an S3 lifecycle
    # rule is a backstop for noncurrent versions, not retention. Do not let anyone later
    # consolidate the two and lose retention.
    retentionPolicy: 30d

apiVersion: v1
kind: ConfigMap
metadata:
  name: gatus-config
  namespace: gatus
data:
  config.yaml: |
    alerting:
      telegram:
        token: "${TELEGRAM_TOKEN}"
        id: "${TELEGRAM_BOT_ID}"

    endpoints:
      - name: casa-nextcloud-public
        group: casa
        url: https://nextcloud.home.arrieta.eu/status.php
        interval: 1m
        client:
          timeout: 10s
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: telegram
            failure-threshold: 3
            send-on-resolved: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gatus
  namespace: gatus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gatus
  template:
    metadata:
      labels:
        app: gatus
    spec:
      containers:
        - name: gatus
          image: twinproduction/gatus:v5.37.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: TELEGRAM_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gatus-telegram
                  key: TELEGRAM_TOKEN
            - name: TELEGRAM_BOT_ID
              valueFrom:
                secretKeyRef:
                  name: gatus-telegram
                  key: TELEGRAM_BOT_ID
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            failureThreshold: 3

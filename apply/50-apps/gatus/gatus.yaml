apiVersion: v1
kind: ConfigMap
metadata:
  name: gatus-config
  namespace: gatus
data:
  config.yaml: |
    alerting:
      telegram:
        token: "${TELEGRAM_TOKEN}"
        id: "${TELEGRAM_BOT_ID}"

    endpoints:
      - name: casa-nextcloud-public
        group: casa
        url: https://nextcloud.home.arrieta.eu/status.php
        interval: 1m
        client:
          timeout: 10s
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: telegram
            failure-threshold: 3
            send-on-resolved: true

      # The two Home Assistant passthroughs (#112, added in fd0f419). They are the only titan hosts
      # whose correctness depends on a file that is not in this tree: HA answers **HTTP 400 to every
      # request** — app and browser alike — when it receives `X-Forwarded-For` from an address that
      # is not in its own `http.trusted_proxies`, and that list lives in each box's
      # `configuration.yaml`. Neither host is proxy-gated (both are named in `NOT_PROXY_GATED` in
      # `tools/ingress-auth-check.py` because HA authenticates natively and companion apps do not
      # follow `302`s), so there is no `Middleware` that would fail loudly instead. A `[STATUS] == 200`
      # probe is the only thing in the stack that can see it.
      #
      # PROBED THROUGH THE PUBLIC URL, not the backend address, on purpose: the probe has to exercise
      # DNS -> Traefik -> TLS -> HA, which is the whole path a user takes. Reaching the backend is not
      # the same claim — `apply/50-apps/home-hass/home-hass.yaml` records an in-cluster 200 from
      # 10.62.0.75 taken the day the hostname was promised, and the host still answered 400 to every
      # real request through the proxy.
      #
      # HAIR-PIN IS PROVEN, not assumed (measured 2026-11-03 from a pod on this cluster): a request to
      # `https://hass.titan.arrieta.eu/` from inside the cluster reaches the public address and comes
      # back, so a failing probe here is the host's fault and not the probe's.
      - name: hass-home-public
        group: titan
        url: https://hass.titan.arrieta.eu/
        interval: 1m
        client:
          timeout: 10s
        conditions:
          - "[STATUS] == 200"
          # The cert path is otherwise unmonitored end to end: a `Certificate` can be `Ready` while
          # Reflector has no Secret in the consuming namespace, and `secretTemplate` allow-list
          # omissions fail silently.
          #
          # THIS CONDITION WAS INVERTED, and it is written down because it is the single most
          # instructive bug this file has carried. It read `[CERTIFICATE_EXPIRATION] < 720h`, which
          # passes only when the certificate expires WITHIN 30 days. Gatus conditions describe the
          # HEALTHY state -- the upstream example is `> 48h`, "must not expire in the next 48 hours"
          # -- so as written this endpoint was DOWN every minute it had a healthy certificate, which
          # is to say always: measured 2026-11-07 the wildcard had 1317h (54.9 days) left, and 1317
          # is not < 720. The comment justified the wrong operator by reasoning about when a renewal
          # failure would fire, never about which side of the comparison the healthy state lives on.
          #
          # Why nobody saw it: no alert from this Deployment has ever been observed arriving (see the
          # delivery note at the foot of this ConfigMap). A monitor that cannot deliver reports its
          # own failure as silence. 120h matches the bound already used in ../k8s-casa.
          - "[CERTIFICATE_EXPIRATION] > 120h"
        alerts:
          - type: telegram
            failure-threshold: 3
            send-on-resolved: true

      # The chiclana box, reached over the titan-managed mesh (192.168.133.3) rather than the OPNsense
      # WireGuard peer. Same 400 failure mode, different trusted_proxies list, so it is a separate
      # probe and not a duplicate: the two boxes can break independently, and did — measured
      # 2026-11-03 this one answered 200 while the home box answered 400.
      - name: chiclana-hass-public
        group: titan
        url: https://chiclana-hass.titan.arrieta.eu/
        interval: 1m
        client:
          timeout: 10s
        conditions:
          - "[STATUS] == 200"
          # Same inverted operator as `hass-home-public`; see the record there.
          - "[CERTIFICATE_EXPIRATION] > 120h"
        alerts:
          - type: telegram
            failure-threshold: 3
            send-on-resolved: true

      # --------------------------------------------------------------------------------------------
      # THE THREE BELOW ARE THE MIGRATED HALF OF #109 — the VPS probe list, re-derived from titan's
      # network position rather than copied. Every entry in ../k8s-techdelivery
      # apply/50-apps/apps/gatus.yaml was an assertion about the VPS's view of the network, and the
      # spec's warning was right: copying it produces a monitor confidently wrong about titan.
      #
      # WHAT WAS NOT COPIED, AND WHY — this is the part that matters. The VPS probes were
      # `icmp://192.168.0.1`, `icmp://192.168.0.5`, `icmp://192.168.0.6` and
      # `http://192.168.133.3:8123`. **None of the three ICMP probes were carried over, and it is not
      # a judgement call about their value.** ICMP from a pod needs `CAP_NET_RAW` (or a root image),
      # and this Deployment declares no `securityContext` at all, so whether the gatus pod can send it
      # depends entirely on the image's default user — which cannot be read from a read-only kube
      # context (`kubectl auth can-i create pods -n gatus` -> `no`, and `pods/exec` is likewise
      # refused). #109 names the exact hazard: "a pod that cannot send ICMP fails a probe for a reason
      # that has nothing to do with the target being down, and that is a false alarm generator." An
      # unprovable probe is worse than no probe, so every probe below is TCP or HTTP, and every one was
      # measured from a pod on this cluster before being written.
      #
      # MEASURED 2026-11-06 from a pod on this cluster (source 10.62.0.x, the same proof method
      # `apply/50-apps/home-hass/home-hass.yaml:20` uses):
      #
      #     192.168.0.1:22   TCP OPEN      192.168.0.1:53   TCP OPEN
      #     192.168.0.1:80   filtered      192.168.0.1:443  filtered
      #     192.168.0.6:9000 -> /minio/health/live  HTTP 200
      #     192.168.0.29:8731 -> /health           HTTP 200
      #     192.168.0.5:8123 TCP OPEN      192.168.133.3:8123 TCP OPEN
      #
      # THE ONE THAT MATTERS MOST is the MinIO probe. `apply/70-backup/` ships restic to casa's MinIO
      # at 192.168.0.6:9000, and this file's own closing comment used to say "nothing here alerts on a
      # stale backup either" — that line is being replaced by this probe. A MinIO that is down or
      # refusing writes turns every nightly backup into a silent no-op; the backup Jobs exit non-zero
      # into pods nobody watches, which is techdelivery#160 repeated on a different cluster. This does
      # not prove a backup *ran* — only that the place it writes to is alive. The rule that proves a
      # backup went stale is a Prometheus alert on the snapshot age and lives in k8s-casa, not here.
      - name: casa-minio-backup-target
        group: casa
        url: http://192.168.0.6:9000/minio/health/live
        interval: 1m
        client:
          timeout: 10s
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: telegram
            failure-threshold: 3
            send-on-resolved: true

      # casa's halogen endpoint. Three things in this cluster depend on it and none of them can say so
      # when it is gone: `apply/50-apps/llm/llm.yaml` proxies it, `sure/sure.yaml` sets
      # OPENAI_URI_BASE to it, and investing-agent's OPENAI_BASE_URL is the same address. A failure
      # here reads as three unrelated apps misbehaving, which is the shape of outage nobody connects to
      # one cause. Plain HTTP on the mesh, as those files record — the mesh is what encrypts it.
      - name: casa-halogen-llm
        group: casa
        url: http://192.168.0.29:8731/health
        interval: 1m
        client:
          timeout: 10s
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: telegram
            failure-threshold: 3
            send-on-resolved: true

      # The home LAN gateway, standing in for the VPS's `icmp://192.168.0.1`. It is the OPNsense peer
      # whose `allowedIPs` carry 192.168.0.0/24, and `home-hass.yaml:26` names it as a single point of
      # failure with no second path — so "the gateway is down" is the failure that takes the home
      # passthroughs, MinIO and the LLM endpoint out together. Probed on TCP/53 rather than ICMP
      # because that is what was proven open from here and it needs no privilege; 80 and 443 are
      # filtered from the mesh, so an HTTP probe would fail for a reason that is not an outage.
      #
      # WHAT THIS CANNOT DISTINGUISH: a gateway that answers on 53 while its WireGuard peer is broken.
      # The two `*-hass-public` probes above are what catch that, because they traverse the peer.
      - name: home-lan-gateway
        group: home
        url: tcp://192.168.0.1:53
        interval: 1m
        client:
          timeout: 5s
        conditions:
          - "[CONNECTED] == true"
        alerts:
          - type: telegram
            failure-threshold: 3
            send-on-resolved: true

      # ================================================================================================
      # TITAN'S OWN PUBLIC HOSTS -- added 2026-11-07, measured from a pod on this cluster the same day.
      #
      # WHAT A HAIRPIN PROBE PROVES, AND WHAT IT DOES NOT. These targets resolve to titan's own public
      # address and come back, so each one exercises DNS -> public NIC -> Traefik -> TLS -> app, which
      # is the user's whole path. What they cannot do is report that titan is down: the prober dies with
      # the box. That gap is closed from the other side by `titan auth` and `titan k8s api` in
      # ../k8s-casa apply/50-apps/casa/gatus.yaml, which watch titan from a box that is not titan.
      # Reading this list without that pairing reads as more coverage than there is.
      #
      # WHY EVERY CONDITION HERE WAS MEASURED BEFORE BEING WRITTEN. Six of the eighteen public hostnames
      # answer something other than 200 to an unauthenticated client, and a `[STATUS] == 200` written
      # from habit on any of them is a permanent DOWN -- the exact failure the cert condition above
      # carried. The ones NOT probed and why:
      #
      #   - `tesla`, `vert`, `bentopdf`, `investing-agent`, `uptime` are forwardAuth-gated, so they are
      #     NOT probed over the public URL. Traefik runs the forwardAuth BEFORE proxying to the backend,
      #     so an unauthenticated public probe gets authentik's login page at HTTP 200 and proves
      #     nothing about the app behind it. The starkest form of this: `uptime.titan.arrieta.eu/api/v1/
      #     endpoints/statuses` -- gatus's own status API -- answers 200 with an HTML login page to an
      #     anonymous caller. Five probes written the obvious way would have sat green over five dead
      #     apps, which is worse than no probe. They ARE probed, at the cluster service level, in the
      #     `*-backend` block below; `titan-auth-frontdoor` is what the public URL genuinely proves.
      #   - `llm` answers 401 without the bearer token. Provable later via `client.headers` off the
      #     existing Secret; the backend is already covered by `casa-halogen-llm`.
      #   - `sure` has no health path found (`/api/health` and `/health` both 404); `/` serves the app
      #     shell, which is a thin but honest claim, so it is probed on `/`.
      #
      # THE CERT CONDITION IS ON EVERY HTTPS PROBE ON PURPOSE. One wildcard covers seventeen of these
      # hosts, so a failed renewal is not one outage but seventeen, and until now exactly two probes
      # looked at it.
      #
      # WHY THIS URL AND NOT A HEALTH ENDPOINT. Authentik is the single point of failure behind five
      # forwardAuth hosts and five OIDC apps and nothing probed it. Its health paths are not reachable
      # unauthenticated -- `/api/-/health/live`, `/api/-/health/ready`, `/-/health/` and
      # `/api/v3/inf/health/` all 404 -- and the login-flow URL 404s when requested directly, answering
      # 200 only as the tail of a redirect carrying `?next=`. The OIDC discovery endpoint is both the
      # provable URL and the stronger claim: it needs the web process, a live Postgres (the app registry
      # is in the DB), the provider and the application to all answer. The issuer condition ties the body
      # to authentik rather than to anything answering 200. Six apps sit behind it, all measured 200:
      # coder, open-webui, sure, mealie, tesla, opencloud.
      - name: titan-auth-frontdoor
        group: titan
        url: https://auth.titan.arrieta.eu/application/o/coder/.well-known/openid-configuration
        interval: 1m
        client:
          timeout: 10s
        conditions:
          - "[STATUS] == 200"
          # UNQUOTED ON PURPOSE. Gatus compares the right-hand side as a literal string including any
          # quote characters, so `== \"https://...\"` expects a value that literally begins with a `\"`
          # and never matches. The failure message is the trap: it prints the resolved value and the
          # expected value looking byte-identical, which reads like a gatus bug rather than like quotes
          # being part of the literal. Every documented example in the gatus README writes the literal
          # bare, and the two other `[BODY]` conditions in this file -- `[BODY].status == UP` and
          # `[BODY] == 37.187.159.156` -- are bare and pass. This was the only quoted one, and the only
          # failing condition on the first run the probe set ever had.
          - "[BODY].issuer == https://auth.titan.arrieta.eu/application/o/coder/"
          - "[CERTIFICATE_EXPIRATION] > 120h"
        alerts:
          - type: telegram
            failure-threshold: 3
            send-on-resolved: true

      - name: titan-coder
        group: titan
        url: https://coder.titan.arrieta.eu/api/version
        interval: 1m
        client:
          timeout: 10s
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 120h"
        alerts:
          - type: telegram
            failure-threshold: 3
            send-on-resolved: true

      # `files` is probed because it is user-facing, not because it is safe: opencloud's blob bucket has
      # no backup of any kind (docs/superpowers/specs/2026-10-22-titan-restic-pv-backups-design.md), so
      # this probe says whether the front door is up and says nothing about recoverability.
      - name: titan-files
        group: titan
        url: https://files.titan.arrieta.eu/
        interval: 1m
        client:
          timeout: 10s
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 120h"
        alerts:
          - type: telegram
            failure-threshold: 3
            send-on-resolved: true

      - name: titan-mealie
        group: titan
        url: https://meals.titan.arrieta.eu/
        interval: 5m
        client:
          timeout: 10s
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 120h"
        alerts:
          - type: telegram
            failure-threshold: 3
            send-on-resolved: true

      - name: titan-open-webui
        group: titan
        url: https://open-webui.titan.arrieta.eu/health
        interval: 1m
        client:
          timeout: 10s
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 120h"
        alerts:
          - type: telegram
            failure-threshold: 3
            send-on-resolved: true

      # Grafana's /api/health says the process is up. It does NOT say the datasource over the mesh
      # answers -- docs/grafana-runbook.md records that a datasource outage empties every panel with
      # the pod healthy, and that is a different probe or it is nothing.
      - name: titan-grafana
        group: titan
        url: https://grafana.titan.arrieta.eu/api/health
        interval: 1m
        client:
          timeout: 10s
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 120h"
        alerts:
          - type: telegram
            failure-threshold: 3
            send-on-resolved: true

      - name: titan-collabora
        group: titan
        url: https://collabora.titan.arrieta.eu/
        interval: 5m
        client:
          timeout: 10s
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 120h"
        alerts:
          - type: telegram
            failure-threshold: 3
            send-on-resolved: true

      - name: titan-sure
        group: titan
        url: https://sure.titan.arrieta.eu/
        interval: 5m
        client:
          timeout: 10s
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 120h"
        alerts:
          - type: telegram
            failure-threshold: 3
            send-on-resolved: true

      # Earns its place twice. The cert here is `tesla-streaming-tls`, NOT the wildcard, because the
      # Erlang stream client rejects wildcard SANs (apply/40-certificates/tesla-streaming.yaml). So a
      # cert probe on this host also catches anyone "simplifying" it back to the wildcard -- the one
      # edit that would look like a cleanup and break every car coming online.
      - name: titan-streaming
        group: titan
        url: https://streaming.titan.arrieta.eu/
        interval: 5m
        client:
          timeout: 10s
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 120h"
        alerts:
          - type: telegram
            failure-threshold: 3
            send-on-resolved: true

      # ================================================================================================
      # THE FIVE GATED APPS, PROBED AT THE CLUSTER SERVICE LEVEL.
      #
      # WHY NOT THROUGH THE PUBLIC URL. Traefik's forwardAuth runs BEFORE it proxies to the backend, so
      # an unauthenticated probe of `tesla`/`vert`/`bentopdf`/`investing-agent`/`uptime` gets authentik's
      # login page at HTTP 200 no matter whether the app behind it is alive, crash-looping, or deleted.
      # Going through the Service bypasses Traefik entirely and asks the only question left: does the
      # application answer?
      #
      # WHAT THIS DOES NOT PROVE, because the split is the whole point of doing it this way: it says
      # nothing about DNS, TLS, the entrypoint, the Middleware, or the forwardAuth wiring. Those are the
      # `*-public` probes and `titan-auth-frontdoor`. A green backend probe next to a red public probe is
      # the signal that the app is fine and the path to it is not -- which is a different page to get and
      # a different file to open, and is the reason these are separate endpoints rather than one.
      #
      # ALL FIVE WERE MEASURED FROM A POD ON THIS CLUSTER, and two findings changed what got written:
      #
      #   - `vert-sh`, `bentopdf` and `investing-agent` return 200 for ANY path -- SPA catch-all routing.
      #     So `/health` on them is decorative, not a health endpoint, and a condition on it would imply
      #     a check that does not exist. They are probed on `/`, which is the honest claim: the process
      #     serves its shell.
      #   - `teslamate` answers 404 on `/health`; its shell at `/` is the only real target.
      #
      # No NetworkPolicy exists anywhere in this tree, so cross-namespace pod-to-pod is open by default
      # and these resolve today; that is a measured fact about the current tree, not a guarantee about a
      # future one.
      - name: teslamate-backend
        group: titan
        url: http://teslamate.apps.svc.cluster.local/
        interval: 1m
        client:
          timeout: 10s
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: telegram
            failure-threshold: 3
            send-on-resolved: true

      - name: vert-sh-backend
        group: titan
        url: http://vert-sh.apps.svc.cluster.local/
        interval: 5m
        client:
          timeout: 10s
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: telegram
            failure-threshold: 3
            send-on-resolved: true

      - name: bentopdf-backend
        group: titan
        url: http://bentopdf.apps.svc.cluster.local:8080/
        interval: 5m
        client:
          timeout: 10s
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: telegram
            failure-threshold: 3
            send-on-resolved: true

      - name: investing-agent-backend
        group: titan
        url: http://investing-agent.apps.svc.cluster.local/
        interval: 5m
        client:
          timeout: 10s
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: telegram
            failure-threshold: 3
            send-on-resolved: true

      # The watcher, watched -- partially, and the limit is the interesting part. `gatus` probing
      # `gatus` is circular in one direction and useful in the other: if the pod is gone the probe never
      # runs, so this can NEVER report "the gatus pod died". What it CAN report is the case the file at
      # apply/50-apps/gatus/gatus.yaml used to leave open -- the monitor loop alive and the web listener
      # dead, which is a blank status page and no alert. The Service has no ready endpoints, the connect
      # fails, and the still-running monitor says so.
      #
      # `uptime.titan.arrieta.eu` is gated, so the public status page and this probe are different code
      # paths: the page can be empty while this is green, and this can be red while the page still shows
      # stale green tiles.
      - name: gatus-backend
        group: titan
        url: http://gatus.gatus.svc.cluster.local:8080/health
        interval: 1m
        client:
          timeout: 10s
        conditions:
          - "[STATUS] == 200"
          - "[BODY].status == UP"
        alerts:
          - type: telegram
            failure-threshold: 3
            send-on-resolved: true

      # ================================================================================================
      # THE VPS, WATCHED FROM A PUBLIC BOX -- transitional, and built to be deleted as one block.
      #
      # These six endpoints were deleted from ../k8s-casa rather than duplicated, and the reason is the
      # vantage point. Casa probes the WAN from a residential ISP; titan holds a routable public IPv4.
      # Only the second can honestly test inbound SMTP :25 and MX reachability -- a home ISP is not that
      # claim, and two of casa's six VPS probes were already pointing at `vps.techdelivery.es`, which
      # has no A record.
      #
      # THE BOX IS BEING DRAINED, NOT RETIRED, and the difference is the whole reason this block exists.
      # Measured 2026-11-07 it is carrying live traffic: every host answers, mail's MX still resolves to
      # this box, and `uptime.v.arrieta.eu` still serves the old gatus. "Drained" is a direction, not a
      # state. The box's address is deliberately not written here -- leak-check allows exactly one
      # concrete public IPv4 (titan's own) and this is not it.
      #
      # WHEN THE BOX GOES: delete this whole group in one commit. It is kept contiguous for exactly that
      # reason, so decommissioning is a deletion rather than an archaeological dig.
      #
      # NOT PROBED HERE: `hass.v.arrieta.eu` answers HTTP 400 today -- the third instance of the
      # `trusted_proxies` failure this file already documents twice. Probing it would be a permanent
      # DOWN; fix the box first. `llm.v` answers 401.
      - name: vps-smtp-25
        group: vps
        url: starttls://mail.techdelivery.es:25
        interval: 5m
        client:
          timeout: 10s
        conditions:
          - "[CONNECTED] == true"
        alerts:
          - type: telegram
            failure-threshold: 3
            send-on-resolved: true

      - name: vps-submission-587
        group: vps
        url: starttls://mail.techdelivery.es:587
        interval: 5m
        client:
          timeout: 10s
        conditions:
          - "[CONNECTED] == true"
          - "[CERTIFICATE_EXPIRATION] > 120h"
        alerts:
          - type: telegram
            failure-threshold: 3
            send-on-resolved: true

      - name: vps-imaps-993
        group: vps
        url: tls://mail.techdelivery.es:993
        interval: 5m
        client:
          timeout: 10s
        conditions:
          - "[CONNECTED] == true"
          - "[CERTIFICATE_EXPIRATION] > 120h"
        alerts:
          - type: telegram
            failure-threshold: 3
            send-on-resolved: true

      - name: vps-smtps-465
        group: vps
        url: tls://smtp.techdelivery.es:465
        interval: 5m
        client:
          timeout: 10s
        conditions:
          - "[CONNECTED] == true"
          # Every mail port presents a publicly trusted certificate (Let's Encrypt), measured with a
          # verifying context on 587/993/995/465 -- 54.5d left on each. The one self-signed listener on
          # that host is :443, which serves no mail protocol and is in no probe here.
        alerts:
          - type: telegram
            failure-threshold: 3
            send-on-resolved: true

      - name: vps-pop3s-995
        group: vps
        url: tls://mail.techdelivery.es:995
        interval: 5m
        client:
          timeout: 10s
        conditions:
          - "[CONNECTED] == true"
          - "[CERTIFICATE_EXPIRATION] > 120h"
        alerts:
          - type: telegram
            failure-threshold: 3
            send-on-resolved: true

      # The MX claim, or rather the honest version of it. What this CAN see is a zone that stopped
      # serving MX for the domain at all -- the shape left behind by DNS damage during a half-finished
      # migration off the box. What it CANNOT see is an MX that still resolves but points somewhere
      # else: gatus exposes only [DNS_RCODE] and [BODY] on DNS endpoints, and asserting the exact MX
      # string was not measured, so this file does not claim it. A box that answers SMTP while its
      # domain's MX points elsewhere is a mail outage this probe calls healthy.
      - name: vps-mx
        group: vps
        url: 1.1.1.1
        interval: 15m
        client:
          timeout: 10s
        dns:
          query-name: techdelivery.es
          query-type: MX
        conditions:
          - "[DNS_RCODE] == NOERROR"
        alerts:
          - type: telegram
            failure-threshold: 3
            send-on-resolved: true

      - name: vps-ssh
        group: vps
        url: tcp://techdelivery.es:13491
        interval: 1m
        client:
          timeout: 5s
        conditions:
          - "[CONNECTED] == true"
        alerts:
          - type: telegram
            failure-threshold: 3
            send-on-resolved: true

      - name: vps-auth
        group: vps
        url: https://auth.v.arrieta.eu/
        interval: 5m
        client:
          timeout: 10s
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 120h"
        alerts:
          - type: telegram
            failure-threshold: 3
            send-on-resolved: true

      - name: vps-trading-reports
        group: vps
        url: https://tr.v.arrieta.eu/
        interval: 5m
        client:
          timeout: 10s
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: telegram
            failure-threshold: 3
            send-on-resolved: true

      - name: vps-databasus
        group: vps
        url: https://databasus.v.arrieta.eu/
        interval: 5m
        client:
          timeout: 10s
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: telegram
            failure-threshold: 3
            send-on-resolved: true

      - name: vps-kanghuru
        group: vps
        url: https://kanghuru.v.arrieta.eu/
        interval: 5m
        client:
          timeout: 10s
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: telegram
            failure-threshold: 3
            send-on-resolved: true

      - name: vps-grafana
        group: vps
        url: https://grafana.v.arrieta.eu/api/health
        interval: 5m
        client:
          timeout: 10s
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: telegram
            failure-threshold: 3
            send-on-resolved: true

      - name: vps-openwebui
        group: vps
        url: https://openwebui.v.arrieta.eu/health
        interval: 5m
        client:
          timeout: 10s
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: telegram
            failure-threshold: 3
            send-on-resolved: true

      # ================================================================================================
      # THE MESH, FROM THE HUB'S SEAT. Titan is the WireGuard hub, so these probes are about titan's
      # own forwarding and routing, which no other box can observe. Every one is TCP or HTTP, never ICMP:
      # the #109 rule still holds that a pod which cannot prove it can send ICMP is a false-alarm
      # generator, and this Deployment still declares no securityContext.
      #
      # NOT PROBED: the OPNsense peer at 192.168.133.2. Every port tried from a pod timed out, so there
      # is no provable probe for it; `home-lan-gateway` above already traverses that peer, which is the
      # claim anyone would have wanted from .2 in the first place.
      - name: mesh-chiclana
        group: mesh
        url: tcp://192.168.133.3:9100
        interval: 1m
        client:
          timeout: 5s
        conditions:
          - "[CONNECTED] == true"
        alerts:
          - type: telegram
            failure-threshold: 3
            send-on-resolved: true

      # The techdelivery VPS as a mesh leaf. This peer exists for the leaf -> titan -> VPS path and
      # nothing else (nixos-configurations hosts/titan/configuration.nix), so a probe on the mesh
      # address is the only thing that tests the reason it is there. 13491 was proven open from a pod;
      # 22 on the same address times out, so it is not the port to use.
      - name: mesh-vps-leaf
        group: mesh
        url: tcp://192.168.133.5:13491
        interval: 1m
        client:
          timeout: 5s
        conditions:
          - "[CONNECTED] == true"
        alerts:
          - type: telegram
            failure-threshold: 3
            send-on-resolved: true

      # The etcd snapshot WRITE PATH, which is not the same claim as `casa-minio-backup-target` above.
      # That one is MinIO on the LAN at 192.168.0.6:9000. k3s writes its snapshots to
      # `s3.l.arrieta.eu` over 443 -- public DNS, casa's Traefik, a certificate, path-style bucket
      # lookup -- so the two fail independently, and only this one can fail because of a DNS or
      # ingress change. hosts/titan/vars.nix records four separate defects that lived in exactly this
      # endpoint string, and k3s reports a bad one SILENTLY in the server.
      #
      # What it still does not prove: that a snapshot RAN. That rule is a Prometheus alert on snapshot
      # age and lives in ../k8s-casa (TitanEtcdSnapshotStale and friends), not here.
      - name: casa-s3-etcd-path
        group: mesh
        url: https://s3.l.arrieta.eu/minio/health/live
        interval: 5m
        client:
          timeout: 10s
        conditions:
          - "[STATUS] == 200"
          # Measured with a verifying context: publicly trusted, 46.7d left. Worth a condition because
          # this is the one backup path whose failure mode includes a certificate this tree does not own
          # -- casa's cert, on casa's ingress, reached over the mesh.
        alerts:
          - type: telegram
            failure-threshold: 3
            send-on-resolved: true

      # The apex A record itself. Every HTTPS probe above fails after this breaks, and each fails in a
      # way that looks like its own outage; a DNS probe is the one that names the cause.
      #
      # THE SYNTAX WAS GOT WRONG FIRST AND IS RECORDED SO IT IS NOT REPEATED: `url` on a DNS endpoint is
      # the RESOLVER address bare (`1.1.1.1`), not `dns://1.1.1.1` -- there is no dns:// scheme, and the
      # query answer comes back in `[BODY]`, not a `[DNS_ANSWER]` placeholder, which does not exist.
      # Asserting the answer rather than only NOERROR is the point: a record that resolves to anything
      # else is a hijack or a migration half-applied, and both answer NOERROR.
      #
      # THE BRITTLE HALF, stated plainly: 37.187.159.156 is hardcoded, so a deliberate IP change needs
      # this edited in the same commit. That is the feature. A monitor that silently follows a moved
      # record is a monitor that cannot see the move.
      - name: dns-titan-apex
        group: dns
        url: 1.1.1.1
        interval: 15m
        client:
          timeout: 10s
        dns:
          query-name: titan.arrieta.eu
          query-type: A
        conditions:
          - "[DNS_RCODE] == NOERROR"
          - "[BODY] == 37.187.159.156"
        alerts:
          - type: telegram
            failure-threshold: 3
            send-on-resolved: true

      # DROPPED FROM THE VPS SET, with the reason rather than silence: `icmp://192.168.0.5` is the home
      # HA box, and `hass-home-public` above covers it through the whole user path (DNS -> Traefik ->
      # TLS -> HA) rather than just the box; `icmp://192.168.0.6` is casa, now covered by the MinIO
      # health probe, which is a stronger claim than reachability; `http://192.168.133.3:8123` is the
      # chiclana box, and `chiclana-hass-public` covers the same backend by way of
      # `apply/50-apps/chiclana-hass/chiclana-hass.yaml:38`. Three probes became three better ones.
      #
      # THE PROOF THIS FILE STILL OWES (#109's last clause): no alert from this Deployment has ever been
      # seen to arrive. The mechanism is wired — Secret `gatus-telegram`, token and chat id — but
      # "wired" is what a monitor says right up until the first outage it misses. To prove delivery
      # without waiting for a real failure, add a probe whose condition can never hold, let it cross
      # `failure-threshold`, confirm the message lands, and delete it:
      #
      #     - name: telegram-delivery-test
      #       url: https://hass.titan.arrieta.eu/
      #       interval: 1m
      #       conditions: [ "[STATUS] == 418" ]
      #       alerts: [ { type: telegram, failure-threshold: 1, send-on-resolved: true } ]
      #
      # It targets a host known to be healthy, so the only thing that can fail is the alert path.
      #
      # STILL NOT DONE, rewritten 2026-11-07 because the previous version of this paragraph was itself
      # stale -- it claimed a *stale* backup was "not alerted on from anywhere", which commit 2ef8df8
      # had already made false everywhere else in the repo and this file missed. Current state:
      #
      #   - Public hostnames: probed above. The five forwardAuth-gated hosts are probed at the cluster
      #     service level rather than through the public URL, because a gated public probe cannot see the
      #     app behind the login redirect. What remains genuinely unprobed is the authenticated path
      #     through the gate -- app health AND a working forwardAuth in one request.
      #   - Stale backups: alerting EXISTS and lives in ../k8s-casa (TitanBackupJobFailed,
      #     TitanBackupVolumeStale at 26h, and the absent() guard on the discovery loops). It has been
      #     observed firing in production, 2026-11-04, on a stale restic lock. Not this file's gap.
      #   - Telegram delivery: still owed, and it is the one above that gates trusting anything else
      #     here. The cert-condition bug sat invisible for exactly as long as delivery was unproven.
      #   - Titan watching titan: closed from the other side, not from here. See `titan auth` and
      #     `titan k8s api` in ../k8s-casa apply/50-apps/casa/gatus.yaml. Nothing added to this file
      #     can ever report that titan itself is down.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gatus
  namespace: gatus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gatus
  template:
    metadata:
      labels:
        app: gatus
      annotations:
        # Restart on ConfigMap change. Gatus hot-reloads a config file it can see change, but this
        # mount is the deterministic path and it is the pattern this repo already uses everywhere else
        # a ConfigMap is the whole of an app's behaviour. Without a restart mechanism a ConfigMap edit
        # can sit applied-and-ignored, which is the failure this Deployment is already famous for.
        reloader.stakater.com/auto: "true"
    spec:
      containers:
        - name: gatus
          image: twinproduction/gatus:v5.37.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: TELEGRAM_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gatus-telegram
                  key: TELEGRAM_TOKEN
            - name: TELEGRAM_BOT_ID
              valueFrom:
                secretKeyRef:
                  name: gatus-telegram
                  key: TELEGRAM_BOT_ID
            # Gatus reads `config/config.yaml` relative to its working directory unless told otherwise,
            # and the WORKDIR of the upstream image is not something this manifest should have to trust.
            # Naming the absolute path is what makes the mount below provable rather than hopeful.
            - name: GATUS_CONFIG_PATH
              value: /config/config.yaml
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            # THE MOUNT THAT WAS MISSING. Until 2026-11-19 this Deployment had no `volumes` and no
            # `volumeMounts` at all: the `gatus-config` ConfigMap was built, applied, listed in the
            # stage kustomization, reviewed, and never read by the container. Gatus falls back to the
            # example config shipped in the image when its config file is absent, so the pod monitored
            # `front-end`, `back-end`, `icmp-ping`, `nas`, `monitoring`, `check-domain-expiration` and
            # `example-dns-query` -- gatus's own demo endpoints -- for the entire life of the
            # Deployment.
            #
            # Nothing downstream noticed, and that is the part to keep. `/health` returns
            # {"status":"UP"} from the HTTP server regardless of which config loaded, so readiness and
            # liveness were green; the status page rendered; the Ingress served; and not one real probe
            # had ever run. Every claim this file makes about what titan watches was, until the mount
            # landed, a claim about a file Flux keeps current and nothing reads.
            #
            # Mounted as a directory, not a subPath: a subPath mount is never refreshed when the
            # ConfigMap changes, so it would have reintroduced the same applied-and-ignored shape in a
            # subtler form. With a directory mount kubelet repoints the file and gatus hot-reloads; the
            # Reloader annotation above is the deterministic backstop.
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: gatus-config
---
# The status page, published.
#
# `uptime.v.arrieta.eu` on the VPS was gatus under a different name, which is why #109 migrated the
# workload without anyone noticing it was also the thing people actually look at. Titan's gatus arrived
# as a ConfigMap and a Deployment and nothing else — no Service, no Ingress — so for sixteen days it
# could only ever push Telegram alerts while the public status page stayed on a box scheduled for
# release. Recorded in `docs/vps-auth-cutover.md`; the hostname/workload name mismatch is the reason
# neither repo ever connected them.
#
# WHY GATED AND NOT OPEN. A gatus page is a rendered map of the internal network: the probe list added
# in #109 names LAN addresses and internal service names (`home-lan-gateway`,
# `casa-minio-backup-target`, `192.168.0.29`). "It's only a status page, leave it open" is the wrong
# default when the page's whole content is topology. So it takes the same shared outpost as bentopdf and
# vert-sh — mode `forward_domain` with `cookie_domain: titan.arrieta.eu`, so `host.ends_with()` matches
# `uptime.titan.arrieta.eu` and **no authentik change is needed**. The cost is #245's cost, now with a
# fifth host behind that one provider (`tesla`, `vert`, `bentopdf`, `investing-agent` and this one,
# counted off the `router.middlewares` references in the tree rather than by feel): admission is the
# `tesla` Application's group, which is semantically wrong for a monitoring page and remains tracked
# there rather than being silently accepted here.
#
# **The gate has a known cost, and it is #243's cost, not a new one.** Gatus is a Vue SPA that polls its
# own status API (`/api/v1/endpoints/statuses`, 5m default refresh), and authentik mints the outpost
# cookie only when a browser follows a top-level navigation through the outpost — an XHR can never
# complete the redirect that mints one. When the cookie ages, Traefik 302s the poll, the fetch receives
# HTML instead of JSON, and the page renders empty while the pod is healthy and a reload silently fixes
# it. `docs/grafana-runbook.md` §10 measured the aging gaps at 588s, 364s and 987s, and removed this
# exact Middleware from both Grafanas for exactly this reason. That exit is not available here: the
# page's entire content is topology, so the edge gate is the only gate it has, and widening
# `skip_path_regex` is rejected on blast radius in `docs/teslamate-runbook.md` §9 because it exempts the
# path on every host under the apex. The accepted residual is therefore a status page that wants a
# reload after roughly ten to fifteen idle minutes. **One browser load does not prove this works** — the
# cookie is fresh on first load. The check that would is leaving the tab open twenty minutes and watching
# whether the tiles go stale.
#
# And nothing watches the watcher. gatus probes casa and the two Home Assistant instances
# (`apply/50-apps/home-hass/home-hass.yaml:50`) and nothing probes gatus, so a gatus pod that stops
# serving is a blank page and no alert. Pre-existing — #109 shipped that shape — but publishing the page
# is what makes it user-visible, and it wants a ticket rather than silence.
#
# `gatus` also had to be added to the Reflector allow-list in
# `apply/40-certificates/titan-wildcard.yaml` — `titan-tls` is not reflected into a namespace that has
# not asked for it, and copying the Secret by hand is what #221 exists to forbid.
#
# WHY THE MIDDLEWARE IS COPIED RATHER THAN REFERENCED. `tools/ingress-auth-check.py` rule 2 requires the
# middleware reference to resolve in the Ingress's own namespace — Traefik resolves a CRD middleware
# against the Ingress's own namespace — and rule 3 then demands the reference be written namespace-
# qualified, because the bare form means "whichever namespace this Ingress happens to be in", which is
# how a namespace move turns into a dangling reference. So `gatus` cannot point at `apps/teslamate-auth`
# and the spec below is a field-for-field copy of it.
#
# **The drift this accepts, stated correctly.** `apps/teslamate-auth` is NOT generated by authentik.
# Flux owns it — measured 2026-11-06: `kubectl --context titan get middleware -n apps teslamate-auth
# -o jsonpath='{.metadata.ownerReferences}{.metadata.labels}'` returns no ownerReferences and
# `kustomize.toolkit.fluxcd.io/name=tesla` — and its source of truth is
# `apply/60-tesla/teslamate.yaml:172`. So the two copies can only drift when someone edits git, and
# that IS checkable from the tree: `ingress-auth` rule 6 fails any forwardAuth pointing at the outpost
# address that does not match the canonical field for field. What no offline gate sees is a change made
# out of band to the live object — `kubectl edit` on a Flux-managed Middleware, which this repo forbids
# for exactly that reason. If it happened anyway the copy breaks **closed**: an unresolvable forwardAuth
# is a 403, not an open door. That asymmetry is the whole reason to hand-copy an auth path rather than
# leave the page open. If #245 ever gives titan a general-purpose application, this object is the thing
# to delete.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: status-auth
  namespace: gatus
spec:
  forwardAuth:
    address: http://authentik-server.auth.svc.cluster.local/outpost.goauthentik.io/auth/traefik
    maxResponseBodySize: 4194304
    trustForwardHeader: true
---
apiVersion: v1
kind: Service
metadata:
  name: gatus
  namespace: gatus
  labels:
    app: gatus
spec:
  selector:
    app: gatus
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gatus
  namespace: gatus
  annotations:
    # Both lines are load-bearing. Drop the middleware and the host answers openly, and `ingress-auth`
    # rules 1-4 are what catch that. Drop the entrypoint pin and this same forwardAuth also runs on
    # cleartext :80 — and this cluster runs no HTTP->HTTPS redirect (see the `ports.web` note in
    # apply/20-infra/traefik/traefik.yaml), so an unpinned host answers in the clear rather than
    # redirecting. That half is caught only because `gatus/gatus` is named in PIN_REQUIRED in
    # tools/ingress-auth-check.py; it is not free. See the bentopdf file for the longer version.
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: gatus-status-auth@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: uptime.titan.arrieta.eu
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gatus
                port:
                  name: http
  tls:
    - hosts:
        - uptime.titan.arrieta.eu
      secretName: titan-tls

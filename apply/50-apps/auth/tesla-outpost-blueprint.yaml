apiVersion: v1
kind: ConfigMap
metadata:
  # Named `authentik-tesla-blueprint` so it reads beside authentik-coder-blueprint and
  # authentik-google-blueprint, which are Secrets. This one is a ConfigMap on purpose: it carries no
  # credential, and a ConfigMap is readable in plain view by anyone who can read the namespace — which
  # is exactly the right exposure for a proxy provider definition and exactly the wrong one for
  # coder's client_secret. See docs/superpowers/specs/2026-10-17-titan-teslamate-authentik-outpost-design.md §5.
  name: authentik-tesla-blueprint
  namespace: auth
data:
  # Only keys ending in .yaml are discovered by the worker (chart authentik-2026.8.3,
  # values.yaml:220-226 — the chart offers blueprints.configMaps and blueprints.secrets and nothing
  # else; there is no inline blueprints.entries in this release).
  tesla.yaml: |
    # authentik blueprint: forward-auth for TeslaMate and Grafana, served by the embedded outpost.
    #
    # WHY A BLUEPRINT AND NOT A UI CLICK
    # authentik ships no CRDs (verified on this cluster; the pinned chart has no crds/ directory), so
    # blueprints are the only declarative path. A rebuilt authentik gets these objects back from git.
    #
    # WHY THERE IS NO OUTPOST DEPLOYMENT AND NO SERVICE CONNECTION HERE
    # The proxy outpost is Rust (src/outpost/proxy/ in the authentik tree) and the *embedded* one runs
    # inside authentik-server. That outpost already exists on this cluster: outposts/apps.py creates
    # it on reconcile as MANAGED_OUTPOST = "goauthentik.io/outposts/embedded",
    # MANAGED_OUTPOST_NAME = "authentik Embedded Outpost", type PROXY. It is what serves
    # /outpost.goauthentik.io/auth/traefik, and it answered 404 here before this blueprint for exactly
    # one reason — it had no providers attached, and OutpostSerializer's own comment
    # (outposts/api/outposts.py:42-43, "allow_empty=True for the embedded outpost with no providers")
    # is the other half of the same fact.
    #
    # So this blueprint does not create an outpost. It attaches a provider to the one authentik made.
    #
    # ...and attaching the provider is NOT SUFFICIENT, which cost hours of outage to learn. The provider
    # must also be owned by an Application, or the outpost cannot see it at all. See the application
    # entry below, which carries the full explanation.
    # Editing the managed outpost is allowed on purpose, and the serializer says so twice:
    #   validate_name      (outposts/api/outposts.py:60-69)  -> only the name is frozen
    #   validate_providers (outposts/api/outposts.py:69-90)  -> returns early for the managed outpost,
    #                                                          so its provider list is manageable
    # A service connection is not needed and cannot be declared here: OutpostServiceConnection is not a
    # SerializerModel (outposts/models.py:121 — only the Docker and Kubernetes subclasses are, :181 and
    # :232), and it is in the blueprint importer's excluded list (blueprints/v1/importer.py:80, with
    # the check at :91). That is not an obstacle to work around; it is authentik saying connections are
    # discovered, not declared. Outpost.service_connection is null=True anyway, with the help text
    # "Leave empty if authentik should not handle the deployment" (models.py:271-280) — which is the
    # embedded case exactly.
    #
    # THE CONSEQUENCE OF THIS CHOICE, STATED OUT LOUD
    # This blueprint now OWNS the embedded outpost's provider list. A provider added to the embedded
    # outpost in the UI will be removed by the next apply of this file, because `providers` is set, not
    # appended to. Any future proxy provider must be added here or in its own blueprint that also
    # carries the full list — not clicked into existence.
    #
    # WHAT THE PROVIDER SETTINGS ARE FOR
    # mode: forward_domain — one provider covering titan.arrieta.eu, so TeslaMate and Grafana share
    #   one session cookie and one login covers every host under the domain. The alternative,
    #   forward_single per host, would make each host authenticate independently for no gain here.
    #   An earlier note justified this by TeslaMate framing Grafana in an iframe and a second
    #   authentication having to "complete inside the frame". That was never true: TeslaMate 4.3's
    #   Dashboards menu links out with target="_blank" and the app contains no iframe at all. The
    #   setting is still correct — one cookie is simply less friction — but it is not load-bearing for
    #   any embed, because there is none. Field and choices read from
    #   authentik/providers/proxy/models.py:87-95.
    # cookie_domain — so that one cookie is accepted by every host under it. models.py:141.
    # skip_path_regex — THE PUBLIC KEY MUST STAY PUBLIC. Tesla's servers fetch
    #   https://tesla.titan.arrieta.eu/.well-known/appspecific/com.tesla.3p.public-key.pem during
    #   pairing, and when that 404s Tesla reports "application has not registered", which points at
    #   the wrong thing entirely (docs/teslamate-runbook.md §8). Excluding it here keeps the exception
    #   in one place with one test, rather than also encoding it in Traefik route priority.
    #   Field and its own help text: models.py:96-103 ("Each new line is interpreted as a new
    #   Regular Expression").
    #
    # WHAT IS DELIBERATELY ABSENT
    # internal_host is left unset: it is "Exclusive with" forward-auth mode per the field's own help
    # text (models.py:87-94), and setting it would silently change what the provider does.
    # intercept_header_auth is left at its default: nothing here authenticates by header.
    #
    # WHO MAY REACH THESE HOSTS IS DECIDED ON THE APPLICATION, NOT HERE — and an older note in this
    # file said otherwise. It claimed `access_group` was left unset and that tightening it was a
    # separate change. That field no longer exists: `grep -rn access_group authentik/providers/
    # authentik/core/models.py` at the pinned 2026.8.5 returns nothing, and the base `Provider` model
    # (core/models.py:630) carries only the three flows and property_mappings. The comment described
    # an authentik that is not the one running here.
    #
    # The live mechanism is a policy binding on the Application below. A ProxyProvider IS an
    # OAuth2Provider (providers/proxy/models.py:73), so the outpost's redirect to
    # /application/o/authorize/ lands on AuthorizationFlowInitView (providers/oauth2/views/
    # authorize.py:427), which is a PolicyAccessView: it resolves `self.application =
    # self.provider.application` and runs PolicyEngine over THAT application's bindings
    # (policies/views.py:133-139). With no bindings the engine's empty result is
    # AppAccessWithoutBindings (core/apps.py:16), whose default is True and whose own description is
    # "Applications with no policies bound can be accessed by any user". That, not an unset field, is
    # why every authentik user could reach TeslaMate until now.
    version: 1
    metadata:
      name: titan-tesla
    entries:
      # The provider. `id` is set so the outpost entry below can point at it with !KeyOf instead of
      # hunting the database for an object this same blueprint creates — the pattern
      # authentik/blueprints-coder.yaml already uses, and the reason is recorded there: validate()
      # runs the whole import inside a rolled-back transaction (blueprints/v1/importer.py:453-474),
      # so a !Find against an object created in this blueprint would not see it.
      - model: authentik_providers_proxy.proxyprovider
        id: titan-tesla-provider
        identifiers:
          name: titan-tesla
        state: present
        attrs:
          name: titan-tesla
          # The callback host, not the app host. authentik builds the OIDC redirect_uri from
          # external_host, and the apex `titan.arrieta.eu` this used to name has NO ingress and no
          # router — measured: `https://titan.arrieta.eu/outpost.goauthentik.io/callback` returns 404
          # from Traefik, while the same path on `auth.` returns 400 from authentik (handled, just
          # missing its state params). So sign-in would have died at the callback, after a perfectly
          # good authenticate.
          #
          # `auth.` is already routed to authentik-server, and the embedded outpost only claims
          # `/outpost.goauthentik.io/*` plus signed callback/logout queries on it
          # (src/outpost/proxy/application/mod.rs:192-202), so authentik's own UI on that host is
          # untouched. Verified, not assumed: `should_handle_url` returns false for `/` in
          # forward_domain mode.
          #
          # This does NOT change which hosts get gated — that is cookie_domain below.
          external_host: https://auth.titan.arrieta.eu
          mode: forward_domain
          cookie_domain: titan.arrieta.eu
          skip_path_regex: '^/\.well-known'
          # Both flows are required by the Provider base with no default, and the live apply is what
          # said so. The first apply of this blueprint was rejected with exactly:
          #   Entry invalid: Serializer errors {'authorization_flow': ['This field is required.'],
          #                                     'invalidation_flow': ['This field is required.']}
          # and nothing reached stdout: blueprints/v1/tasks.py:211-222 hands the captured importer logs
          # to self.logs(), so the rejection text lives as TaskLog rows on the apply_blueprint task
          # (uid = slugify of the blueprint name) and `kubectl logs` shows a clean run.
          #
          # These were the ONLY two missing. DRF reports every failing field in one pass, and the rest
          # of the OAuth2Provider inheritance has defaults: client_id is default=generate_id
          # (providers/oauth2/models.py:233-238), client_secret and logout_uri are blank=True (:239-253),
          # signing_key and encryption_key are null=True (:321-329). So this is the complete set, not
          # the first of several rounds.
          #
          # !Find and not a lookup dict: these are PrimaryKeyRelatedFields, and the importer only rewrites
          # values that are keys in its own pk_map (blueprints/v1/importer.py:175-197), so a dict reaches
          # the serializer verbatim and dies with "is not a valid UUID". authentik/blueprints-coder.yaml
          # records its own first apply failing the same way. !Find runs .filter(...).first() and
          # resolves to the pk (blueprints/v1/common.py:369-413).
          #
          # implicit-consent, not explicit: this cluster serves one operator, and a consent screen for an
          # app they own adds a click and no security. Same reasoning coder's provider carries.
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          # The shipped provider invalidation flow — a stage-less terminal page, "You've logged out of
          # %(app)s" (blueprints/default/flow-default-provider-invalidation.yaml). coder's OIDC provider
          # points at the generic default-invalidation-flow instead; this is the provider-specific one and
          # the right landing page for a proxy logout. The divergence from coder is deliberate, not an
          # oversight — they are different objects with different content.
          # Both slugs are proven present on this cluster, not assumed: their blueprints appear in
          # BlueprintInstance as successful (default/flow-default-provider-invalidation.yaml and
          # default/flow-default-provider-authorization-implicit-consent.yaml).
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

      # The Application that owns the provider. THIS ENTRY IS WHAT MAKES THE OUTPOST WORK, and its
      # absence is why TeslaMate answered 404 on every path with nothing in any log pointing at it.
      #
      # The embedded outpost gets its provider list from /outposts/proxy/, served by
      # ProxyOutpostConfigViewSet, whose queryset is literally:
      #     ProxyProvider.objects.filter(application__isnull=False)
      # (authentik/providers/proxy/api.py:184-188). A proxy provider with no Application is therefore
      # INVISIBLE to the outpost. Not an error, not a warning: the list comes back empty, no apps are
      # built, and every host falls through to the core router, which answers 404.
      #
      # And the reason nothing was logged about it, in the outpost's own words (src/outpost/proxy/mod.rs:129):
      #     if providers.is_empty() && !self.controller.is_embedded() {
      #         warn!("no providers assigned to this outpost, check outpost configuration in authentik");
      #     }
      # The warning is suppressed for embedded outposts specifically — the one case where an empty list
      # is normal at startup and pathological afterwards, with no way to tell those apart from outside.
      #
      # Everything else was ruled out by measurement, not assumption: the outpost's service account had
      # view permission on the provider (True), mode was 'forward_domain' and cookie_domain
      # 'titan.arrieta.eu' (both correct, and `host.ends_with(cookie_domain)` matches tesla.), a full
      # authentik-server restart changed nothing, and `application` was None. That last one was the only
      # anomaly left.
      #
      # One application, not two: the provider is forward_domain over titan.arrieta.eu and serves both
      # TeslaMate and Grafana, so this is the group of apps rather than TeslaMate's own page.
      - model: authentik_core.application
        id: tesla-application
        identifiers:
          name: tesla
        state: present
        attrs:
          name: Tesla
          slug: tesla
          # !KeyOf for the same reason authentik/blueprints-coder.yaml does it: the provider is created
          # by this blueprint, and KeyOf fails loudly if the entry order ever changes, instead of writing
          # a null provider that validates fine and then does nothing — which is precisely the failure
          # this entry exists to prevent, so it must not be able to fail silently.
          provider: !KeyOf titan-tesla-provider
          meta_launch_url: https://tesla.titan.arrieta.eu/
          # Written out rather than inherited, for the same reason blueprints-observability.yaml does:
          # `any` is the default, and a security decision should not live in a default a future release
          # is free to change.
          policy_engine_mode: any

      # --- who may reach the outpost at all -------------------------------------------------------
      # This is the gate that closes TeslaMate to "any authentik-authenticated user", and it is the
      # only place it CAN be closed. See the header: the provider has no access field any more, so the
      # binding on this Application is the mechanism.
      #
      # WHY THE UNION OF THREE GROUPS AND NOT JUST titan-family. The provider is forward_domain over
      # titan.arrieta.eu, so this one Application fronts tesla, tesla-boards AND grafana — the outpost
      # has exactly one provider attached and resolves every host under the domain to it. A binding
      # narrower than what each of those three hosts already allows at its own layer would therefore
      # lock an admin out of Grafana while trying to close the car. So the edge admits the union of
      # what grafana.titan (titan-family | titan-grafana-admins) and tesla-boards
      # (titan-family | titan-tesla-grafana-admins) already admit, and each app still decides its own
      # access and its own role afterwards. Net effect: nobody loses anything they had, and anyone in
      # none of the three — which is what a new family account like an opencloudUser-only user is —
      # loses TeslaMate, which is the point.
      #
      # ONE OF THE THREE REASONS LEFT THE OUTPOST ON 2026-11-05. grafana.titan no longer passes through
      # here — its forwardAuth Middleware was removed because the outpost cookie only refreshes on a
      # top-level navigation and it 302'd every XHR panel poll (docs/grafana-runbook.md §10). So the
      # union is now justified by two hosts, not three: titan-family and titan-tesla-grafana-admins by
      # tesla and tesla-boards, and NOTHING behind this outpost needs titan-grafana-admins any more —
      # that group gates grafana.titan, which is decided by the `observability` application's own
      # bindings now. It is left in place rather than dropped: this binding is an allow-list, so
      # removing a group here only ever refuses people, the membership check below has to be re-run
      # before any edit here, and a PR that both moves a gate and narrows another one is two changes
      # pretending to be one. Narrowing it is a separate decision with its own membership proof.
      #
      # THE FAILURE MODE IS A LOCKOUT THAT INCLUDES YOU. A binding naming a group that does not exist
      # denies, and once ANY binding exists the no-bindings allow-all stops applying. Membership was
      # checked before this landed. Re-check it if this list ever changes — and keep it on ONE line,
      # because `ak shell -c` exec()s its argument, so a wrapped command is an IndentationError:
      # kubectl --context <admin> -n auth exec deploy/authentik-worker -- ak shell -c 'from authentik.core.models import Group; [print(n, "MISSING" if not Group.objects.filter(name=n).exists() else sorted(Group.objects.get(name=n).users.values_list("username", flat=True))) for n in ["titan-family","titan-grafana-admins","titan-tesla-grafana-admins","authentik Admins"]]
      # Measured 2026-11-04 on 2026.8.5: titan-family = cathy_torrecilla, chuset, javier; both admin
      # groups = javier. So javier passes on all three and is not lockable by this change. akadmin is
      # in NONE of them and therefore loses these four hosts — deliberate, but note it is the account
      # someone might reach for as break-glass. authentik's own UI is not behind this outpost, and
      # Grafana keeps GF_AUTH_BASIC_ENABLED=true, so neither is a dead end.
      # Recovery if it goes wrong is not a revert — a revert needs to be applied, and the person who
      # cannot reach authentik's UI is the person who would normally apply it. It is adding yourself
      # back to titan-family in the authentik admin UI, which is still reachable because authentik's
      # own host is not behind this outpost.
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf tesla-application
          order: 0
        state: present
        attrs:
          group: !Find [authentik_core.group, [name, titan-family]]

      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf tesla-application
          order: 1
        state: present
        attrs:
          group: !Find [authentik_core.group, [name, titan-grafana-admins]]

      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf tesla-application
          order: 2
        state: present
        attrs:
          group: !Find [authentik_core.group, [name, titan-tesla-grafana-admins]]

      # The outpost authentik created for itself. The identifier must match MANAGED_OUTPOST_NAME
      # exactly, and `type` must be present in attrs: validate_providers dispatches on
      # initial_data["type"] (outposts/api/outposts.py:69-88), and a proxy provider only passes the
      # ProxyProvider branch. !KeyOf resolves inside a list because the tag walker descends into both
      # lists and dicts (blueprints/v1/common.py:133-146) and returns the entry's pk
      # (common.py:239-253) — which is what OutpostSerializer wants, providers being a
      # PrimaryKeyRelatedField (outposts/api/outposts.py:44).
      - model: authentik_outposts.outpost
        identifiers:
          name: authentik Embedded Outpost
        state: present
        attrs:
          name: authentik Embedded Outpost
          type: proxy
          providers:
            - !KeyOf titan-tesla-provider

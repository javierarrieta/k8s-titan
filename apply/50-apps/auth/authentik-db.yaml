# authentik's database and role, authored next to the app that owns them so a reviewer
# sees the whole dependency in one directory (spec 4 A4/A5). Both live in `databases`:
# a CNPG Database must share a namespace with its Cluster, so "where the app lives" loses
# to "where the cluster lives" and that is not negotiable.
#
# The password is NOT here. It is in apply/10-secrets/authentik-secrets.yaml, encrypted,
# and referenced by name. This file is safe to read in a public repo because it holds no
# credential - which is the whole reason DatabaseRole exists as a separate kind.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: authentik
  namespace: databases
spec:
  name: authentik
  owner: authentik
  cluster:
    name: postgres
---
# Exactly one DatabaseRole may exist for this role. The plan's staging snippet also
# carried one, so that the shape was visible while authoring the encrypted Secret;
# committing both makes CNPG reject the duplicate. The committed copy is this one, in git,
# unencrypted, where a reviewer can read it.
#
# DatabaseRole has no `managePassword` field - it takes `passwordSecret`, and that Secret
# must be kubernetes.io/basic-auth (username + password keys), which is why
# authentik-db-credentials is that type rather than Opaque. The username in that Secret must
# match the role name, or the password is set for a role nobody connects as.
#
# NOTE ON THE MISSING cnpg.io/reload LABEL: it belongs on the referenced *Secret*, not on
# the DatabaseRole. Upstream (declarative_role_management.md, v1.30.1): "Password changes
# in labeled Secrets are applied immediately, while changes in unlabeled Secrets are only
# applied at a subsequent reconciliation." The plan had it here, which does nothing. The
# label is on authentik-db-credentials in apply/10-secrets/, where it actually works.
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: authentik
  namespace: databases
spec:
  name: authentik
  cluster:
    name: postgres
  # Required, and easy to miss because nothing complains when it is absent. CNPG creates the
  # role NOLOGIN by default - the CRD has no default for `login` - so without this the role
  # exists, the Database reports it as its owner, and every connection attempt fails with
  # "role authentik is not permitted to connect". Observed live: `\du authentik` returned
  # "Cannot login" and the Database was stuck on `role "authentik" does not exist`.
  login: true
  passwordSecret:
    name: authentik-db-credentials

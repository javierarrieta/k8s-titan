# authentik, the reason this cluster exists. Chart 2026.8.3 verified by pulling it:
# Chart.yaml appVersion 2026.8.3, and `grep -ci redis values.yaml` returns 0 - Redis was
# removed in authentik 2025.10, so a redis: block would be dead weight that reads as if
# something needed it.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: authentik-repo
  namespace: auth
spec:
  interval: 12h
  url: https://charts.goauthentik.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: auth
spec:
  releaseName: authentik
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: authentik
      version: "2026.8.3"
      sourceRef:
        kind: HelmRepository
        name: authentik-repo
  driftDetection:
    mode: enabled
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    # authentik's own infrastructure-as-code channel (spec C12). The worker discovers mounted
    # blueprints and applies them against its own API, so coder's OIDC client is declared in git
    # rather than clicked in a UI - which matters because a rebuilt authentik would otherwise come
    # back with no coder client at all. Only keys ending in .yaml are picked up (values.yaml:220).
    #
    # A Secret and not a ConfigMap: the blueprint carries coder's client_secret, and a ConfigMap
    # would put a live credential in plain view of anyone who can read the namespace. It is rendered
    # from authentik/blueprints-coder.yaml by scripts/setup-coder-secrets.sh and lives,
    # sops-encrypted, in apply/10-secrets/ like every other credential here. `make oidc-check` fails
    # if this mount is removed while the Secret still exists - the state where the blueprint is
    # perfectly valid, perfectly applied to the cluster, and perfectly invisible to authentik.
    blueprints:
      # Mounting is not applying. authentik's worker discovers these on its own schedule and can skip a
      # newly added file entirely — see docs/authentik-runbook.md §5 for the probe and for
      # `ak apply_blueprint`, which is the deterministic path.
      secrets:
        - authentik-coder-blueprint
        # Google social login. Mounted the same way, discovered by the same worker loop, and subject
        # to the same trap: a valid blueprint that is never mounted looks exactly like a blueprint
        # that was never written.
        - authentik-google-blueprint
        # Grafana's OIDC client. A Secret, not a ConfigMap, because it carries the client_secret —
        # the same line the tesla outpost blueprint sits on the other side of. Note this is an OIDC
        # provider and is NOT in the embedded outpost's provider list; that list is proxy-only and
        # belongs to apply/50-apps/auth/tesla-outpost-blueprint.yaml.
        - authentik-grafana-blueprint
        # open-webui's OIDC client. A Secret, not a ConfigMap, because it carries the client_secret —
        # the same line the tesla outpost blueprint sits on the other side of. It is NOT in the
        # embedded outpost's provider list: that list is proxy-only and belongs to
        # apply/50-apps/auth/tesla-outpost-blueprint.yaml.
        - authentik-open-webui-blueprint
        # Grafana's OIDC client for grafana.titan.arrieta.eu — a DIFFERENT Grafana from the
        # authentik-grafana-blueprint above, which is Tesla's (slug tesla-boards). A valid blueprint
        # that is never mounted is indistinguishable from one that was never written: the worker only
        # reads what is listed here. Same trap the tesla and open-webui entries above record.
        - authentik-observability-blueprint
      # A ConfigMap, not a Secret: this blueprint carries no credential, so it gets the exposure that
      # matches — readable by anyone who can read the namespace, which is fine for a proxy provider
      # definition and would not be for coder's client_secret. The outpost it declares is the embedded
      # one inside authentik-server, so there is no outpost token to encrypt either
      # (OutpostServiceConnection.local, outposts/models.py:127).
      configMaps:
        - authentik-tesla-blueprint
        # oCIS's OIDC client. A ConfigMap rather than a Secret because oCIS cannot carry a client
        # secret at all - the web service's OIDC block has a ClientID and no secret, so the client is
        # public by construction (see apply/50-apps/auth/ocis-blueprint.yaml). Same mount-not-apply
        # trap as every entry above: authentik's worker only reads what is listed here, and a
        # blueprint that is never mounted is indistinguishable from one that was never written.
        - authentik-ocis-blueprint
    authentik:
      log_level: info
      error_reporting:
        # Sends stack traces to authentik's own Sentry. Opt-in, and off here.
        enabled: false
      listen:
        # 2026.8 is a breaking change: forwarded headers (X-Forwarded-For/-Proto/-Host) are
        # honoured ONLY from listed CIDRs. Get this wrong and HTTPS is interpreted as HTTP -
        # blocked mixed content, an endless spinner, or an auth error, with nothing in the logs.
        #
        # Two traps, both checked against the docs rather than assumed:
        #   * the format is a COMMA-SEPARATED STRING, not a JSON list. authentik's own fix
        #     (goauthentik/authentik#8075) says the format is '127.0.0.0/8,::1/128' and
        #     explicitly not '["127.0.0.0/8","::1/128"]'.
        #   * setting this REPLACES the defaults, which already include 10.0.0.0/8 - and
        #     titan's pod CIDR 10.62.0.0/16 sits inside it. So not setting it at all would
        #     work. This is a deliberate tightening, which is why loopback rides along:
        #     without 127.0.0.0/8, `kubectl port-forward` debugging gets no forwarded headers.
        trusted_proxy_cidrs: "10.62.0.0/16,127.0.0.0/8"
      web:
        path: /
        # Recommended now, REQUIRED in 2026.11. Free to set today, removes an upgrade surprise.
        base_url: https://auth.titan.arrieta.eu/
      postgresql:
        # CNPG's read-write service. The chart's own default is '{{ .Release.Name }}-postgresql',
        # i.e. the bundled subchart we are not using.
        host: postgres-rw.databases.svc.cluster.local
        port: 5432
        name: authentik
        user: authentik
        # password deliberately absent - empty values are skipped by the chart's env helper,
        # so it comes from the Secret below and nothing else can shadow it.
    global:
      # The chart's own mechanism for injecting env from a Secret. There is deliberately NO
      # valuesFrom here: Flux's default valuesKey is values.yaml, and a Secret reference
      # without that key fails the release with "key not found" - which looks like a Flux bug
      # rather than a misconfiguration. `make release-secrets` scans this exact path so the
      # Secret name is still checked offline.
      envFrom:
        - secretRef:
            name: authentik-secrets
    postgresql:
      # The bundled Bitnami subchart. Off: the database is the shared CNPG Cluster.
      enabled: false
    server:
      replicas: 1
      # AUTHENTIK_SECRET_KEY and the Postgres password arrive through `envFrom` (see the envFrom block
      # above), and a container's environment is fixed at creation - so rotating either one changes the
      # Secret and nothing else, the exact defect Reloader exists for. The blueprint Secrets are NOT
      # listed here: the server does not apply blueprints, so restarting it for a blueprint edit would be
      # an auth outage for no behaviour.
      podAnnotations:
        secret.reloader.stakater.com/reload: authentik-secrets
      service:
        type: ClusterIP
      ingress:
        enabled: true
        ingressClassName: traefik
        hosts:
          - auth.titan.arrieta.eu
        tls:
          - hosts:
              - auth.titan.arrieta.eu
            # Reflector's copy of the Certificate from `certificates` (Task 6). Not created
            # by this release, and NOT checked by make release-secrets - the gate scans
            # valuesFrom and envFrom.secretRef, never ingress secretName, on purpose.
            secretName: titan-tls
    worker:
      replicas: 1
      # Two different failure modes, both worth a restart:
      #  * authentik-secrets - same envFrom defect as the server.
      #  * the two blueprint Secrets - these are VOLUME-mounted, so kubelet rewrites the file in place
      #    and the pod never notices. That is not the problem here: authentik's worker only *discovers*
      #    mounted blueprints hourly plus at startup, so a blueprint edit would otherwise sit unread for
      #    up to an hour after a merge. That delay is what made PR #42's fix look like it had not landed.
      podAnnotations:
        secret.reloader.stakater.com/reload: "authentik-secrets,authentik-coder-blueprint,authentik-google-blueprint,authentik-grafana-blueprint,authentik-open-webui-blueprint,authentik-observability-blueprint"
        # The Tesla blueprint arrives as a ConfigMap and needs the same treatment for the same reason:
        # kubelet rewrites the mounted file in place and the worker only discovers blueprints hourly
        # plus at startup, so an edit would otherwise sit unread for up to an hour after a merge.
        # Worker only, deliberately — the comment above records that the server does not apply
        # blueprints, so restarting it for a blueprint edit would be an auth outage for no behaviour.
        configmap.reloader.stakater.com/reload: authentik-tesla-blueprint

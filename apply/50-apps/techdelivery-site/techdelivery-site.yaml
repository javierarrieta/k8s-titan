# techdelivery-site — the public marketing site at https://www.techdelivery.es.
#
# WHAT THIS IS: a bilingual (EN/ES) static HTML/CSS/JS page built in
# github.com/Techdelivery/techdelivery_site, containerised there as
# nginxinc/nginx-unprivileged serving three files. No database, no volume, no credentials, no
# server-side logic — the closest relative in this tree is vert-sh: nginx serving a static build.
# That shape is why this app needs nothing from 30-databases, nothing from 10-secrets, and no
# backup annotation: the image IS the state, and the state is in git.
#
# PUBLIC BY DECISION, NOT BY OMISSION. This is a marketing site; it is meant to be readable by
# everyone on the internet. Its Ingress carries no AUTH middleware; the only Middlewares are the two
# redirects below (cleartext->HTTPS, apex->www). Note that tools/ingress-auth-check.py does NOT see
# this host: that gate is scoped to APEX=titan.arrieta.eu and treats off-domain hosts as out of
# scope, so this header is the record of the decision, not a NOT_PROXY_GATED row. What is
# deliberately NOT here: forwardAuth (nothing to gate) and analytics. HSTS IS set — one year, no
# includeSubDomains — but it lives in the image (security-headers.conf in the site repo), not here;
# the header of that file states why the assertion is scoped to this host and not the apex.
#
# CANONICAL HOST: www.techdelivery.es. The apex also resolves here (the A record was moved off the
# mail host in November 2026; ../public-dns-tf still declares the old target and needs a drift PR)
# and serves nothing but a 301 to www — one host answers content, the other only points. The apex
# therefore needs its own SAN on the Certificate: an apex request that gets Traefik's fallback
# default cert reads as "invalid certificate" to the browser before any redirect can run.
#
# STATUS OF THE TWO EXTERNAL DEPENDENCIES (both resolved 2026-11-14, kept as the record):
#   1. DNS: `www` and the apex both answer 37.187.159.156 (titan). The OVH redirect product was
#      cancelled and the records moved; the public-dns-tf declarations are the open follow-up.
#   2. IMAGE PULL: the ghcr package was flipped to public; anonymous pull returns a token. Public
#      is the chosen shape: the image is public files in nginx, and the private thing is the source
#      repo, not the artifact.
#
# IMAGE PINNED BY DIGEST, per the house rule: `kubectl rollout undo` against a mutable tag is a
# no-op, and a digest is the only thing that makes rollback real. The digest is the one
# `Publish image` run of techdelivery_site publishes; the release flow is: push site repo -> read
# digest from the workflow log -> one-line digest bump PR here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: techdelivery-site
  labels:
    app: techdelivery-site
  namespace: site
spec:
  # One replica: single-node cluster, so a second copy guards against nothing — a dead node takes
  # both. Updates stay zero-downtime anyway: the default RollingUpdate (maxSurge 25% -> 1) starts
  # the new pod before the old one exits, which is the only property the second replica was ever
  # buying.
  replicas: 1
  selector:
    matchLabels:
      app: techdelivery-site
  template:
    metadata:
      labels:
        app: techdelivery-site
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101   # the nginx user inside nginxinc/nginx-unprivileged
        runAsGroup: 101
      containers:
        - name: site
          image: ghcr.io/techdelivery/techdelivery-site@sha256:c644a54e20c74d60fa9b309a94baf3b192a9349f4eb71fb933490b6bbb0d3632
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          # The two paths nginx-unprivileged writes: its pid file (/tmp/nginx.pid) and its proxy
          # temp/cache tree. With a read-only rootfs these emptyDirs are what make it boot; without
          # them the failure is at startup, not somewhere interesting.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
          readinessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 20
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
        - name: cache
          emptyDir:
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: techdelivery-site
  labels:
    app: techdelivery-site
  namespace: site
spec:
  type: ClusterIP
  selector:
    app: techdelivery-site
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: techdelivery-site
  namespace: site
  # Cleartext is not served, it is ANSWERED: `web` is on the router so http:// reaches Traefik and
  # the redirect-to-https Middleware 301s it to https. This is per-host on purpose — a global
  # HTTP->HTTPS redirect on the Traefik install would change behaviour for every other host here,
  # several of which answer on :80 by decision (see the PIN_REQUIRED comment in
  # tools/ingress-auth-check.py). Verified after apply with:
  #   curl -o /dev/null -w '%{http_code}\n' http://www.techdelivery.es/   -> expect 301
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: site-redirect-to-https@kubernetescrd
  # No AUTH middleware: the site is public on purpose; see the header. The ingress-auth gate
  # is scoped to the titan apex and does not read this host, so the header carries the decision.
spec:
  ingressClassName: traefik
  rules:
  - host: www.techdelivery.es
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: techdelivery-site
            port:
              number: 80
  tls:
  # Issued in `certificates` as techdelivery-es and mirrored by Reflector; `site` is on both
  # allow-lists there, which is what tls-reflection-check enforces.
  - hosts:
    - www.techdelivery.es
    secretName: techdelivery-es-tls
---
# Cleartext -> HTTPS, permanent. Applied to both routers here; Traefik runs it as a no-op on
# requests that already arrive on https, so one Middleware serves both jobs.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-to-https
  namespace: site
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
# Apex -> www, permanent. Runs only on the apex router. The port group is matched so a request that
# arrives with an explicit port still redirects cleanly (the port is dropped; no router here listens
# on anything but 80/443). Traefik chains a router's middlewares in NAME ORDER, and
# `redirect-to-https` sorts before `redirect-to-www`: an http://apex request is first sent to
# https (one hop), and the https request that comes back is then sent to www (second hop). Two
# hops for the rare http://apex visitor, one hop for https://apex and for http://www.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-to-www
  namespace: site
spec:
  redirectRegex:
    # permanent: true -> 301. redirectScheme above needed no such line because permanent is its
    # explicit option; redirectRegex DEFAULTS to 302, and a canonical-host redirect that search
    # engines should treat as final must be 301. Measured 2026-11-14: apex hop answered 302.
    permanent: true
    regex: ^https://techdelivery\.es(:[0-9]+)?(/.*)?$
    replacement: https://www.techdelivery.es${2}
---
# The apex router: it exists ONLY so the two redirects have somewhere to attach for
# techdelivery.es. No visitor ever reaches the backend through it — both middlewares short-circuit
# with a 301 — but an Ingress needs a backend, and pointing it at the site Service is the honest
# answer: if a middleware is ever deleted, the failure is "apex serves the site" (wrong canonical
# host, visible immediately), not a 404 that hides the missing redirect.
#
# The tls block is the other half of the fix: without the apex SAN on the Certificate, an
# https://techdelivery.es request gets Traefik's fallback default cert — the browser's
# "your connection is not private" wall appears BEFORE any redirect could run.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: techdelivery-apex
  namespace: site
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: site-redirect-to-https@kubernetescrd,site-redirect-to-www@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
  - host: techdelivery.es
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: techdelivery-site
            port:
              number: 80
  tls:
  - hosts:
    - techdelivery.es
    secretName: techdelivery-es-tls

# Google Drive -> OpenCloud, one-way, nightly.
#
# WHY THIS EXISTS AS A JOB AND NOT ON SOMEONE'S LAPTOP
# The alternative is rclone on a workstation, which is cheaper to build and worse: it only runs when
# that machine is on, and a sync nobody can see fail is a sync that stopped months ago. A CronJob is
# visible to `kubectl get jobs`, it is covered by the same kube_job_status_failed shape the k8s-casa
# backup alerts already use, and its config is in git like everything else here.
#
# WHY ONE-WAY `copy` AND NOT `sync` OR `bisync`
# Deliberate, and the reason is the backup gap, not taste. Neither half of OpenCloud is backed up:
# `files/opencloud-data` is un-annotated for restic and casa cannot mirror the `opencloud-blobs`
# bucket (spec 4, docs/superpowers/specs/2026-10-22-titan-restic-pv-backups-design.md). So the only
# copy of anything here is the copy here. `rclone sync` deletes at the destination whatever is
# missing at the source, which means a Drive-side mistake -- a folder trashed and emptied, a shared
# drive reorganised, a stale second laptop syncing over the top -- becomes a deletion here, and
# there is no restore path to catch it. `rclone copy` cannot delete. That is the whole design: this
# job can only ever add and overwrite. If deletions ever do need to propagate, use
# `sync --backup-dir trash/<date>` and never bare `sync`, and read the gap note above first.
#
# `bisync` was rejected for two reasons beyond direction. rclone still marks it beta, and it needs a
# persistent state directory, which means a PVC whose loss makes the next run treat both sides as
# new -- a state volume that would itself be un-backed-up, sitting under a two-way sync.
#
# WHERE THE FILES LAND -- a dedicated project space, not Personal
# The [titan] remote in drive-sync-secrets points at /remote.php/dav/spaces/<space-id> for the
# "google-drive-archive" project space, NOT at /remote.php/webdav/ (which is the Personal space).
# Not tidiness: the desktop client mirrors Personal, so an import landing there downloads ~31 GB onto
# every laptop that syncs Personal, and the only lever is the client's "Choose What to Sync" checkbox
# -- a thing someone can un-tick by accident, and a thing that must be remembered per device. Landing
# in a space the client does not sync removes the failure mode instead of mitigating it.
#
# THE SPACE ID IS NOT THE BARE UUID. Measured against live OpenCloud on 2026-11-10: the bare space
# UUID, the slug "google-drive-archive", and the `<uuid>!<node>` form all fail with "directory not
# found", and the collection root /remote.php/dav/spaces/ answers 405 Method Not Allowed to PROPFIND.
# What works is the full `<spaceId>$<nodeId>` form, which is what the web UI puts in the fileId query
# parameter of /files/spaces/project/<slug>. Verified end to end with the app token before committing:
# listed the space root, wrote a probe file, read it back with mtime intact to sub-second precision
# (the infinitescale vendor quirks working), deleted it cleanly.
#
# The destination is the space ROOT, so OpenCloud's own `.space/` metadata directory sits alongside
# the imported tree. `copy` walks the source only and never deletes, so rclone does not touch it; it
# would collide only if Drive ever held a folder literally named `.space`.
#
# WHY AN APP TOKEN AND NOT A PASSWORD
# authentik is the identity provider (OC_EXCLUDE_RUN_SERVICES=idp), so there is no OpenCloud password
# to hand a client that cannot do OIDC. rclone is such a client: its webdav backend speaks
# Authorization: Basic and nothing else. App tokens are the supported bridge, and they are ALREADY
# enabled here -- AllowAppAuth defaults to true in 8.1.0 and auth-app runs by default. Both were
# confirmed by an actual authenticated listing of the personal space rather than read off the
# manifest; opencloud.yaml pins the two settings explicitly anyway. docs/drive-sync.md.
#
# NOTE ON THE WEBDAV USERNAME
# Under autoprovisioning (PROXY_AUTOPROVISION_ACCOUNTS=true) the login name is not necessarily a
# valid WebDAV username; OpenCloud's own docs say only the account UUID may work, and the UUID is
# shown on the Preferences page. Both are carried in the rclone.conf, so this file does not care
# which one turned out to be right.
#
# WHY THE CONFIG IS COPIED OUT OF THE SECRET BEFORE RUNNING
# rclone rewrites its own config file when it refreshes an OAuth token. The Secret mounts read-only,
# so pointing RCLONE_CONFIG straight at it makes every run fail on a write error that looks like a
# permissions bug and is really a design bug. The copy to the emptyDir is the fix, and it is also
# correct about the consequence: a rotated refresh token is written to an ephemeral layer and lost,
# which is fine because Google does not rotate refresh tokens on refresh -- it returns a new access
# token and hands back the same refresh token. If that ever changes, the symptom is this job
# re-authenticating from scratch every night, not silent corruption.
#
# WHY XDG_CACHE_HOME AND TMPDIR ARE SET EXPLICITLY
# Same trap apply/70-backup/housekeeping.yaml documents for restic: caches resolve from
# $XDG_CACHE_HOME or $HOME, and uid 65534 has no writable HOME. rclone survives it better than
# restic did, but it loses its directory cache every run without this, which on a Drive tree of any
# size means re-listing the whole tree nightly.
#
# WHY IT IS NO LONGER SUSPENDED
# It shipped suspended so the first run -- the whole tree into a bucket that has no backup -- could
# be watched by hand instead of discovered at 04:00. Two shakedown runs were watched on 2026-11-10
# and both were stopped by hand before finishing; the first is what surfaced the missing spool
# directory fixed in #271, which is exactly what the pause was for.
#
# WHAT A GREEN RUN STILL DOES NOT PROVE -- the honest caveat on turning this on:
#   - rclone `copy` exits 0 having transferred nothing. The log tail is not evidence. Count ERROR
#     lines, or read the transferred-bytes total, before believing a run.
#   - Drive permits two files with the same name in the same folder; WebDAV does not. Measured on
#     the live tree: 37 such paths out of 34,965 files, with distinct Drive file IDs and in at least
#     one pair distinct sizes -- so they are different documents, not one object listed twice.
#     rclone keeps one and ignores the rest at NOTICE level with exit 0. There is no rclone flag for
#     renaming on collision; a real fix means listing Drive by file ID and synthesising unique
#     destination names, which is a feature and not an option.
# The preflight below still catches a placeholder Secret, so a Secret emptied later reads as its own
# message rather than as an auth failure.
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: drive-sync
  namespace: files
  labels:
    app: drive-sync
    app.kubernetes.io/name: drive-sync
    app.kubernetes.io/component: google-drive-import
    app.kubernetes.io/part-of: opencloud
spec:
  # 04:00 UTC. Clear of the restic volume block (18:30-21:00 starts, longest deadline ending 02:30)
  # and of the 09:00 housekeeping job, so a slow Drive night never overlaps a backup window on the
  # same MinIO target.
  schedule: "0 4 * * *"
  timeZone: "UTC"
  # A second concurrent copy against the same destination would race on the same paths. Forbid, not
  # Allow, and not Replace -- Replace would kill a legitimately long first run at the next deadline.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  # Flip to false in a commit once apply/10-secrets/drive-sync-secrets.yaml holds real credentials.
  suspend: false
  jobTemplate:
    spec:
      backoffLimit: 1
      # The first run moves the whole tree. At roughly 2 files/second out of Drive -- which is
      # Google's rate limit and is nothing to do with this cluster's bandwidth -- a tree of tens of
      # thousands of small files is hours, not minutes. 31 GiB of large files is under an hour.
      # Generous on purpose: a deadline that kills a half-finished import just retries tomorrow, but
      # one that kills it at 90% every night means the import never finishes.
      activeDeadlineSeconds: 14400
      ttlSecondsAfterFinished: 172800
      template:
        metadata:
          labels:
            app: drive-sync
            app.kubernetes.io/component: google-drive-import
            app.kubernetes.io/part-of: opencloud
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: rclone
              # 1.76.0, pinned by digest the same way apply/70-backup pins restic. A moving tag here
              # means the thing that broke at 04:00 is not in git.
              image: docker.io/rclone/rclone@sha256:075cf0e4e0f623996646cfb8a434c71cb4fcfe75bbbe27ccbb296ca04a7cd260
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  # mkdir BEFORE anything else, and this is not defensive padding: TMPDIR and
                  # XDG_CACHE_HOME below point at /work/tmp and /work/cache, and rclone does NOT
                  # create its own spool directory. Measured on the first real run (manual job,
                  # 2026-11-10): 196 files copied cleanly and 11 died with
                  # "failed to create temporary spool file: open /work/tmp/rclone-spoolNNN: no
                  # such file or directory". Only files that need to buffer hit it, so a run can
                  # look healthy while quietly dropping a fraction of the tree -- the exact shape
                  # of partial failure that reads as success, and the reason the log tail is not
                  # evidence. /work exists because it is the emptyDir mount; its children do not.
                  mkdir -p /work/tmp /work/cache
                  # Read-only Secret mount -> writable working copy. See the header.
                  cp /rclone-config/rclone.conf /work/rclone.conf
                  chmod 600 /work/rclone.conf

                  if grep -q 'REPLACE_WITH' /work/rclone.conf; then
                    echo "ABORT: drive-sync-secrets still holds the placeholder rclone.conf." >&2
                    echo "ABORT: mint the Google token and the OpenCloud app token, re-encrypt," >&2
                    echo "ABORT: and set spec.suspend=false. See docs/drive-sync.md." >&2
                    exit 1
                  fi

                  # Preflight both sides separately, because "the sync failed" makes two unrelated
                  # faults look like one. Mirrors the shape of apply/70-backup/preflight.yaml: fail
                  # before transferring anything, and name the side that is broken.
                  if ! rclone lsf gdrive: --max-depth 1 >/dev/null 2>&1; then
                    echo "ABORT: Google Drive rejected the token -- expired consent or a revoked" >&2
                    echo "ABORT: OAuth client. Re-run the auth flow; docs/drive-sync.md step 2." >&2
                    exit 1
                  fi
                  if ! rclone lsf titan: --max-depth 1 >/dev/null 2>&1; then
                    echo "ABORT: OpenCloud WebDAV rejected the app token. Either the token expired," >&2
                    echo "ABORT: or PROXY_ENABLE_APP_AUTH / auth-app are not live, or the username is" >&2
                    echo "ABORT: the wrong one for autoprovisioning. docs/drive-sync.md step 3." >&2
                    exit 1
                  fi
                  echo "preflight: both remotes answered"

                  # `copy`, never `sync` -- see the header. This command cannot delete anything at the
                  # destination and that is the safety property the whole file is built around.
                  # Destination is the space ROOT: the [titan] url already points inside the
                  # google-drive-archive space, so a path here would only nest the archive inside
                  # itself. docs/drive-sync.md has the space-id form and how it was verified.
                  exec rclone copy gdrive: titan: \
                    --fast-list \
                    --transfers 4 \
                    --checkers 8 \
                    --drive-export-formats docx,xlsx,pptx,svg \
                    --retries 3 \
                    --low-level-retries 10 \
                    --stats 60s \
                    --stats-one-line \
                    --log-level INFO
              env:
                - name: RCLONE_CONFIG
                  value: /work/rclone.conf
                - name: XDG_CACHE_HOME
                  value: /work/cache
                - name: TMPDIR
                  value: /work/tmp
                - name: HOME
                  value: /work
              volumeMounts:
                - name: rclone-config
                  mountPath: /rclone-config
                  readOnly: true
                - name: work
                  mountPath: /work
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  # --fast-list holds the Drive tree in memory. 31 GiB of content is irrelevant here;
                  # what this bounds is file count. Raise it if the tree ever grows past a few
                  # hundred thousand entries and the job starts being OOMKilled rather than slow.
                  memory: 768Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                seccompProfile:
                  type: RuntimeDefault
                capabilities:
                  drop:
                    - ALL
          volumes:
            - name: rclone-config
              secret:
                secretName: drive-sync-secrets
                # 0440, not 0400: the file is owned by root and group-owned by fsGroup, so uid 65534
                # reads it through the group bit. A 0400 mode denies the container its own credential
                # and the failure is a read error on a file that plainly exists.
                defaultMode: 0440
            - name: work
              emptyDir: {}

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The database, alone, in its own stage directory. Split out of the shared apps unit on
# 2026-10-19; the reasoning is in
# docs/superpowers/plans/2026-10-19-titan-apps-stage-split.md and it is short: Flux applies a
# Kustomization atomically, so if any object in a unit fails server-side dry-run nothing in that
# unit is applied. The unit boundary is the failure boundary. Before the split, a typo in a Tesla
# ConfigMap could freeze the reconcile of this Cluster along with everything else.
#
# It is a numbered directory under apply/, not a subdirectory of 50-apps, because in this repo the
# numbered directories ARE the stages — one directory, one Flux Kustomization. Nesting three
# stages inside 50-apps would have worked mechanically and broken the layout convention.
#
# Two files, both almost never edited. That is the point — this stage exists so that the thing
# nobody touches cannot be blocked by the thing that gets touched weekly.
#
# This stage is named `databases` and its objects live in namespace `databases`; the stage order is
# what puts the CNPG operator (20-infra) ahead of the Cluster. There is deliberately no top-level
# `namespace:` field — it rewrites them all.
resources:
  - postgres.yaml
  - postgres-backup.yaml
